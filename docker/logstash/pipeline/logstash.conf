# 앱(logback LOGSTASH appender)이 TCP로 보내는 JSON 한 줄을 받는다
input {
  tcp {
    port => 5000
    # 한 줄 최대 크기. 긴 예외 스택도 들어가는 1MB로 둔다 (기본 512MB는 메모리를 다 쓸 수 있다)
    codec => json_lines { decode_size_limit_bytes => 1048576 }
  }
}

# 로컬은 저장소 없이 표준 출력으로만 보여 준다. 저장소를 붙일 때 여기에 output을 더한다
output {
  stdout {
    codec => rubydebug
  }
}
