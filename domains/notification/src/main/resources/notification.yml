# 알림 도메인 설정. application.yml이 가져온다
#
# 메일 발송 환경 변수         필수 여부                              뜻
# MAIL_USERNAME   실제로 보내려면 필수 (없으면 로그만)   Gmail SMTP 로그인 아이디 = 공용 Gmail 주소. 기본 보내는 주소
# MAIL_PASSWORD   실제로 보내려면 필수 (없으면 로그만)   Gmail 앱 비밀번호 16자리 (공백 없이). 비밀 값: 로컬 .env · GitHub Secret에만 둔다
# MAIL_ENABLED    선택 (기본 true)                       false면 계정이 있어도 보내지 않고 로그만 남긴다
# MAIL_FROM       선택 (기본 MAIL_USERNAME)              받는 사람에게 보이는 보내는 주소
#
# 웹 푸시 환경 변수           필수 여부                                    뜻
# FIREBASE_CREDENTIALS  실제로 보내려면 필수 (없으면 SKIPPED · 로그만)   FCM 서비스 계정 키 JSON 파일 전체를 Base64로 감싼 값
#                                                                        (base64 -i key.json). 비밀 값: 로컬 .env · GitHub Secret에만 둔다

# 알림 메일 발송용 Gmail SMTP. 팀 공용 계정과 앱 비밀번호(2단계 인증을 켠 뒤 발급)를 쓴다
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # SMTP가 느려도 요청이 오래 묶이지 않게 한다 (ms)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# 메일 헬스체크를 끈다. SMTP 장애로 /actuator/health가 DOWN이 되면 배포 healthcheck가 실패한다
management:
  health:
    mail:
      enabled: false

kidly:
  mail:
    # 기본 켬. false면 보내지 않고 받는 사람 · 제목만 로그로 남긴다.
    # 켜져 있어도 계정(MAIL_USERNAME · MAIL_PASSWORD)이 없으면 보내지 않고 로그만 남긴다 (앱은 뜬다)
    enabled: ${MAIL_ENABLED:true}
    # 보내는 주소. 없으면 MAIL_USERNAME
    from: ${MAIL_FROM:}
  notification:
    # 메일 본문에 넣는 사이트 주소. 서버는 deploy/.env.<환경>의 값을 쓴다
    site-url: ${NOTIFICATION_SITE_URL:http://localhost:5173}
    # 실패 · 멈춘 알림을 다시 보내는 주기
    retry-interval: PT1M
    # 보존 기간(90일)이 지난 알림함 알림을 지우는 시각(cron, 초 분 시 일 월 요일, KST). "-"면 정리하지 않는다
    inbox-cleanup-cron: "0 0 4 * * *"
    # 웹 푸시 FCM 서비스 계정 키(JSON의 Base64). 없으면 푸시를 보내지 않는다(앱은 뜬다)
    firebase-credentials: ${FIREBASE_CREDENTIALS:}
    # 270일 동안 다시 등록되지 않은 푸시 FID를 지우는 시각(cron, KST). "-"면 정리하지 않는다
    push-token-cleanup-cron: "0 10 4 * * *"
