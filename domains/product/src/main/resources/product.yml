kidly:
  product:
    image:
      s3:
        bucket: team04-kidly-s3
        region: ap-northeast-2
        key-prefix: ${PRODUCT_IMAGE_KEY_PREFIX:local}
        fake-credentials: false
    outbox:
      relay-interval: PT1S
      batch-size: 100
      retention: P7D
      cleanup-cron: "0 0 4 * * *"
    # true · false만 쓴다(다른 값이면 리스너가 시작하지 않는다)
    kafka:
      consumer:
        enabled: ${PRODUCT_KAFKA_CONSUMER_ENABLED:true}
