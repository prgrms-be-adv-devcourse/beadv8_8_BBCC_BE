# 상품 도메인 설정. application.yml이 가져온다
# 값이 비었거나 형식이 맞지 않으면 키 이름이 나오는 오류로 기동 실패 (ProductImageS3Properties, ProductOutboxProperties)

kidly:
  product:
    image:
      # 판매자가 상품 이미지를 직접 올리는 S3. 서버가 업로드 주소(Presigned URL)에 서명하고, 업로드한 이미지는 공개 주소로 보여 준다
      s3:
        # dev와 prod가 같은 버킷을 쓰고 key-prefix 경로로만 나눈다
        bucket: team04-kidly-s3
        region: ap-northeast-2
        # 객체 key 맨 앞의 환경 경로(소문자만). 서버는 PRODUCT_IMAGE_KEY_PREFIX로 dev · prod를 넣는다(application-prod.yml)
        key-prefix: ${PRODUCT_IMAGE_KEY_PREFIX:local}
        # 서버는 false로 EC2 IAM 역할의 자격 증명을 쓴다. 로컬 · 테스트는 AWS에 접근할 수 없어 true로 가짜 자격 증명을 쓴다
        # true면 주소 형식은 같지만 S3가 서명을 거절해 실제로 올라가지는 않는다
        fake-credentials: false
    # Kafka로 보낼 상품 이벤트를 아웃박스에서 꺼내 보내는 릴레이
    outbox:
      # 릴레이를 부르는 주기. 이전 실행이 끝난 뒤부터 재며, 짧게 둬서 다른 도메인이 이벤트를 받을 때까지의 지연을 줄인다
      relay-interval: PT1S
      # 한 번 실행에서 보내는 최대 건수. 남은 메시지는 다음 실행에서 보낸다
      batch-size: 100
      # 보낸 메시지를 남겨 두는 기간. 브로커의 보존 기간(7일)과 같다
      retention: P7D
      # 보존 기간이 지난 메시지를 지우는 시각. 매일 04:00
      cleanup-cron: "0 0 4 * * *"
    # 상품이 받는 판매자 · 주문 이벤트. true면 Kafka로만 받고, false면 Kafka 리스너를 시작하지 않고 주문 이벤트를 Spring 이벤트로 받는다
    # 상품 서비스에는 주문 이벤트를 Spring으로 내는 곳이 없으므로, 서버에서 false로 두면 수신이 멈춘다(재고 차감 · 결제 요청도 멈춘다). Spring으로 받는 길은 테스트만 쓴다
    # 멈춘 동안 메시지는 Kafka에 남고 true로 올리면 처리된다. 같은 이벤트를 양쪽에서 받지 않는다. true · false만 쓴다(다른 값이면 양쪽 모두 받지 않는다)
    # 로컬 실행은 Kafka가 떠 있어야 받는다(docker compose)
    kafka:
      consumer:
        enabled: ${PRODUCT_KAFKA_CONSUMER_ENABLED:true}
