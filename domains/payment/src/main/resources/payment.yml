# 결제 도메인 설정. application.yml이 가져온다

# 토스페이먼츠. 시크릿 키가 없으면 앱은 뜨지만 토스 호출이 인증 오류로 거절된다
toss:
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: https://api.tosspayments.com
  connect-timeout: 3s
  read-timeout: 30s

# 토스 paymentKey 암호화 키(Base64 32바이트). 없으면 앱이 뜨지 않는다. 로컬 · 테스트는 프로필 설정의 개발용 키를 쓴다
payment:
  key-encryption:
    key: ${PAYMENT_KEY_ENCRYPTION_KEY:}
