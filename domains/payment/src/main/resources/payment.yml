# 결제 도메인 설정. application.yml이 가져온다

# 토스페이먼츠. 시크릿 키가 없으면 앱은 뜨지만 토스 호출이 인증 오류로 거절된다
toss:
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: https://api.tosspayments.com
  connect-timeout: 3s
  read-timeout: 30s

# 토스 paymentKey 암호화 키(Base64 32바이트). 없으면 앱이 뜨지 않는다. 로컬 · 테스트는 프로필 설정의 개발용 키를 쓴다
payment:
  key-encryption:
    key: ${PAYMENT_KEY_ENCRYPTION_KEY:}

# 결제 이벤트 아웃박스(#550). 업무 트랜잭션이 저장한 메시지를 릴레이가 Kafka(kidly.payment.events)로 보낸다
# 값이 비었거나 형식이 맞지 않으면 키 이름이 나오는 오류로 기동 실패 (PaymentOutboxProperties)
kidly:
  payment:
    outbox:
      # 릴레이 주기(1초 이상, 이전 실행이 끝난 뒤부터 잰다). 실패하면 멈췄다가 다음 주기에 같은 메시지부터 보낸다
      relay-interval: ${PAYMENT_OUTBOX_RELAY_INTERVAL:PT1S}
      # 한 번 실행에서 보내는 최대 건수(1 이상). 남은 건은 다음 주기에 보낸다
      batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:100}
      # 보낸 메시지를 남겨 두는 기간(1초 이상). Kafka 보존 기간(7일)과 같다. 안 보낸 메시지는 지우지 않는다
      retention: ${PAYMENT_OUTBOX_RETENTION:P7D}
      # 이 횟수(1 이상)만큼 보내지 못한 메시지는 같은 키의 뒤 메시지만 막고 다른 메시지를 계속 보낸다(#1389).
      # 그 뒤 다른 메시지가 보내지면 그 메시지만의 문제로 보고 격리한다. 격리된 키는 관리자가 다시 보내기 전까지 멈춘다.
      # 브로커 전체 장애는 다른 메시지도 보내지지 않으므로 격리하지 않는다. 한 파티션만 잠깐 멈춰도 격리되지 않게 넉넉히 둔다
      max-attempts: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:30}
      # 정리 실행 시각(cron, 초 분 시 일 월 요일, KST). "-"면 정리하지 않는다
      cleanup-cron: ${PAYMENT_OUTBOX_CLEANUP_CRON:0 0 4 * * *}
    # 결제가 받는 회원 · 주문 이벤트(#593). true면 Kafka로만 받고, false면 Kafka 리스너를 시작하지 않는다.
    # false일 때 주문 이벤트는 Spring 이벤트로 받지만, 회원 이벤트는 Spring 리스너가 없어 받지 않는다(지갑 생성 · 동결이 멈춘다)
    # 장애 때 되돌리는 스위치다. 같은 이벤트를 양쪽에서 받지 않는다. 정산 지급 요청은 아래 별도 스위치를 따른다
    kafka:
      consumer:
        enabled: ${PAYMENT_KAFKA_CONSUMER_ENABLED:true}
      # 정산 지급 요청(settlement.payout-requested)을 Kafka로 받을지(#607). 기본 true: 결제 서비스는 정산과 다른 JVM이라 Spring 이벤트가 오지 않는다(#525)
      # false는 같은 JVM 안에서 정산이 Spring 이벤트로 보내는 테스트용이다
      settlement-consumer:
        enabled: ${PAYMENT_KAFKA_SETTLEMENT_CONSUMER_ENABLED:true}
