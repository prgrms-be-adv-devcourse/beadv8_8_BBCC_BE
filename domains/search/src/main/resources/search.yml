# 검색 도메인 설정. 검색 서비스(apps/search-service)의 application.yml이 가져온다
# 값이 비었거나 형식이 맞지 않으면 키 이름이 나오는 오류로 기동 실패 (SearchIndexProperties)

spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

kidly:
  search:
    index:
      # 색인 이름 맨 앞의 환경 이름(소문자만). dev와 prod가 Elasticsearch 하나를 색인 이름으로만 나눠 쓸 수 있다
      prefix: ${SEARCH_INDEX_PREFIX:local}
    # 의미 검색(#797). 상품 문장과 검색어를 OpenAI 임베딩으로 벡터로 바꾼다
    embedding:
      # 비어 있으면 의미 검색을 끈다(로컬 · 테스트 · CI). 서버는 GitHub Secret OPENAI_API_KEY가 서버 .env로 들어간다
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: text-embedding-3-small
      # elasticsearch/products.json의 embedding dims와 같아야 한다. 바꾸면 색인을 새로 만들고 다시 채운다
      dimensions: 512
      # 이보다 뜻이 먼(코사인 유사도가 낮은) 상품은 의미 검색으로 더하지 않는다
      min-similarity: 0.3
