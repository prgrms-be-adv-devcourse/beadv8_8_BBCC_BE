# 정산 도메인 설정. application.yml이 가져온다
kidly:
  settlement:
    # 수수료율(0 이상 1 이하, 소수 넷째 자리까지). 정산서를 만들 때의 값을 정산서에 저장한다. 기본 10%
    fee-rate: ${SETTLEMENT_FEE_RATE:0.1}
    # 자동 정산 cron (Asia/Seoul). 기본 매월 1일 0시. "-"면 자동 실행을 끈다
    run-cron: ${SETTLEMENT_RUN_CRON:0 0 0 1 * *}
    # 지급 결과를 30분 넘게 못 받은 정산서를 다시 요청하는 cron (Asia/Seoul). 기본 10분마다. "-"면 끈다
    payout-retry-cron: ${SETTLEMENT_PAYOUT_RETRY_CRON:0 */10 * * * *}
    # 한 트랜잭션에서 처리하는 판매자 수(1 이상). 실패하면 그 묶음을 판매자 1명씩 다시 처리한다
    chunk-size: ${SETTLEMENT_CHUNK_SIZE:100}
    # 정산 이벤트 아웃박스. 업무 트랜잭션이 저장한 메시지를 릴레이가 Kafka(kidly.settlement.events)로 보낸다
    # 값이 비었거나 형식이 맞지 않으면 키 이름이 나오는 오류로 기동 실패 (SettlementOutboxProperties)
    outbox:
      # 릴레이 주기(1초 이상, 이전 실행이 끝난 뒤부터 잰다). 실패하면 멈췄다가 다음 주기에 같은 메시지부터 보낸다
      relay-interval: ${SETTLEMENT_OUTBOX_RELAY_INTERVAL:PT1S}
      # 한 번 실행에서 보내는 최대 건수(1 이상). 남은 건은 다음 주기에 보낸다
      batch-size: ${SETTLEMENT_OUTBOX_BATCH_SIZE:100}
      # 보낸 메시지를 남겨 두는 기간(1초 이상). Kafka 보존 기간(7일)과 같다. 안 보낸 메시지는 지우지 않는다
      retention: ${SETTLEMENT_OUTBOX_RETENTION:P7D}
      # 정리 실행 시각(cron, 초 분 시 일 월 요일, KST). "-"면 정리하지 않는다
      cleanup-cron: ${SETTLEMENT_OUTBOX_CLEANUP_CRON:0 0 4 * * *}
    # 영업일 판단에 쓰는 공휴일 특일정보 API(한국천문연구원, 공공데이터포털)
    # 주소가 비었거나 시간 제한이 1초 미만이면 키 이름이 나오는 오류로 기동 실패 (SettlementHolidayProperties)
    holiday:
      base-url: ${SETTLEMENT_HOLIDAY_BASE_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService}
      # 인증키. 비어 있어도 기동하지만 공휴일 조회가 실패해 영업일을 판단하지 못한다
      service-key: ${HOLIDAY_API_SERVICE_KEY:}
      connect-timeout: PT3S
      read-timeout: PT5S
    # 정산이 받는 구매확정 · 지급 결과 이벤트. true면 Kafka로만 받고, false면 Kafka 리스너를 시작하지 않고 Spring 이벤트로 받는다
    # 장애 때 되돌리는 스위치다. 같은 이벤트를 양쪽에서 받지 않는다
    kafka:
      consumer:
        enabled: ${SETTLEMENT_KAFKA_CONSUMER_ENABLED:true}

spring:
  batch:
    job:
      # 기동할 때 작업을 저절로 돌리지 않는다. 스케줄러 · 관리자 API만 실행한다
      enabled: false
    jdbc:
      # Batch 메타데이터 테이블은 settlement 스키마에 둔다
      table-prefix: settlement.BATCH_
      # 메타데이터 테이블은 Flyway가 만든다 (db/migration/V202610160855__spring_batch_schema.sql)
      initialize-schema: never
      # Batch 기본(SERIALIZABLE)은 이 프로젝트의 Hibernate 연결 설정이 거부한다 (application.yml 참고)
      isolation-level-for-create: default
