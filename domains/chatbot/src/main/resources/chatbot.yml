# 챗봇 도메인 설정. application.yml이 가져온다

kidly:
  chatbot:
    # 답변 근거 찾기. 질문과 코사인 유사도가 min-score 이상인 조각을 점수 순으로 top-k개까지 답에 넣는다
    # 넘는 조각이 없어도 AI를 부른다(상품 질문은 문서가 아니라 상품 검색 도구로 답한다)
    retrieval:
      top-k: 4
      min-score: 0.3
    # 질문 하나에 쓰는 시간 상한(#1388). 넘으면 남은 OpenAI 호출을 멈추고 503 AI_TIMEOUT으로 답한다.
    # OpenAI chat 한 번이 15초 + 재시도 한 번이고 도구까지 부르면 몇 번을 부르므로, 이 상한이 없으면 Gateway 응답 제한(55초)을 넘겨
    # 회원은 504를 받는데 서비스는 계속 OpenAI를 부른다. Gateway보다 짧게 둔다
    answer:
      time-budget: 40s
    # 비용 상한(#1388). Gateway의 회원별 분당 10건과 별도로 서비스 전체 하루 질문 수를 챗봇 DB(question_usage)에 센다.
    # 넘으면 OpenAI를 부르지 않고 503 AI_DAILY_LIMIT_REACHED. 질문 하나가 OpenAI를 임베딩 1번 + chat 최대 4번 부른다
    # 이전 대화는 최근 것부터 history-chars자까지만 AI에 넘긴다(요청은 10턴 × 1,000자까지 받는다)
    quota:
      daily-questions: 2000
      history-chars: 3000
    # 상품 검색 도구가 부르는 검색 서비스(#1191). 내부 경로 GET /internal/products/search를 부른다
    search:
      uri: ${KIDLY_SEARCH_URI:http://localhost:8082}
    # 내 주문 조회 도구가 부르는 주문 서비스(#1191). 내부 경로 GET /internal/members/{memberId}/orders를 부른다
    order:
      uri: ${KIDLY_ORDER_URI:http://localhost:8091}

---
spring:
  config:
    activate:
      on-profile: "dev | prod"
kidly:
  chatbot:
    search:
      uri: ${KIDLY_SEARCH_URI}
    order:
      uri: ${KIDLY_ORDER_URI}
