# 주문 모듈 통합 · 기능 테스트 설정(#616). 앱 application.yml · auth.yml · application-test.yml 중 주문 · common에 필요한 값만 같게 둔다.
# order.yml은 application.yml이 불러온다(여기 값이 order.yml 기본값을 덮는다).
# 앱 설정이 바뀌면 여기도 맞춘다(같은 기준으로 돌아야 앱에서 돌 때와 결과가 같다)
spring:
  # 운영 마이그레이션은 대부분 앱 모듈에 있어, orders 스키마 기준(db/order-baseline)을 깔고 주문 모듈 마이그레이션을 올린다
  flyway:
    locations: classpath:db/order-baseline,classpath:db/migration
    default-schema: public
    schemas: public,orders
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        session_factory:
          statement_inspector: com.bbcc.kidly.global.config.ReadOnlyWriteGuard
  kafka:
    # Kafka 테스트는 Testcontainers 주소로 덮어쓴다
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
    # Kafka 리스너는 저절로 시작하지 않는다. 수신 테스트가 그 안에서 자기 리스너만 켜고 끈다
    listener:
      auto-startup: false
    # Kafka 컨테이너는 @KafkaIntegrationTest에서만 뜬다. 다른 테스트는 기동할 때 토픽을 만들려고 Kafka에 붙지 않는다
    admin:
      auto-create: false

kidly:
  # 커밋 뒤 Kafka로 보내지 않는다. Kafka 컨테이너가 있는 @KafkaIntegrationTest만 켠다
  kafka:
    producer:
      enabled: false
  # 스케줄러가 테스트 중 다른 스레드에서 저절로 돌지 않게 주기를 아주 길게 두고, 정리는 끈다. 테스트가 직접 부른다
  order:
    payment-expiry-interval: P3650D
    # 택배 조회 스케줄러도 같은 이유로 길게 둔다. 테스트는 실제 API를 부르지 않는다(인증값 비움 = 비활성)
    delivery-tracking:
      interval: P3650D
    delivery-tracker:
      client-id: ""
      client-secret: ""
    # 판매자 발송 전 부분 취소(#655)는 기본 켜짐(#924). 주문 모듈 테스트도 명시해 켜고 기능을 확인한다(꺼짐 거절은 단위 테스트)
    partial-cancel:
      enabled: true
    # 주문 운영 조회 MCP 창구(#925)는 운영 기본 꺼짐. 주문 모듈 테스트는 켜고 도구를 확인한다(꺼짐이면 경로 없음은 단위 테스트).
    # 상한은 기본(50)보다 작게 두어 줄이는 것을 적은 데이터로 확인한다
    mcp:
      enabled: true
      max-results: 3
    # 멈춘 주문 AI 진단(#926)은 운영 기본 꺼짐. 주문 모듈 테스트는 가짜 제공자(외부 호출 없음)로 켜고 주기는 길게 둔다(테스트가 직접 부른다)
    ai:
      enabled: true
      provider: fake
      model: fake-model
      interval: P3650D
    auto-confirm:
      interval: P3650D
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
    # 주문은 상품 · 재고 · 결제 이벤트를 Spring으로 받는다. Kafka 수신 테스트는 그 안에서 리스너를 켠다
    kafka:
      consumer:
        enabled: false
