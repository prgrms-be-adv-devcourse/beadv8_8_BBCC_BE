# 주문 도메인 설정. application.yml이 가져온다
# 기간 값은 모두 ISO-8601 기간 형식이다(PT10M = 10분, PT1M = 1분, P15D = 15일). 기본값이 이 파일 한 곳에만 있다
# 시간 값 네 개(결제 마감 · 자동 구매확정 기간 · 두 스케줄러 주기)는 모두 1초(PT1S) 이상이어야 한다. 0 · 음수 · 1초 미만이면 키 이름이 나오는 오류로 기동 실패

kidly:
  order:
    # ===== 주문 컨텍스트(boundedcontext.order): 결제 마감 · 자동 구매확정 · 아웃박스 · Kafka 수신 · 멈춘 주문 =====
    # 결제 마감(1초 이상). 주문하기부터 이 시간 안에 결제가 끝나지 않으면 결제 마감 만료로 취소한다
    # 기본 10분: 주문 설계 9장의 확정값. 결제 화면에서 결제를 마치기에 충분한 시간. 시연 때 만료 취소를 보이려면 짧게 둔다
    payment-timeout: ${ORDER_PAYMENT_TIMEOUT:PT10M}
    # 결제 마감 만료 스케줄러 주기(1초 이상, 이전 실행이 끝난 뒤부터 잰다). 마감이 지난 주문을 찾아 취소한다
    # 기본 1분: 마감보다 훨씬 짧아 만료가 최대 1분 늦게 반영된다. 시연 때 만료를 빨리 보이려면 짧게 둔다
    payment-expiry-interval: ${ORDER_PAYMENT_EXPIRY_INTERVAL:PT1M}
    auto-confirm:
      # 배송 완료 후 자동 구매확정까지(1초 이상). 이 기간이 지나면 구매자가 누르지 않아도 구매확정한다
      # 기본 15일: 주문 설계 9장의 확정값. 시연 때 자동 확정을 보이려면 몇 분으로 줄인다
      after: ${ORDER_AUTO_CONFIRM_AFTER:P15D}
      # 자동 구매확정 스케줄러 주기(1초 이상, 이전 실행이 끝난 뒤부터 잰다). 기간이 지난 주문상품을 찾아 확정한다
      # 기본 10분: 15일 기준이라 몇 분 늦어도 괜찮고 조회 부담이 적다. 시연 때 after를 줄였다면 함께 짧게 둔다
      interval: ${ORDER_AUTO_CONFIRM_INTERVAL:PT10M}
    # 두 스케줄러(결제 마감 만료 · 자동 구매확정)가 함께 쓰는 건수. 단위는 건(주문 · 주문상품), 1 이상 정수
    scheduler:
      # 한 번 조회하는 건수. 한 실행 안에서 마지막 처리 ID 다음부터 이 건수씩 이어서 읽는다
      # 기본 100: 한 번 읽는 양이 작아 DB 부담이 적고, 실패 건이 있어도 뒤쪽 건까지 같은 실행에서 닿는다. 대상이 아주 많을 때만 늘린다
      batch-size: ${ORDER_SCHEDULER_BATCH_SIZE:100}
      # 한 실행에서 처리하는 최대 건수. batch-size 이상이어야 한다(아니면 기동 실패). 닿으면 남은 건은 다음 실행에서 처리한다
      # 기본 1000: 한 실행이 너무 길어지지 않게 막는 상한. 밀린 건이 많아 한 번에 더 처리해야 할 때 늘리고, 시연 때는 그대로 둔다
      max-per-run: ${ORDER_SCHEDULER_MAX_PER_RUN:1000}
    # 주문 이벤트 아웃박스(#540). 업무 트랜잭션이 저장한 메시지를 릴레이가 Kafka(kidly.order.events)로 보낸다
    outbox:
      # 릴레이 주기(1초 이상, 이전 실행이 끝난 뒤부터 잰다). 안 보낸 메시지를 id 순서로 보낸다. 실패하면 멈췄다가 다음 주기에 같은 메시지부터
      # 기본 1초: 다른 도메인이 Kafka로 받을 때 지연이 짧게 느껴지는 수준. 안 보낸 메시지가 없으면 조회 한 번으로 끝난다
      relay-interval: ${ORDER_OUTBOX_RELAY_INTERVAL:PT1S}
      # 한 번 실행에서 보내는 최대 건수(1 이상). 남은 건은 다음 주기에 보낸다
      # 기본 100: 한 실행이 DB 트랜잭션을 오래 쥐지 않게 한다. 주문이 몰려 밀릴 때만 늘린다
      batch-size: ${ORDER_OUTBOX_BATCH_SIZE:100}
      # 보낸 메시지를 남겨 두는 기간(1초 이상). 지나면 정리가 지운다. 안 보낸 메시지는 지우지 않는다
      # 기본 7일: Kafka 보존 기간(7일)과 같아 그동안 무엇을 보냈는지 DB에서도 볼 수 있다
      retention: ${ORDER_OUTBOX_RETENTION:P7D}
      # 정리 실행 시각(cron, 초 분 시 일 월 요일). "-"면 정리하지 않는다
      # 기본 매일 04:00: 주문이 적은 새벽에 한 번
      cleanup-cron: ${ORDER_OUTBOX_CLEANUP_CRON:0 0 4 * * *}
    # 주문이 받는 이벤트(상품 · 재고 · 판매자 · 자녀)의 Kafka 수신(#541). 구독 그룹 kidly.order, 실패는 {토픽}.order.dlt
    kafka:
      consumer:
        # true면 Kafka 리스너 컨테이너가 앱 설정대로 시작한다(테스트는 spring.kafka.listener.auto-startup: false라 시작하지 않음)
        # false면 시작하지 않고(리스너 빈은 만든다) Spring 이벤트 수신으로 되돌아간다. 장애 때 되돌리는 용도
        # 로컬 실행은 Kafka가 떠 있어야 받는다(docker compose)
        enabled: ${ORDER_KAFKA_CONSUMER_ENABLED:true}
    # 관리자 멈춘 주문 조회(#445)의 기준 시간. 저장된 시각에 이 시간을 더한 기준 시각이 지금보다 이전이면 멈춘 것으로 본다
    # 여섯 값 모두 1초(PT1S) 이상이어야 한다. 0 · 음수 · 1초 미만 · 빈 값이면 키 이름이 나오는 오류로 기동 실패. 조회만 하고 상태는 바꾸지 않는다
    stuck:
      # 주문하기 뒤 결제 요청(재고 차감 완료)까지. 넘으면 STOCK_CHECK_STALE(재고 이벤트 유실 의심)
      # 기본 5분: 재고 차감은 보통 몇 초 안에 끝나므로 5분이면 이벤트가 빠졌다고 볼 만하다. 결제 마감(10분)보다 짧아 만료 전에 보인다
      stock-wait: ${ORDER_STUCK_STOCK_WAIT:PT5M}
      # 결제 마감 뒤 만료 취소까지. 넘으면 PAYMENT_EXPIRY_MISSED(만료 스케줄러 누락 의심, 결제 반영 실패 기록 PENDING인 주문은 뺌)
      # 기본 5분: 만료 스케줄러 주기(1분)보다 넉넉해 정상 지연은 나오지 않는다
      expiry-grace: ${ORDER_STUCK_EXPIRY_GRACE:PT5M}
      # 결제완료 뒤 판매자별 배송 생성까지. 넘으면 PAID_WITHOUT_DELIVERY(결제 완료 반영 누락 의심)
      # 기본 5분: 배송은 결제완료와 같은 트랜잭션에서 생기므로 원래 0건일 수 없다. 짧게 두어 빨리 보이게 한다
      delivery-wait: ${ORDER_STUCK_DELIVERY_WAIT:PT5M}
      # 결제 반영 실패 기록(PENDING)이 처음 기록된 뒤 관리자 처리까지. 넘으면 RECOVERY_PENDING_STALE(방치된 기록)
      # 기본 1시간: 관리자가 하루 중 확인할 여유를 주되 예치금이 빠진 채 오래 두지 않는다
      recovery-wait: ${ORDER_STUCK_RECOVERY_WAIT:PT1H}
      # 배송 준비 뒤 판매자 발송까지. 넘으면 SHIPPING_DELAYED(판매자 지연)
      # 기본 3일: 일반적인 출고 기한. 시연 때는 짧게 둔다
      shipping-wait: ${ORDER_STUCK_SHIPPING_WAIT:P3D}
      # 자동 구매확정 기간(auto-confirm.after)이 지난 뒤 확정까지. 넘으면 AUTO_CONFIRM_MISSED(자동 확정 스케줄러 누락 의심)
      # 기본 1시간: 자동 확정 스케줄러 주기(10분)보다 넉넉해 정상 지연은 나오지 않는다
      auto-confirm-grace: ${ORDER_STUCK_AUTO_CONFIRM_GRACE:PT1H}
      # 아웃박스 멈춤(#602): 보내지 못한 맨 앞 주문 이벤트 메시지(릴레이가 그 메시지에서 멈춰 뒤의 이벤트가 나가지 않음)
      # 시도 횟수가 이 값 이상이면 OUTBOX_STUCK(1 이상 정수)
      # 기본 10회: 릴레이는 1초마다 시도하고 한 번에 최대 15초 기다리므로 약 10초~2.5분 연속 실패. 브로커가 잠깐 끊긴 것은 넘기고
      # 크기 초과처럼 다시 해도 안 되는 메시지는 몇 분 안에 보인다
      outbox-attempts: ${ORDER_STUCK_OUTBOX_ATTEMPTS:10}
      # 만든 뒤 이 시간이 지나도 못 보냈으면 OUTBOX_STUCK(1초 이상). 릴레이가 아예 돌지 않아 시도 횟수가 늘지 않는 경우도 잡는다
      # 기본 5분: 정상이면 1초 안에 나간다. 재고 대기(stock-wait)와 같은 감각
      outbox-wait: ${ORDER_STUCK_OUTBOX_WAIT:PT5M}

    # ===== 조르기 컨텍스트(boundedcontext.wish) =====
    # 조르기(#640): 부모 · 자녀 공용 장바구니(/api/v1/wishes). 팀이 정책을 확정하지 않아 통째로 끌 수 있게 둔다
    wish:
      # false면 조르기 API · 빈이 뜨지 않는다(표는 그대로 남는다). 기본 true
      enabled: ${ORDER_WISH_ENABLED:true}

    # ===== 배송 컨텍스트(boundedcontext.delivery) =====
    # 택배 조회 스케줄러(배송 컨텍스트, #650). 발송 중인 배송을 Delivery Tracker에 조회해 완료된 건을 배송 완료한다
    delivery-tracking:
      # 주기(1초 이상, 이전 실행이 끝난 뒤부터 잰다). 기본 10분: 실제 배송 상태는 시간 단위로 바뀐다. 시연 때는 PT1M 정도로 줄인다
      interval: ${ORDER_DELIVERY_TRACKING_INTERVAL:PT10M}
      # 한 번 읽는 배송 수 · 한 실행 상한(batch-size 이상). 호출 간격 200ms라 1000건이면 한 실행이 약 200초
      batch-size: ${ORDER_DELIVERY_TRACKING_BATCH_SIZE:100}
      max-per-run: ${ORDER_DELIVERY_TRACKING_MAX_PER_RUN:1000}
    # Delivery Tracker 연결. 인증값이 비어 있으면 택배 조회를 하지 않는다(판매자 수동 배송 완료는 그대로). 인증값은 환경변수로만 넣는다
    delivery-tracker:
      base-url: ${DELIVERY_TRACKER_BASE_URL:https://apis.tracker.delivery}
      client-id: ${DELIVERY_TRACKER_CLIENT_ID:}
      client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET:}
      connect-timeout: PT3S
      # 실제 택배사 응답은 최대 2초 안팎(10/15 측정). 문서 권장 상한 15초 안
      read-timeout: PT10S
      # 호출 한도 초당 10회. 200ms 간격 = 초당 5회
      min-call-interval: PT0.2S

    # 장바구니(boundedcontext.cart) 컨텍스트는 아직 설정이 없다
