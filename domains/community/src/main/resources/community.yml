# 커뮤니티 도메인(리뷰 · 찜) 설정. application.yml이 가져온다

kidly:
  community:
    # 커뮤니티가 받는 이벤트의 Kafka 수신. 구독 그룹 kidly.community, 실패는 1초 간격 3번 재시도 뒤 {토픽}.community.dlt
    # 지금 받는 것: kidly.product.events의 product.changed(상품 복사본),
    #   kidly.order.events의 order-item.purchase-confirmed(리뷰 작성 자격),
    #   kidly.member.events의 member.withdrawn(찜 정리 · 리뷰 작성자 탈퇴 표시)
    kafka:
      consumer:
        # true면 Kafka 리스너 컨테이너가 앱 설정대로 시작한다(테스트는 spring.kafka.listener.auto-startup: false라 시작하지 않음)
        # false면 시작하지 않고(리스너 빈은 만든다) Spring 이벤트 수신으로 되돌아간다. 장애 때 되돌리는 용도
        # 로컬 실행은 Kafka가 떠 있어야 받는다(docker compose)
        enabled: ${COMMUNITY_KAFKA_CONSUMER_ENABLED:true}
    review:
      # 리뷰 사진. 서버가 업로드 주소(Presigned PUT)에 서명하고 브라우저가 S3에 직접 올린다. 올린 사진은 공개 주소로 보여 준다
      # 값이 비었거나 형식이 틀리면 키 이름이 나오는 오류로 기동에 실패한다
      image:
        # 환경들이 한 버킷을 쓰고 key-prefix 경로로만 나눈다(경로: {key-prefix}/reviews/{회원 ID}/{UUID}.{확장자})
        bucket: team04-kidly-s3
        region: ap-northeast-2
        # 객체 key 맨 앞의 환경 경로(소문자만). 따로 주지 않으면 서버 프로필(SPRING_PROFILES_ACTIVE: dev · prod)을 그대로 쓰고,
        # 프로필을 주지 않은 로컬 실행 · 테스트는 local이다
        # 프로필을 여러 개 켜면(예: dev,monitoring) 쉼표가 들어가 소문자 검사에 걸려 기동에 실패하므로 COMMUNITY_REVIEW_IMAGE_KEY_PREFIX를 지정한다
        key-prefix: ${COMMUNITY_REVIEW_IMAGE_KEY_PREFIX:${spring.profiles.active:local}}
        # 서버는 false로 EC2 역할의 자격 증명을 쓴다. 로컬 · 테스트는 아래 프로필 설정이 true로 바꾼다
        fake-credentials: false
        # 리뷰 한 건의 최대 사진 장수(업로드 주소 발급 · 작성 · 수정). 코드 수정 없이 이 값만 바꿔 조절한다
        max-count: 5
        # 사진 한 장 최대 크기(서명에 크기를 넣어 이 크기 이하로만 올라간다)
        max-file-size: 10MB
        # 업로드 주소 서명 유효 시간
        upload-url-expiry: PT5M
        # 리뷰에 새로 붙는 사진이 실제로 올라갔는지 확인하는 방식. s3(HeadObject: 없으면 400, 장애 · 시간 초과 · 권한 문제면 503) · none(확인 안 함)
        # 로컬 프로필은 아래에서 none(가짜 자격 증명이라 S3에 닿지 않는다). 서버 역할에 리뷰 경로의 GetObject와 ListBucket이 있어야
        # 없는 사진이 404(→ 400)로 보인다(ListBucket이 없으면 403 → 503)
        upload-check: s3
        # 업로드 확인 한 장의 시간 제한(S3 API 호출 시간 제한)
        upload-check-timeout: PT2S
        # 쓰이지 않는 리뷰 사진 정리(#1036). 리뷰 수정 · 삭제로 빠진 사진은 그 트랜잭션에서 정리 대기에 넣고, 업로드만 하고 붙이지 않은 사진은
        # 이 환경 리뷰 경로({key-prefix}/reviews/)를 훑어 찾는다. 스케줄러가 서버 한 대에서 S3 DeleteObject로 지운다
        # 지우는 key는 {key-prefix}/reviews/{양수 회원 ID}/{소문자 UUID}.{jpg|png|webp} 모양만이고(다른 환경 · 다른 기능 파일은 지우지 않는다),
        # 지우기 직전에 지금 리뷰에 붙어 있으면 지우지 않는다. 지우기 · 목록 방식은 upload-check와 같은 이름으로 고르므로
        # none(로컬)처럼 S3에 닿지 않는 설정이면 켜도 돌지 않는다. 서버 역할에 리뷰 경로의 DeleteObject와 버킷 ListBucket이 있어야 한다
        # 주의: "지금 리뷰에 붙어 있는지"는 저장된 공개 주소 전체 문자열로 비교한다. 공개 주소 형식(호스트 · CDN)을 바꾸면 기존 행과 어긋나
        # 그 환경의 사진을 모두 지울 수 있다. 공개 주소 형식을 바꾸기 전에 정리를 끄고, key 기준 비교로 바꾼 뒤 켠다
        cleanup:
          # 정리 스케줄러를 켤지(기본 꺼짐). 서버 역할의 삭제 · 목록 권한을 확인한 환경에서만 환경변수로 켠다
          # 로컬에서 dev · prod 프로필과 삭제 권한 있는 자격 증명으로 띄우면 그 환경 경로에서 로컬 DB에 없는 사진을 지우므로 켜지 않는다.
          # 로컬 · 테스트 프로필은 아래에서 한 번 더 끈다
          enabled: ${COMMUNITY_REVIEW_IMAGE_CLEANUP_ENABLED:false}
          # 정리 주기(이전 실행이 끝난 뒤부터). 한 주기에 정리 대기 처리 → 훑기 한 쪽 순서로 돈다
          interval: PT10M
          # 한 주기에 처리할 정리 대기 최대 건수
          batch-size: 100
          # 정리 대기에 들어온 뒤 이만큼 지나야 지운다(빼었다가 다시 붙이는 경우를 지킨다. 다시 붙이면 대기는 지워진다). 최소 PT5M
          pending-delay: PT1H
          # 지우기에 실패한 대기는 1분부터 두 배씩 미뤄 다시 시도하고, 이 값에서 멈춘다(시도 횟수 상한은 없다)
          max-backoff: PT1H
          # 올라간 뒤 이만큼 지났고 어느 리뷰에도 붙지 않은 파일만 훑기로 지운다. 업로드 주소 만료(upload-url-expiry)보다 길어야 한다(아니면 기동 실패)
          orphan-grace: P1D
          # 훑기 한 번에 읽는 저장소 목록 수(1~1000). 이어 읽기 표지는 서버 메모리에 두고 끝까지 읽으면 처음부터 다시 읽는다
          scan-page-size: 500
          # 훑기 한 주기에 지우는 최대 파일 수(성공한 삭제만 센다). 닿으면 같은 쪽을 다음 주기에 다시 읽는다.
          # 지우지 못한 파일은 이번 바퀴에서 건너뛰고 다음 바퀴에 다시 본다
          scan-delete-limit: 100
    # 운영 조회 MCP 창구(읽기 전용, POST /api/v1/admin/community/mcp, 관리자만). AI가 커뮤니티 운영 상태(리뷰 요약 · DLT ·
    # 검사 현황 · 상품 복사본)를 조회한다. 조작 도구는 없다. 응답에 리뷰 본문 · 닉네임 · 회원 ID · 사진 주소 · DLT 원본을 넣지 않는다
    mcp:
      # 창구를 열지(기본 꺼짐, 꺼지면 빈 · 경로 없음). 서버에서 열려면 환경변수로 켠다
      enabled: ${COMMUNITY_MCP_ENABLED:false}
      # 목록 결과 상한(1~100). 더 큰 size는 이 값으로 줄인다
      max-results: 50
    # 리뷰 부적절 콘텐츠 검사. 리뷰는 저장하면 바로 공개(검사 대기)이고, 주기마다 대기 리뷰를 검사해 걸리면 숨긴다(관리자 판단 대기)
    # 값이 비었거나 틀리면 키 이름이 나오는 오류로 기동에 실패한다
    moderation:
      # 주기 검사(스케줄러)를 켤지. 테스트 프로필은 아래에서 끈다(테스트가 처리 메서드를 직접 부른다)
      enabled: ${COMMUNITY_MODERATION_ENABLED:true}
      # 검사 주기(이전 실행이 끝난 뒤부터)와 한 번에 검사할 최대 건수. 기본 1분에 10건 = 하루 최대 14,400요청(AI 무료 한도 안에서 조절)
      interval: PT1M
      batch-size: 10
      # 판단 못 함(장애 · 시간 초과)을 다시 시도하는 최대 횟수. 닿으면 공개 그대로 대기 목록에서 빠지고 관리자 목록에서 본다
      # 한도 초과(429)는 횟수에 넣지 않고 그 주기의 남은 검사만 멈춘다
      max-attempts: 10
      # 쓸 검사기와 부르는 순서. 앞에서 걸리면 뒤는 부르지 않는다. banned-words(금칙어, 늘 동작) · ai(OpenAI 호환 API, 키가 있을 때만)
      moderators:
        - banned-words
        - ai
      # 금칙어(대소문자 · 공백 · 특수문자 무시). 운영 중 값만 바꿔 조절한다
      banned-words:
        - 씨발
        - 시발
        - 병신
        - 개새끼
        - 좆
      # OpenAI 호환 채팅 API 검사기. 같은 호환 API의 다른 제공자 · 모델이면 이 값만 바꾼다(코드 수정 없음)
      ai:
        base-url: https://api.groq.com/openai/v1
        model: meta-llama/llama-guard-4-12b
        # 키는 환경변수로만 받는다(다른 변수 이름을 쓰려면 여기 이름만 바꾼다). 비면 AI를 빼고 금칙어만 쓴다. 로그 · 응답에 남기지 않는다
        api-key: ${GROQ_API_KEY:}
        timeout: PT10S

---
# 로컬 실행 · 테스트는 AWS에 접근할 수 없어 가짜 자격 증명으로 업로드 주소 모양만 만든다(S3가 서명을 거절해 실제로 올라가지는 않는다)
# 사진 정리도 끈다(가짜 자격 증명으로 지우기를 시도하지 않는다)
spring:
  config:
    activate:
      on-profile: "local | test"
kidly:
  community:
    review:
      image:
        fake-credentials: true
        # 사진 정리 스케줄러를 끈다(테스트는 처리 메서드를 직접 부른다)
        cleanup:
          enabled: false

---
# 테스트는 주기 검사를 끈다(처리 메서드를 직접 부른다)
spring:
  config:
    activate:
      on-profile: test
kidly:
  community:
    moderation:
      enabled: false

---
# 로컬 실행은 가짜 자격 증명이라 S3에 닿지 않으므로 사진 업로드 확인을 건너뛴다(기동 때 한 줄 남긴다)
spring:
  config:
    activate:
      on-profile: local
kidly:
  community:
    review:
      image:
        upload-check: none
