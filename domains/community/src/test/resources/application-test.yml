# 커뮤니티 모듈 통합 · 기능 테스트 설정. 앱 application.yml · application-test.yml 중 커뮤니티 · common에 필요한 값만 같게 둔다.
# community.yml은 application.yml이 불러온다(여기 값이 community.yml 기본값을 덮는다).
# 앱 설정이 바뀌면 여기도 맞춘다(같은 기준으로 돌아야 앱에서 돌 때와 결과가 같다)
spring:
  # 커뮤니티 스키마는 처음부터 커뮤니티 모듈 마이그레이션(db/migration/community)으로만 만든다
  flyway:
    locations: classpath:db/migration
    default-schema: public
    schemas: public,community
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        session_factory:
          statement_inspector: com.bbcc.kidly.global.config.ReadOnlyWriteGuard
  kafka:
    # Kafka 테스트는 Testcontainers 주소로 덮어쓴다
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
    # Kafka 리스너는 저절로 시작하지 않는다. 수신 테스트가 그 안에서 자기 리스너만 켜고 끈다
    listener:
      auto-startup: false
    # Kafka 컨테이너는 Kafka 수신 테스트에서만 뜬다. 다른 테스트는 기동할 때 토픽을 만들려고 Kafka에 붙지 않는다
    admin:
      auto-create: false

kidly:
  # 커밋 뒤 Kafka로 보내지 않는다
  kafka:
    producer:
      enabled: false
  # 커뮤니티는 Spring 이벤트로 받는다. Kafka 수신 테스트는 그 테스트 안에서 커뮤니티 Kafka 리스너를 켠다
  community:
    kafka:
      consumer:
        enabled: false
