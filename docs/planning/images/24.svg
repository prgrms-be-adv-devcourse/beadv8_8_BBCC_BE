<svg viewBox="0 0 860 560" width="860" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans KR, sans-serif" font-size="11.5">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  
  <g font-weight="700" font-size="12.5" text-anchor="middle">
    <rect x="30" y="10" width="100" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="80" y="31">구매자 · 화면</text>
    <rect x="200" y="10" width="100" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="250" y="31">주문</text>
    <rect x="370" y="10" width="100" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="420" y="31">상품</text>
    <rect x="540" y="10" width="100" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="590" y="31">결제</text>
    <rect x="710" y="10" width="100" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="760" y="31">정산</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="80" y1="42" x2="80" y2="500"/><line x1="250" y1="42" x2="250" y2="500"/><line x1="420" y1="42" x2="420" y2="500"/><line x1="590" y1="42" x2="590" y2="500"/><line x1="760" y1="42" x2="760" y2="500"/>
  </g>
  
  <text x="14" y="66" font-weight="700" fill="#3730a3">④</text>
  <line x1="84" y1="72" x2="246" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="165" y="66" text-anchor="middle">POST /orders → 결제대기</text>
  <line x1="254" y1="102" x2="416" y2="102" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <text x="335" y="96" text-anchor="middle">order.created</text>
  <rect x="380" y="110" width="80" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="420" y="124" text-anchor="middle" font-size="10.5">재고 차감</text>
  <line x1="416" y1="150" x2="254" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <text x="335" y="144" text-anchor="middle">stock.deducted</text>
  <line x1="254" y1="180" x2="586" y2="180" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="420" y="174" text-anchor="middle" fill="#6d28d9">order.payment-requested</text>
  <rect x="520" y="188" width="140" height="34" rx="4" fill="#fff" stroke="#c4b5fd"/>
  <text x="590" y="202" text-anchor="middle" font-size="10.5">지갑 락 · 잔액 차감</text><text x="590" y="216" text-anchor="middle" font-size="10.5">+ 아웃박스 저장(한 트랜잭션)</text>
  <line x1="586" y1="242" x2="254" y2="242" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="420" y="236" text-anchor="middle" fill="#6d28d9">payment.completed → 주문 PAID · 판매자별 배송 생성</text>
  
  <text x="14" y="282" font-weight="700" fill="#3730a3">⑤⑥</text>
  <line x1="84" y1="290" x2="246" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="165" y="284" text-anchor="middle">배송 완료 뒤 구매확정</text>
  <line x1="254" y1="320" x2="756" y2="320" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <text x="505" y="314" text-anchor="middle">order-item.purchase-confirmed (정산 대상 등록)</text>
  
  <text x="14" y="360" font-weight="700" fill="#3730a3">⑦</text>
  <rect x="700" y="346" width="120" height="34" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="760" y="360" text-anchor="middle" font-size="10.5">정산 실행</text><text x="760" y="374" text-anchor="middle" font-size="10.5">정산서 COMPLETED</text>
  <line x1="756" y1="400" x2="594" y2="400" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="675" y="394" text-anchor="middle" fill="#6d28d9">settlement.payout-requested</text>
  <rect x="520" y="408" width="140" height="34" rx="4" fill="#fff" stroke="#c4b5fd"/>
  <text x="590" y="422" text-anchor="middle" font-size="10.5">판매자 지갑 입금</text><text x="590" y="436" text-anchor="middle" font-size="10.5">(정산서 ID당 한 번)</text>
  <line x1="594" y1="462" x2="756" y2="462" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="675" y="456" text-anchor="middle" fill="#6d28d9">payment.payout-completed</text>
  <text x="760" y="484" text-anchor="middle" font-size="10.5">정산서 PAID</text>
  
  <g font-size="10.5" fill="#475569">
    <line x1="30" y1="520" x2="60" y2="520" stroke="#475569" stroke-width="1.5"/><text x="66" y="524">사용자 요청</text>
    <line x1="150" y1="520" x2="180" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/><text x="186" y="524">이벤트</text>
    <line x1="250" y1="520" x2="280" y2="520" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/><text x="286" y="524" fill="#6d28d9">결제가 주고받는 이벤트 (Kafka)</text>
    <text x="30" y="546">실패하면: stock.deduction-failed · payment.failed → 주문 취소 → order.cancelled → 상품 재고 복구 · 결제 환불(결제됐으면) · payment.payout-failed → 정산서 FAILED</text>
  </g>
</svg>