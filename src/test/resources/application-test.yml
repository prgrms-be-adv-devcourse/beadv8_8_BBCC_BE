spring:
  jpa:
    # 테스트 컨테이너는 비어 있으므로 엔티티 기준으로 스키마를 만든다
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true

# 테스트는 PC마다 결과가 같아야 하므로 각자의 .env를 읽지 않는다
springdotenv:
  enabled: false

# 로컬과 같은 개발용 키를 쓴다. 운영 키와 다르다
jwt:
  public-key: file:config/jwt/local-public.pem
  private-key: file:config/jwt/local-private.pem

# 로컬과 같은 개발용 paymentKey 암호화 키. 운영 키와 다르다
payment:
  key-encryption:
    key: KIeLA4Q8UtNSoUDGDN4LsHMvk1JvINovlqKzRlonMaI=

# 테스트는 카카오를 호출하지 않는다 (support.FakeOAuthClient). 빈 생성에만 쓰인다
kakao:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:5173/oauth/kakao

# 결제 마감 만료 스케줄러가 테스트 중 다른 스레드에서 저절로 돌지 않게 주기를 아주 길게 둔다.
# 만료 테스트는 OrderScheduler.expireOverduePayments()를 직접 부른다
kidly:
  order:
    payment-expiry-interval: P3650D
    # 자동 구매확정 스케줄러도 같은 이유로 길게 둔다. 자동 확정 테스트는 OrderScheduler.autoConfirm()을 직접 부른다
    auto-confirm:
      interval: P3650D
