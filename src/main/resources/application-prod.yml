server:
  # nginx 가 넣는 X-Forwarded-* 를 믿어 https · 원래 호스트로 인식한다. Tomcat 은 사설 대역 프록시만 믿는다
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

jwt:
  public-key: ${JWT_PUBLIC_KEY_LOCATION}
  private-key: ${JWT_PRIVATE_KEY_LOCATION}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  swagger-ui:
    enabled: true

logging:
  file:
    path: ${LOG_PATH:./logs}
