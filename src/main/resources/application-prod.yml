server:
  # nginx 가 넣는 X-Forwarded-* 를 믿어 https · 원래 호스트로 인식한다. Tomcat 은 사설 대역 프록시만 믿는다
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

jwt:
  public-key: ${JWT_PUBLIC_KEY_LOCATION}
  private-key: ${JWT_PRIVATE_KEY_LOCATION}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 상품 이미지 객체 key의 환경 경로. 서버는 기본값 없이 dev · prod를 반드시 넣는다(빠지면 기동 실패)
kidly:
  product:
    image:
      s3:
        key-prefix: ${PRODUCT_IMAGE_KEY_PREFIX}

springdoc:
  swagger-ui:
    enabled: true

logging:
  file:
    path: ${LOG_PATH:./logs}
