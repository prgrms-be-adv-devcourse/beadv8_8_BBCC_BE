spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kidly
    username: kidly
    password: kidly
  jpa:
    # 로컬은 엔티티 기준으로 스키마를 자동 생성·갱신한다
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true

logging:
  level:
    org.hibernate.SQL: debug
