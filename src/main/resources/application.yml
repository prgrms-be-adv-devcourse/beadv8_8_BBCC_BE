spring:
  application:
    name: kidly
  # 도메인별 설정 파일. 서비스를 나누면 각 파일이 그 서비스의 application.yml이 된다
  config:
    import:
      - classpath:payment.yml
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

jwt:
  access-token-validity: 30m

refresh-token:
  validity: 14d
