spring:
  application:
    name: kidly
  # 도메인별 설정 파일. 서비스를 나누면 각 파일이 그 서비스의 application.yml이 된다
  config:
    import:
      - classpath:payment.yml
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

jwt:
  access-token-validity: 30m

refresh-token:
  validity: 14d

# Logstash 주소. 로컬은 docker compose의 Logstash, 운영은 환경 변수로 받는다. 연결되지 않으면 로그만 버려진다
logging:
  logstash:
    destination: ${LOGSTASH_HOST:localhost}:${LOGSTASH_PORT:5000}
