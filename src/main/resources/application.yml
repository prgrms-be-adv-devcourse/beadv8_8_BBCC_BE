spring:
  application:
    name: kidly
  # 도메인별 설정 파일. 서비스를 나누면 각 파일이 그 서비스의 application.yml이 된다
  config:
    import:
      - classpath:payment.yml
      - classpath:order.yml
      - classpath:settlement.yml
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 트랜잭션이 끝나면 DB 연결을 바로 돌려준다. 커밋 뒤 같은 스레드에서 이어지는 이벤트 리스너가
        # 단계마다 연결을 하나씩 더 쥐지 않게 해, 동시 요청이 몇 건만 와도 연결 풀이 고갈되는 일을 막는다
        # 이 설정에서는 Spring이 격리 수준을 직접 지정한 트랜잭션을 거부하므로 격리 수준을 지정하지 않는다
        # (TransactionArchitectureTest가 빌드에서 막는다)
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        # 연결을 돌려주는 위 설정에서는 DB가 읽기 전용 트랜잭션의 쓰기를 거부하지 못하므로, 쓰기 SQL을 보내기 전에 막는다
        session_factory:
          statement_inspector: com.bbcc.kidly.global.config.ReadOnlyWriteGuard

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

jwt:
  access-token-validity: 30m

refresh-token:
  validity: 14d

# 관리자 이메일 (쉼표 구분). 이 이메일의 회원은 로그인 · 토큰 재발급 때 ADMIN이 되고, 빠지면 USER로 돌아간다
admin:
  emails: ${ADMIN_EMAILS:}

# Logstash 주소. 로컬은 docker compose의 Logstash, 운영은 환경 변수로 받는다. 연결되지 않으면 로그만 버려진다
logging:
  logstash:
    destination: ${LOGSTASH_HOST:localhost}:${LOGSTASH_PORT:5000}
