spring:
  # Kafka 리스너는 저절로 시작하지 않는다. 수신을 확인하는 테스트(@KafkaIntegrationTest)가 그 안에서 켜고 끈다
  kafka:
    listener:
      auto-startup: false
    # Kafka 컨테이너는 @KafkaIntegrationTest에서만 뜬다. 다른 테스트는 기동할 때 DLT 토픽을 만들려고 Kafka에 붙지 않는다
    admin:
      auto-create: false

# 테스트는 PC마다 결과가 같아야 하므로 각자의 .env를 읽지 않는다
springdotenv:
  enabled: false

# 로컬과 같은 개발용 키를 쓴다. 운영 키와 다르다
jwt:
  public-key: file:config/jwt/local-public.pem

cors:
  allowed-origins: http://localhost:5173

kidly:
  # 서비스는 Gateway 뒤에서 X-Member-* 헤더로 로그인 회원을 만든다(토큰을 보지 않는다)
  auth:
    mode: gateway
  search:
    index:
      # 로컬 bootRun(local-*)과 색인이 섞이지 않게 한다. 테스트 컨테이너는 따로 뜨지만 이름으로도 나눈다
      prefix: test
