# 테스트는 PC마다 결과가 같아야 하므로 각자의 .env를 읽지 않는다
springdotenv:
  enabled: false

# 로컬과 같은 개발용 키를 쓴다. 운영 키와 다르다
jwt:
  public-key: file:config/jwt/local-public.pem

cors:
  allowed-origins: http://localhost:5173

kidly:
  search:
    index:
      # 로컬 bootRun(local-*)과 색인이 섞이지 않게 한다. 테스트 컨테이너는 따로 뜨지만 이름으로도 나눈다
      prefix: test
