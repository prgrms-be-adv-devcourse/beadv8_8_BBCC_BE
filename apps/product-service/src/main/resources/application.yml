spring:
  application:
    name: kidly-product
  config:
    import: classpath:product.yml
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration
    default-schema: product
    schemas: product
    table: flyway_schema_history_product
    baseline-on-migrate: true
    baseline-version: 202610292246
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 트랜잭션이 끝나면 DB 연결을 바로 돌려주고(커밋 뒤 리스너가 연결을 더 쥐지 않게),
        # 그래서 DB가 막지 못하는 읽기 전용 트랜잭션의 쓰기를 SQL을 보내기 전에 막는다
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        session_factory:
          statement_inspector: com.bbcc.kidly.global.config.ReadOnlyWriteGuard
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/kidly
    username: kidly
    password: kidly

kidly:
  product:
    image:
      s3:
        fake-credentials: true

server:
  port: 8089

---
spring:
  config:
    activate:
      on-profile: "dev | prod"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # dev · prod 가 DB 인스턴스 하나(max_connections 120)를 나눠 쓴다. 다른 서비스는 5개인데 상품만 10개다
    # 5개일 때 dev 에서 풀이 다 차고 대기가 12건까지 쌓였다(연결 대기 최장 3.1초, #1369). 다른 서비스 8개 × 5 + 상품 10 = 50, 두 환경이 100 연결이다
    hikari:
      maximum-pool-size: 10

kidly:
  product:
    image:
      s3:
        key-prefix: ${PRODUCT_IMAGE_KEY_PREFIX}

server:
  forward-headers-strategy: native

logging:
  file:
    path: ${LOG_PATH:./logs}
  # 콘솔 JSON 한 줄이 Docker 줄 한도(16KB)를 넘지 않게 예외마다 프레임 수만 줄인다
  structured:
    json:
      stacktrace:
        max-throwable-depth: 30

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
