spring:
  application:
    name: kidly-product
  config:
    import: classpath:product.yml
  profiles:
    default: local
  # 자기 스키마만 다룬다. 이력은 kidly-app(public.flyway_schema_history)과 따로 쓴다
  flyway:
    locations: classpath:db/migration
    # 이력 테이블은 product 스키마에 둔다. 나중에 DB를 나눌 때 스키마와 같이 옮겨지고, 다른 스키마를 건드리지 않는다
    default-schema: product
    schemas: product
    table: flyway_schema_history_product
    # 이미 상품 테이블이 있는 DB(dev · prod · 공유 로컬)는 첫 기동 때 baseline-version으로 baseline을 잡고 그 버전까지 건너뛴다.
    # 빈 DB(테스트)는 baseline 없이 init부터 적용한다
    # baseline-version은 이 모듈을 만들 때 kidly-app이 마지막으로 적용한 상품 마이그레이션 버전이고, 고정한다(baseline은 처음 기동 때 한 번만 잡혀 올려도 소용없다).
    # 두 앱이 함께 도는 동안 더하는 상품 마이그레이션은 두 앱이 각자 적용하므로 두 번 적용돼도 안전하게(IF NOT EXISTS · IF EXISTS) 쓴다
    baseline-on-migrate: true
    baseline-version: 202610292246
    # kidly-app과 같은 이유(버전이 파일을 만든 시각이라 먼저 만든 PR이 나중에 머지될 수 있다)로 옛 버전도 적용한다
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # kidly-app과 같다. 트랜잭션이 끝나면 DB 연결을 바로 돌려주고(커밋 뒤 리스너가 연결을 더 쥐지 않게),
        # 그래서 DB가 막지 못하는 읽기 전용 트랜잭션의 쓰기를 SQL을 보내기 전에 막는다
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        session_factory:
          statement_inspector: com.bbcc.kidly.global.config.ReadOnlyWriteGuard
  # Kafka. 상품이 받는 판매자 · 주문 이벤트를 받는다(구독 그룹 kidly.product). producer는 DLT로 보낼 때와 상품 이벤트를 보낼 때 쓴다. 값은 kidly-app과 같다
  # 서버는 SPRING_KAFKA_BOOTSTRAP_SERVERS로, 테스트는 Testcontainers가 덮어쓴다
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 책갈피가 없으면 지금부터 새로 오는 메시지만 읽는다(회의 10-29 안건 4). kidly-app과 같은 구독 그룹이라 책갈피를 이어 쓴다
      auto-offset-reset: latest

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

# 노출할 actuator. 외부(nginx)에는 health 만 열리고 prometheus 는 서버 안 Prometheus 만 부른다
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
# 이 문서는 product.yml(가져온 파일)보다 뒤에 있어야 한다. 가져온 파일의 값이 가져온 문서의 값보다 우선하므로, 같은 문서에 두면 product.yml의 기본값(true)이 이긴다
kidly:
  product:
    outbox:
      # 상품 아웃박스 릴레이에는 잠금이 없다. kidly-app이 상품을 가진 동안은 kidly-app만 릴레이를 돌리고 이 서비스는 저장만 한다
      # (같은 표라 이 서비스가 저장한 행도 kidly-app이 보낸다). kidly-app에서 상품을 뺄 때 이 줄을 지운다
      relay:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/kidly
    username: kidly
    password: kidly

# 로컬은 AWS에 접근할 수 없어 가짜 자격 증명으로 업로드 주소 형식만 만든다. 실제 업로드는 dev 서버에서 확인한다
kidly:
  product:
    image:
      s3:
        fake-credentials: true

# kidly-app(8080) · member-service(8081) · search-service(8082) · gateway(8083) · recommend-service(8086) ·
# payment-service(8087) · settlement-service(8088)와 같이 띄울 수 있게 포트를 나눈다
server:
  port: 8089

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# 상품 이미지 객체 key의 환경 경로. 서버는 기본값 없이 dev · prod를 반드시 넣는다(빠지면 기동 실패)
kidly:
  product:
    image:
      s3:
        key-prefix: ${PRODUCT_IMAGE_KEY_PREFIX}

server:
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    enabled: true

logging:
  file:
    path: ${LOG_PATH:./logs}
  # kidly-app application-prod.yml과 같다. 콘솔 JSON 한 줄이 Docker 줄 한도(16KB)를 넘지 않게 예외마다 프레임 수만 줄인다
  structured:
    json:
      stacktrace:
        max-throwable-depth: 30
