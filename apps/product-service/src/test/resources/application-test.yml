spring:
  # Kafka 리스너는 저절로 시작하지 않는다. 켜 두면 앞 테스트가 보낸 메시지를 다음 테스트 도중에 받아 처리해 테스트끼리 간섭한다.
  # Kafka 수신을 확인하는 테스트는 그 안에서 자기 리스너만 켜고 끈다
  kafka:
    listener:
      auto-startup: false
    # Kafka 컨테이너는 @KafkaIntegrationTest에서만 뜬다. 다른 테스트는 기동할 때 토픽을 만들려고 Kafka에 붙지 않는다
    admin:
      auto-create: false

# 테스트는 PC마다 결과가 같아야 하므로 각자의 .env를 읽지 않는다
springdotenv:
  enabled: false

kidly:
  # 커밋 뒤 Kafka로 보내는 빈을 끄는 팀 공통 값이라 kidly-app과 같게 둔다. Kafka 컨테이너가 있는 @KafkaIntegrationTest만 켠다
  kafka:
    producer:
      enabled: false
  product:
    # 테스트는 AWS에 접근하지 않는다. 가짜 자격 증명으로 업로드 주소 형식만 만든다
    image:
      s3:
        key-prefix: test
        fake-credentials: true
    # 상품 아웃박스 릴레이가 테스트 중 저절로 돌지 않게 주기를 아주 길게 두고, 정리는 끈다. 릴레이 테스트는 ProductOutboxRelayService를 직접 부른다
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
    # 상품 Kafka 리스너는 저절로 시작하지 않는다(이 스위치가 리스너의 autoStartup이다).
    # Kafka 수신은 ProductKafkaReceiveIntegrationTest · ProductOrderKafkaReceiveIntegrationTest 등이 그 안에서 상품 리스너를 켜서 본다
    kafka:
      consumer:
        enabled: false
