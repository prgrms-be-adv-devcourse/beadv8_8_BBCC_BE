spring:
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false

springdotenv:
  enabled: false

kidly:
  kafka:
    producer:
      enabled: false
  product:
    image:
      s3:
        key-prefix: test
        fake-credentials: true
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
    kafka:
      consumer:
        enabled: false
