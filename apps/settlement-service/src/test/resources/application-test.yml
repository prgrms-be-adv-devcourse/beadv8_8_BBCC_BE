spring:
  # Kafka 리스너는 저절로 시작하지 않는다. 켜 두면 앞 테스트가 보낸 메시지를 다음 테스트 도중에 받아 처리해 테스트끼리 간섭한다.
  # Kafka 수신을 확인하는 테스트는 그 안에서 자기 리스너만 켜고 끈다
  kafka:
    listener:
      auto-startup: false
    # Kafka 컨테이너는 @KafkaIntegrationTest에서만 뜬다. 다른 테스트는 기동할 때 토픽을 만들려고 Kafka에 붙지 않는다
    admin:
      auto-create: false

# 테스트는 PC마다 결과가 같아야 하므로 각자의 .env를 읽지 않는다
springdotenv:
  enabled: false

kidly:
  # Kafka로 보내지 않는다. Kafka 컨테이너가 있는 @KafkaIntegrationTest만 켠다
  kafka:
    producer:
      enabled: false
  # 자동 정산 · 지급 재요청 스케줄러는 끈다. 정산 테스트는 SettlementRunService를 직접 부른다
  settlement:
    run-cron: "-"
    payout-retry-cron: "-"
    # 아웃박스 릴레이는 테스트 중 다른 스레드에서 저절로 돌지 않게 주기를 아주 길게 두고, 정리는 끈다.
    # 릴레이 테스트는 SettlementOutboxRelayService를, 정리 테스트는 SettlementOutboxCleanupService를 직접 부른다
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
    holiday:
      refresh-cron: "-"
    # 정산이 받는 구매확정 · 지급 결과는 테스트에서 Spring 이벤트로 받는다.
    # Kafka 수신은 SettlementKafkaReceiveIntegrationTest가 그 안에서 정산 리스너를 켜서 본다
    kafka:
      consumer:
        enabled: false
