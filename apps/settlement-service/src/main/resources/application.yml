spring:
  application:
    name: kidly-settlement
  # 정산 도메인 설정(수수료율 · 자동 정산 cron · 아웃박스 릴레이 주기 · Batch 등)
  config:
    import:
      - classpath:settlement.yml
  profiles:
    default: local
  # 자기 스키마만 다룬다. 이력은 kidly-app(public.flyway_schema_history)과 따로 쓴다
  flyway:
    locations: classpath:db/migration
    # 이력 테이블은 settlement 스키마에 둔다. 나중에 DB를 나눌 때 스키마와 같이 옮겨지고, 다른 스키마를 건드리지 않는다
    default-schema: settlement
    schemas: settlement
    table: flyway_schema_history_settlement
    # 이미 정산 테이블이 있는 DB(dev · prod · 공유 로컬)는 첫 기동 때 지금 정산 스키마의 마지막 파일(판매자 · 기간 종료일 유일 제약) 버전으로 baseline을 잡고
    # 그때까지의 파일을 건너뛴다. 빈 DB(테스트)는 baseline 없이 init부터 적용한다
    baseline-on-migrate: true
    baseline-version: 202611021248
    # kidly-app과 같은 이유(버전이 파일을 만든 시각이라 먼저 만든 PR이 나중에 머지될 수 있다)로 옛 버전도 적용한다
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # kidly-app과 같다. 트랜잭션이 끝나면 DB 연결을 바로 돌려주고(커밋 뒤 리스너가 연결을 더 쥐지 않게),
        # 그래서 DB가 막지 못하는 읽기 전용 트랜잭션의 쓰기를 SQL을 보내기 전에 막는다
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        session_factory:
          statement_inspector: com.bbcc.kidly.global.config.ReadOnlyWriteGuard
  # Kafka. 정산 이벤트(지급 요청)를 보내고 구매확정 · 지급 결과를 받는다(구독 그룹 kidly.settlement). 값은 kidly-app과 같다
  # 서버는 SPRING_KAFKA_BOOTSTRAP_SERVERS로, 테스트는 Testcontainers가 덮어쓴다
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 책갈피가 없으면 지금부터 새로 오는 메시지만 읽는다(회의 10-29 안건 4). kidly-app과 같은 구독 그룹이라 책갈피를 이어 쓴다
      # 다만 정산 리스너 팩토리(SettlementKafkaListenerConfig)가 earliest로 덮어쓴다. 이 값은 그 밖의 컨슈머에만 적용된다
      auto-offset-reset: latest

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

# 노출할 actuator. 외부(nginx)에는 health 만 열리고 prometheus 는 서버 안 Prometheus 만 부른다
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/kidly
    username: kidly
    password: kidly

# kidly-app(8080) · search(8082) · gateway(8083) · childprofile(8084) · recommend(8086)와 같이 띄울 수 있게 포트를 나눈다
server:
  port: 8088

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    enabled: true

logging:
  file:
    path: ${LOG_PATH:./logs}
  # kidly-app application-prod.yml과 같다. 콘솔 JSON 한 줄이 Docker 줄 한도(16KB)를 넘지 않게 예외마다 프레임 수만 줄인다
  structured:
    json:
      stacktrace:
        max-throwable-depth: 30
