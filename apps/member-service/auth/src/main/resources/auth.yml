
jwt:
  access-token-validity: 30m

refresh-token:
  validity: 14d

kidly:
  auth:
    outbox:
      relay-interval: PT1M
      cleanup-cron: "0 0 4 * * *"
    admin:
      bootstrap:
        email: ${KIDLY_ADMIN_BOOTSTRAP_EMAIL:}
        password: ${KIDLY_ADMIN_BOOTSTRAP_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: local

jwt:
  public-key: file:config/jwt/local-public.pem
  private-key: file:config/jwt/local-private.pem

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

kidly:
  auth:
    admin:
      bootstrap:
        email: admin@kidly.local
        password: local-admin-password

---
spring:
  config:
    activate:
      on-profile: "dev | prod"

jwt:
  public-key: ${JWT_PUBLIC_KEY_LOCATION}
  private-key: ${JWT_PRIVATE_KEY_LOCATION}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
