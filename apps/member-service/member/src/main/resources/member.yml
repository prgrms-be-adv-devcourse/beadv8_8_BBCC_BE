# 회원 도메인 설정. application.yml이 가져온다

kidly:
  member:
    # Kafka로 보낼 회원 탈퇴 이벤트를 아웃박스에서 꺼내 보내는 릴레이
    outbox:
      # 릴레이를 부르는 주기. 이전 실행이 끝난 뒤부터 재며, 짧게 둬서 다른 도메인이 이벤트를 받을 때까지의 지연을 줄인다
      relay-interval: PT1S
      # 보낸 메시지를 지우는 시각. 매일 04:00. 보관 기간(7일)은 MemberOutboxCleanupService에 있다
      cleanup-cron: "0 0 4 * * *"

---
spring:
  config:
    activate:
      on-profile: local
kidly:
  member:
    withdrawal-check:
      order-uri: ${KIDLY_ORDER_URI:http://localhost:8091}
      settlement-uri: ${KIDLY_SETTLEMENT_URI:http://localhost:8088}

---
spring:
  config:
    activate:
      on-profile: "dev | prod"
kidly:
  member:
    withdrawal-check:
      order-uri: ${KIDLY_ORDER_URI}
      settlement-uri: ${KIDLY_SETTLEMENT_URI}
