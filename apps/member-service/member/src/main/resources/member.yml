
kidly:
  member:
    outbox:
      relay-interval: PT1M
      cleanup-cron: "0 0 4 * * *"

---
spring:
  config:
    activate:
      on-profile: local
kidly:
  member:
    withdrawal-check:
      order-uri: ${KIDLY_ORDER_URI:http://localhost:8091}
      settlement-uri: ${KIDLY_SETTLEMENT_URI:http://localhost:8088}

---
spring:
  config:
    activate:
      on-profile: "dev | prod"
kidly:
  member:
    withdrawal-check:
      order-uri: ${KIDLY_ORDER_URI}
      settlement-uri: ${KIDLY_SETTLEMENT_URI}
