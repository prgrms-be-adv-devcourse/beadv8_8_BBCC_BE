spring:
  application:
    name: kidly-member
  config:
    import:
      - classpath:auth.yml
      - classpath:member.yml
      - classpath:seller.yml
      - classpath:childprofile.yml
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration
    default-schema: member
    # auth는 넣지 않는다. 넣으면 kidly-app이 먼저 만든 DB에서 auth 스키마를 만든 기록이 이력에 먼저 남아 baseline 없이 init부터 돈다.
    # auth 스키마는 인증 마이그레이션이 만든다
    schemas: member,seller
    table: flyway_schema_history_member
    baseline-on-migrate: true
    baseline-version: 202610201313
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 트랜잭션이 끝나면 DB 연결을 바로 돌려주고(커밋 뒤 리스너가 연결을 더 쥐지 않게),
        # 그래서 DB가 막지 못하는 읽기 전용 트랜잭션의 쓰기를 SQL을 보내기 전에 막는다
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        session_factory:
          statement_inspector: com.bbcc.kidly.member.config.ReadOnlyWriteGuard
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/kidly
    username: kidly
    password: kidly

server:
  port: 8081

# 로컬은 http라서 Secure 쿠키를 브라우저가 보내지 않는다. 운영은 기본값(true)을 쓴다
kidly:
  security:
    secure-cookie: false

---
spring:
  config:
    activate:
      on-profile: "dev | prod"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # dev · prod 가 DB 인스턴스 하나(max_connections 120)를 나눠 쓴다. 기본 10 이면 서비스 8개 × 두 환경이 160 연결이다
    hikari:
      maximum-pool-size: 5

server:
  forward-headers-strategy: native

logging:
  file:
    path: ${LOG_PATH:./logs}
  # 콘솔 JSON 한 줄이 Docker 줄 한도(16KB)를 넘지 않게 예외마다 프레임 수만 줄인다
  structured:
    json:
      stacktrace:
        max-throwable-depth: 30

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
