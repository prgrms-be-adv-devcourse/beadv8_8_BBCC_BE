spring:
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false

springdotenv:
  enabled: false

jwt:
  public-key: file:config/jwt/local-public.pem
  private-key: file:config/jwt/local-private.pem

kakao:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:5173/oauth/kakao/callback

kidly:
  kafka:
    producer:
      enabled: false
  auth:
    outbox:
      relay-interval: P3650D
  childprofile:
    verification:
      identity-key-secret: test-identity-key-secret
    portone:
      api-secret: test-portone-secret
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
  member:
    withdrawal-check:
      order-uri: http://order.test
      settlement-uri: http://settlement.test
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"

  seller:
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
