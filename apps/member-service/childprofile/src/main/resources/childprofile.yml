kidly:
  childprofile:
    outbox:
      relay-interval: PT1S
      cleanup-cron: "0 0 4 * * *"

---
spring:
  config:
    activate:
      on-profile: local

kidly:
  childprofile:
    verification:
      identity-key-secret: ${IDENTITY_KEY_SECRET:local-identity-key-secret}
    portone:
      api-secret: ${PORTONE_API_SECRET:}

---
spring:
  config:
    activate:
      on-profile: prod

kidly:
  childprofile:
    verification:
      identity-key-secret: ${IDENTITY_KEY_SECRET}
    portone:
      api-secret: ${PORTONE_API_SECRET}
