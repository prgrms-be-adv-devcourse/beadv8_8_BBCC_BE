spring:
  # Kafka 리스너는 저절로 시작하지 않는다. 켜 두면 앞 테스트가 보낸 메시지를 다음 테스트 도중에 받아 처리해 테스트끼리 간섭한다.
  # Kafka 수신을 확인하는 테스트는 그 안에서 자기 리스너만 켜고 끈다
  kafka:
    listener:
      auto-startup: false
    # Kafka 컨테이너는 @KafkaIntegrationTest에서만 뜬다. 다른 테스트는 기동할 때 토픽을 만들려고 Kafka에 붙지 않는다
    admin:
      auto-create: false

# 테스트는 PC마다 결과가 같아야 하므로 각자의 .env를 읽지 않는다
springdotenv:
  enabled: false

kidly:
  # 테스트에서는 실제 메일을 보내지 않는다 (로그 발송기)
  mail:
    enabled: false
  # 커밋 뒤 Kafka로 보내는 빈을 끄는 팀 공통 값이라 kidly-app과 같게 둔다. Kafka 컨테이너가 있는 @KafkaIntegrationTest만 켠다
  kafka:
    producer:
      enabled: false
  # 알림 재시도 스케줄러가 테스트 중 다른 스레드에서 저절로 돌지 않게 주기를 아주 길게 둔다. 재시도 테스트는 NotificationRetryScheduler를 직접 부른다
  notification:
    retry-interval: P3650D
    # 각자의 OS 환경 변수(NOTIFICATION_SITE_URL)와 상관없이 같은 주소를 쓴다
    site-url: http://localhost:5173
