spring:
  application:
    name: kidly-recommend
  profiles:
    default: local
  # 자기 스키마만 다룬다. 이력은 kidly-app(public.flyway_schema_history)과 따로 쓴다
  flyway:
    locations: classpath:db/migration
    # 이력 테이블은 recommend 스키마에 둔다. 나중에 DB를 나눌 때 스키마와 같이 옮겨지고, 다른 스키마를 건드리지 않는다
    default-schema: recommend
    schemas: recommend
    table: flyway_schema_history_recommend
    # 이미 추천 테이블이 있는 DB(dev · prod · 공유 로컬)는 첫 기동 때 baseline-version으로 baseline을 잡고 그 버전까지 건너뛴다.
    # 빈 DB(테스트)는 baseline 없이 init부터 적용한다
    # baseline-version은 kidly-app이 추천을 가지고 있던 동안 마지막으로 적용한 추천 마이그레이션 버전이다. 이제 추천 마이그레이션은
    # 이 서비스만 적용하므로 이 값은 바꾸지 않는다. 새 추천 마이그레이션은 이 버전보다 뒤라 baseline을 잡은 DB에도 적용된다
    baseline-on-migrate: true
    baseline-version: 202611021557
    # 버전이 파일을 만든 시각이라 먼저 만든 PR이 나중에 머지될 수 있으므로 옛 버전도 적용한다
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 트랜잭션이 끝나면 DB 연결을 바로 돌려주고(커밋 뒤 리스너가 연결을 더 쥐지 않게),
        # 그래서 DB가 막지 못하는 읽기 전용 트랜잭션의 쓰기를 SQL을 보내기 전에 막는다
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        session_factory:
          statement_inspector: com.bbcc.kidly.global.config.ReadOnlyWriteGuard
  # Kafka. 추천이 받는 판매자 · 자녀 · 상품 · 주문 · 검색 이벤트를 받는다(구독 그룹 kidly.recommend). producer는 DLT로 보낼 때만 쓴다
  # 서버는 SPRING_KAFKA_BOOTSTRAP_SERVERS로, 테스트는 Testcontainers가 덮어쓴다
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 책갈피가 없으면 지금부터 새로 오는 메시지만 읽는다(회의 10-29 안건 4). kidly-app에서 쓰던 구독 그룹을 이어받아 책갈피를 이어 쓴다
      auto-offset-reset: latest
  # OpenAI(Chat Completions · 임베딩). 추천은 chat과 임베딩만 쓰므로 나머지 모델의 자동 설정은 끈다.
  # 키가 비어 있어도 Spring AI는 인증 없이 부르는 모델 빈을 만들어 호출할 때 401이 난다. 그래서 키가 없는 로컬 · 테스트 · CI에서는 RecommendAiKeyApplicationListener가 chat과 임베딩 모델 빈도 만들지 않는다.
  ai:
    model:
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-6.1-terra
        reasoning-effort: low
        # 추론 토큰도 이 상한에 들어간다
        max-completion-tokens: 2048
      embedding:
        model: text-embedding-3-small

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

# 노출할 actuator. 외부(nginx)에는 health 만 열리고 prometheus 는 서버 안 Prometheus 만 부른다
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/kidly
    username: kidly
    password: kidly

# search-service(8082) · gateway(8083)와 같이 띄울 수 있게 포트를 나눈다
server:
  port: 8086

---
spring:
  config:
    activate:
      on-profile: "dev | prod"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  forward-headers-strategy: native

logging:
  file:
    path: ${LOG_PATH:./logs}
  # 콘솔 JSON 한 줄이 Docker 줄 한도(16KB)를 넘지 않게 예외마다 프레임 수만 줄인다
  structured:
    json:
      stacktrace:
        max-throwable-depth: 30

---
spring:
  config:
    activate:
      on-profile: prod

# 운영에는 API 명세를 열지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
