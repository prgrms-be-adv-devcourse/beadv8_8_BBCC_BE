spring:
  # 테스트 전용 엔티티의 테이블을 함께 만든다
  flyway:
    locations: classpath:db/migration,classpath:db/test

  # Kafka 리스너는 저절로 시작하지 않는다. 켜 두면 앞 테스트가 보낸 메시지를 다음 테스트 도중에 받아 처리해 테스트끼리 간섭한다.
  # Kafka 수신을 확인하는 테스트는 그 안에서 자기 리스너만 켜고 끈다
  kafka:
    listener:
      auto-startup: false
    # Kafka 컨테이너는 @KafkaIntegrationTest에서만 뜬다. 다른 테스트는 기동할 때 토픽을 만들려고 Kafka에 붙지 않는다
    admin:
      auto-create: false

# 테스트는 PC마다 결과가 같아야 하므로 각자의 .env를 읽지 않는다
springdotenv:
  enabled: false

# 스케줄러가 테스트 중 다른 스레드에서 저절로 돌지 않게 주기를 아주 길게 둔다
kidly:
  # 커밋 뒤 Kafka로 보내지 않는다. Kafka 컨테이너가 있는 @KafkaIntegrationTest만 켠다
  kafka:
    producer:
      enabled: false
  # 충전 정리 스케줄러도 같은 이유로 길게 둔다. 정리 테스트는 ChargeScheduler를 직접 부른다
  payment:
    charge:
      reconcile-interval: P3650D
    # 주문 취소 재처리 스케줄러도 같은 이유로 길게 둔다. 재처리 테스트는 OrderCancellationRetryScheduler를 직접 부른다
    order-cancellation:
      retry-interval: P3650D
    # 아웃박스 릴레이도 같은 이유로 길게 두고, 정리는 끈다. 릴레이 테스트는 PaymentOutboxRelayService를, 정리 테스트는 PaymentOutboxCleanupService를 직접 부른다
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
    # 결제가 받는 주문 이벤트는 테스트에서 Spring 이벤트로 받는다.
    # Kafka 수신은 PaymentKafkaReceiveIntegrationTest가 그 안에서 결제 리스너를 켜서 본다
    kafka:
      consumer:
        enabled: false
