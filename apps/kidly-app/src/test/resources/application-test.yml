spring:
  # 테스트 전용 엔티티의 테이블을 함께 만든다
  flyway:
    locations: classpath:db/migration,classpath:db/test

  # Kafka 리스너는 저절로 시작하지 않는다. 켜 두면 앞 테스트가 보낸 메시지를 다음 테스트 도중에 받아 처리해 테스트끼리 간섭한다.
  # Kafka 수신을 확인하는 테스트는 그 안에서 자기 리스너만 켜고 끈다
  kafka:
    listener:
      auto-startup: false
    # Kafka 컨테이너는 @KafkaIntegrationTest에서만 뜬다. 다른 테스트는 기동할 때 토픽을 만들려고 Kafka에 붙지 않는다
    admin:
      auto-create: false

# 테스트는 PC마다 결과가 같아야 하므로 각자의 .env를 읽지 않는다
springdotenv:
  enabled: false

# 로컬과 같은 개발용 키를 쓴다. 운영 키와 다르다
jwt:
  public-key: file:config/jwt/local-public.pem
  private-key: file:config/jwt/local-private.pem

# 로컬과 같은 개발용 paymentKey 암호화 키. 운영 키와 다르다
payment:
  key-encryption:
    key: KIeLA4Q8UtNSoUDGDN4LsHMvk1JvINovlqKzRlonMaI=

# CORS 기능 테스트가 보내는 프론트 origin
cors:
  allowed-origins: http://localhost:5173

# 테스트는 카카오를 호출하지 않는다 (support.FakeOAuthClient). 빈 생성에만 쓰인다
kakao:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:5173/oauth/kakao/callback

# 결제 마감 만료 스케줄러가 테스트 중 다른 스레드에서 저절로 돌지 않게 주기를 아주 길게 둔다.
# 만료 테스트는 OrderScheduler.expireOverduePayments()를 직접 부른다
kidly:
  # 테스트에서는 실제 메일을 보내지 않는다 (로그 발송기)
  mail:
    enabled: false
  # 커밋 뒤 Kafka로 보내지 않는다(메일과 같은 방식). Kafka 컨테이너가 있는 @KafkaIntegrationTest만 켠다
  kafka:
    producer:
      enabled: false
  # 충전 정리 스케줄러도 같은 이유로 길게 둔다. 정리 테스트는 ChargeScheduler를 직접 부른다
  payment:
    charge:
      reconcile-interval: P3650D
    # 주문 취소 재처리 스케줄러도 같은 이유로 길게 둔다. 재처리 테스트는 OrderCancellationRetryScheduler를 직접 부른다
    order-cancellation:
      retry-interval: P3650D
    # 아웃박스 릴레이도 같은 이유로 길게 두고, 정리는 끈다. 릴레이 테스트는 PaymentOutboxRelayService를, 정리 테스트는 PaymentOutboxCleanupService를 직접 부른다
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
  order:
    payment-expiry-interval: P3650D
    # 자동 구매확정 스케줄러도 같은 이유로 길게 둔다. 자동 확정 테스트는 OrderScheduler.autoConfirm()을 직접 부른다
    auto-confirm:
      interval: P3650D
    # 아웃박스 릴레이도 같은 이유로 길게 두고, 정리는 끈다. 릴레이 · 정리 테스트는 OrderOutboxRelayService를 직접 부른다
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
  # 알림 재시도 스케줄러도 같은 이유로 길게 둔다. 재시도 테스트는 NotificationRetryScheduler를 직접 부른다
  notification:
    retry-interval: P3650D
    # 각자의 OS 환경 변수(NOTIFICATION_SITE_URL)와 상관없이 같은 주소를 쓴다
    site-url: http://localhost:5173
  # 자동 정산 · 지급 재요청 스케줄러는 끈다. 정산 테스트는 SettlementRunService를 직접 부른다
  settlement:
    run-cron: "-"
    payout-retry-cron: "-"
  # 테스트는 AWS에 접근하지 않는다. 가짜 자격 증명으로 업로드 주소 형식만 만든다
  product:
    image:
      s3:
        key-prefix: test
        fake-credentials: true
    # 상품 아웃박스 릴레이도 같은 이유로 길게 두고, 정리는 끈다. 릴레이 테스트는 ProductOutboxRelayService를, 정리 테스트는 ProductOutboxCleanupService를 직접 부른다
    outbox:
      relay-interval: P3650D
      cleanup-cron: "-"
