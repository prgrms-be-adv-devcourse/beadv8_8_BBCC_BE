server:
  # nginx 가 넣는 X-Forwarded-* 를 믿어 https · 원래 호스트로 인식한다. Tomcat 은 사설 대역 프록시만 믿는다
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# 상품 이미지 객체 key의 환경 경로. 서버는 기본값 없이 dev · prod를 반드시 넣는다(빠지면 기동 실패)
kidly:
  product:
    image:
      s3:
        key-prefix: ${PRODUCT_IMAGE_KEY_PREFIX}
  # 메일 본문의 사이트 주소. 서버는 기본값 없이 반드시 넣는다 (빠지면 기동 실패)
  notification:
    site-url: ${NOTIFICATION_SITE_URL}

springdoc:
  swagger-ui:
    enabled: true

logging:
  file:
    path: ${LOG_PATH:./logs}
  # 콘솔 JSON 한 줄이 Docker 줄 한도(16KB)를 넘으면 나뉘어 Loki 에서 JSON 으로 못 읽는다. 예외마다 프레임 수만 줄인다
  # max-length 는 쓰지 않는다: 앞에서부터 잘라 마지막 Caused by(기동 실패 원인, .github/scripts/startup-error.sh)가 사라진다
  structured:
    json:
      stacktrace:
        max-throwable-depth: 30
