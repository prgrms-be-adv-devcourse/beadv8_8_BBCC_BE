# 인증 설정. application.yml이 가져온다. 환경별 값은 아래 프로필 문서(---)에 있다
# test 프로필 값은 운영 jar에 넣지 않으려고 src/test/resources/application-test.yml에 둔다

# ── 모든 서비스가 읽는 것 (common의 JwtProperties · SecurityConfig). 서비스를 나누면 Gateway와 각 서비스의 설정이 된다
jwt:
  # Access Token 유효 기간. 무효화 기록 보존 기간(+ 시계 오차 60초)도 여기서 나온다
  access-token-validity: 30m

# ── 회원 서비스만 읽는 것 (member의 RefreshTokenProperties · KakaoProperties). 서비스를 나누면 member-service 설정으로 간다
refresh-token:
  # 재발급할 때마다 다시 이 기간이 된다
  validity: 14d

---
spring:
  config:
    activate:
      on-profile: local

# 로컬·테스트 전용 키. 운영은 환경 변수로 다른 키를 쓴다
# 상대 경로라서 프로젝트 루트에서 실행해야 한다 (bootRun·테스트는 기본으로 루트)
jwt:
  public-key: file:config/jwt/local-public.pem
  private-key: file:config/jwt/local-private.pem

cors:
  allowed-origins: http://localhost:5173

# 로컬은 http라서 Secure 쿠키를 브라우저가 보내지 않는다. 운영은 기본값(true)을 쓴다
refresh-token:
  secure-cookie: false

# 카카오 로그인. 키는 카카오 개발자 콘솔에서 받아 환경 변수로 넣는다. 없어도 앱은 뜨고 로그인만 실패한다
kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

---
spring:
  config:
    activate:
      on-profile: prod

jwt:
  public-key: ${JWT_PUBLIC_KEY_LOCATION}
  private-key: ${JWT_PRIVATE_KEY_LOCATION}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
