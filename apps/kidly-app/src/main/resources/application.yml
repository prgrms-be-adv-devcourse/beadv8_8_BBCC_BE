spring:
  application:
    name: kidly
  # 도메인별 설정 파일. 서비스를 나누면 각 파일이 그 서비스의 application.yml이 된다
  config:
    import:
      - classpath:auth.yml
      - classpath:payment.yml
      - classpath:order.yml
      - classpath:settlement.yml
      - classpath:product.yml
      - classpath:notification.yml
      - classpath:childprofile.yml
      - classpath:member.yml
      - classpath:community.yml
  profiles:
    default: local
  # 스키마는 Flyway가 만들고 Hibernate는 엔티티와 맞는지 검사만 한다 (db/migration)
  flyway:
    locations: classpath:db/migration
    # 이력 테이블은 public에 둔다. 도메인 스키마도 함께 검사해 테이블이 이미 있으면 첫 마이그레이션(init) 버전으로 baseline을 잡고 건너뛴다
    default-schema: public
    schemas: public,childprofile,member,orders,payment,product,recommend,seller,settlement,setting,notification,community
    baseline-on-migrate: true
    baseline-version: 202610160256
    # 버전이 파일을 만든 시각이라, 먼저 만든 PR이 나중에 머지되면 이미 적용된 것보다 옛 버전이 된다. 그래도 적용한다
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 트랜잭션이 끝나면 DB 연결을 바로 돌려준다. 커밋 뒤 같은 스레드에서 이어지는 이벤트 리스너가
        # 단계마다 연결을 하나씩 더 쥐지 않게 해, 동시 요청이 몇 건만 와도 연결 풀이 고갈되는 일을 막는다
        # 이 설정에서는 Spring이 격리 수준을 직접 지정한 트랜잭션을 거부하므로 격리 수준을 지정하지 않는다
        # (TransactionArchitectureTest가 빌드에서 막는다)
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        # 연결을 돌려주는 위 설정에서는 DB가 읽기 전용 트랜잭션의 쓰기를 거부하지 못하므로, 쓰기 SQL을 보내기 전에 막는다
        session_factory:
          statement_inspector: com.bbcc.kidly.global.config.ReadOnlyWriteGuard
  # Kafka. 앱 전체에 하나뿐인 값만 둔다. 도메인 yml에는 spring.kafka를 넣지 않는다(나중에 불러온 값이 앞의 값을 덮어씀)
  # 구독 그룹 · 재시도 · DLT는 받는 도메인이 자기 리스너 설정에 둔다. max.block.ms 등 나머지는 기본값(회의 10-29 안건 2)
  kafka:
    # 서버는 SPRING_KAFKA_BOOTSTRAP_SERVERS(kafka:9092)로, 테스트는 Testcontainers가 덮어쓴다
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 책갈피가 없으면 지금부터 새로 오는 메시지만 읽는다(회의 10-29 안건 4). 처음 Kafka로 옮길 때
      # 이미 Spring 이벤트로 처리한 메시지를 다시 읽지 않는다. 대신 책갈피가 없는 동안 들어온 메시지는 건너뛴다
      auto-offset-reset: latest

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

# 노출할 actuator. 외부(nginx)에는 health 만 열리고 prometheus 는 서버 안 Prometheus 만 부른다 (deploy/nginx)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
