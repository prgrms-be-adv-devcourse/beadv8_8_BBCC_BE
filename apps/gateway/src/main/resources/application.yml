spring:
  application:
    name: kidly-gateway
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webflux:
          # CORS는 Gateway만 처리한다: 프리플라이트에 직접 답하고 Gateway가 만든 401 · 403에도 붙는다(서비스는 CORS 헤더를 붙이지 않는다)
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${cors.allowed-origins}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
                # 프론트가 오류 문의에 traceId를 붙일 수 있게 (common RequestLoggingFilter.TRACE_ID_HEADER)
                exposed-headers: X-Request-Id
                allow-credentials: true
                max-age: 3600
          # 백엔드 호출 timeout(#668). 연결 3초(도메인의 외부 호출 connect-timeout과 같은 값), 응답 55초
          # (결제 승인이 Toss를 동기로 부르고 연결 3초 + 읽기 30초라 그보다 짧으면 결제는 됐는데 클라이언트는 504를 받는다.
          # nginx 기본 proxy_read_timeout 60초보다는 짧아야 Gateway의 ProblemDetail 504가 나간다)
          httpclient:
            connect-timeout: 3000
            response-timeout: 55s
          # Host는 nginx 값(원래 호스트)을 넘긴다. 없으면 백엔드 주소(app:8080)로 바뀐다
          default-filters:
            - PreserveHostHeader
          # nginx가 넣은 X-Forwarded-*를 앱에 그대로 넘긴다(앱이 nginx 직결 때와 같은 클라이언트 IP · https · 호스트를 본다).
          # trusted-proxies가 없으면 X-Forwarded-*를 모두 지운다. Gateway는 서버 127.0.0.1에만 열리므로 모두 믿는다.
          # 덧붙이기는 모두 끈다: Gateway는 아래 native로 자기 요청을 https · X-Forwarded-For 첫 값으로 보므로, 덧붙이면
          # X-Forwarded-For 첫 값(클라이언트가 보낸 값일 수 있다)이 맨 뒤에 다시 붙어 앱이 그 값을 클라이언트로 본다
          trusted-proxies: ".*"
          x-forwarded:
            for-enabled: false
            proto-enabled: false
            host-enabled: false
            port-enabled: false
            prefix-enabled: false
          # Forwarded 헤더는 nginx가 넣지 않는다. 지금처럼 지운다(켜 두면 Gateway가 새로 만들어 넘긴다)
          forwarded:
            enabled: false
          routes:
            # 서비스끼리만 부르는 API는 밖에 열지 않는다(회원 요구사항 v2 5.4)
            - id: internal
              uri: no://op
              predicates:
                - Path=/internal/**
              filters:
                - NotFound
            # 상품 목록 조회만 검색 서비스로 간다(#526). 상세(/api/v1/products/{id}) · 다른 메서드는 kidly-app(상품)에 남는다. kidly-app에는 상품 목록 API가 없다(#791)
            - id: search-product-list
              uri: ${kidly.gateway.search-uri}
              predicates:
                - Method=GET
                - Path=/api/v1/products
            # 자녀 프로필 API는 자녀 프로필 서비스로 간다(#682)
            - id: childprofile
              uri: ${kidly.gateway.childprofile-uri}
              predicates:
                - Path=/api/v1/children/**
            # 자녀 프로필 API 문서. kidly-app Swagger(springdoc.swagger-ui.urls)가 이 경로로 서비스의 /v3/api-docs를 읽는다
            - id: childprofile-api-docs
              uri: ${kidly.gateway.childprofile-uri}
              predicates:
                - Path=/v3/api-docs/childprofile
              filters:
                - SetPath=/v3/api-docs
            # 추천 API는 추천 서비스로 간다(#704)
            - id: recommend
              uri: ${kidly.gateway.recommend-uri}
              predicates:
                - Path=/api/v1/recommendations/**
              # 추천이 느려도 화면이 추천 영역만 비우고 넘어가도록, 전체 응답 제한(55초) 대신 3초에 끊고 504를 낸다(밀리초)
              metadata:
                response-timeout: 3000
            # 추천 API 문서. kidly-app Swagger(springdoc.swagger-ui.urls)가 이 경로로 서비스의 /v3/api-docs를 읽는다
            - id: recommend-api-docs
              uri: ${kidly.gateway.recommend-uri}
              predicates:
                - Path=/v3/api-docs/recommend
              filters:
                - SetPath=/v3/api-docs
            # 정산 API(판매자 · 관리자)는 정산 서비스로 간다(#729). 경로는 정산 컨트롤러 기준이고 역할 검사(RoleFilter)는 원래 경로로 한다
            - id: settlement
              uri: ${kidly.gateway.settlement-uri}
              predicates:
                - Path=/api/v1/seller/settlement-targets,/api/v1/seller/settlements/**,/api/v1/admin/settlements/**,/api/v1/admin/settlement-runs/**
            # 회원 · 인증 · 판매자 API는 회원 서비스로 간다
            - id: member
              uri: ${kidly.gateway.member-uri}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/members/**,/api/v1/seller/me/**,/api/v1/admin/admins/**,/api/v1/admin/members/**,/api/v1/admin/sellers/**,/api/v1/admin/seller-applications/**,/api/v1/dev/**
            # 회원 API 문서는 회원 서비스의 문서를 읽는다
            - id: member-api-docs
              uri: ${kidly.gateway.member-uri}
              predicates:
                - Path=/v3/api-docs/member
            # 정산 API 문서. kidly-app Swagger(springdoc.swagger-ui.urls)가 이 경로로 서비스의 /v3/api-docs를 읽는다
            - id: settlement-api-docs
              uri: ${kidly.gateway.settlement-uri}
              predicates:
                - Path=/v3/api-docs/settlement
              filters:
                - SetPath=/v3/api-docs
            # 결제 · 지갑 · 충전 · 토스 웹훅 · 결제 관리자 API는 결제 서비스로 간다(#525)
            # kidly-app도 아직 결제 도메인을 가지고 있어, 서비스를 켜지 않은 환경은 기본값(kidly-app)으로 지금처럼 간다
            # 응답 제한은 전체 값(55초)을 쓴다. 충전 승인이 토스를 동기로 부른다(위 httpclient 주석)
            - id: payment
              uri: ${kidly.gateway.payment-uri}
              predicates:
                - Path=/api/v1/payments/**,/api/v1/wallets/**,/api/v1/webhooks/toss,/api/v1/admin/payments/**,/api/v1/admin/wallets/**
            # 결제 API 문서. kidly-app Swagger(springdoc.swagger-ui.urls)가 이 경로로 서비스의 /v3/api-docs를 읽는다
            - id: payment-api-docs
              uri: ${kidly.gateway.payment-uri}
              predicates:
                - Path=/v3/api-docs/payment
              filters:
                - SetPath=/v3/api-docs
            # 나머지는 모두 kidly-app으로 간다. 다른 서비스의 경로는 이 위에 더한다
            - id: kidly-app
              uri: ${kidly.gateway.app-uri}
              predicates:
                - Path=/**
  # Kafka. auth.tokens-revoked를 받는다(구독 그룹 kidly.gateway). 값은 kidly-app과 같다
  # 서버는 SPRING_KAFKA_BOOTSTRAP_SERVERS로, 테스트는 Testcontainers가 덮어쓴다
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # DLT로 보낼 때만 쓴다
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Gateway도 자기 요청을 nginx가 받은 주소(https://dev-api...)로 본다. 같은 출처 요청(dev Swagger)을 CORS가 다른 출처로 막지 않게 한다.
# native(Reactor Netty)는 헤더를 지우지 않아 앱에도 간다. framework(ForwardedHeaderTransformer)는 지우므로 쓰지 않는다
server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

jwt:
  # Access Token 유효 기간. kidly-app auth.yml과 같은 값이어야 한다. 무효화 기록 보존 기간(+ 시계 오차 60초)도 여기서 나온다
  access-token-validity: 30m

---
spring:
  config:
    activate:
      on-profile: local

# kidly-app(8080) · member-service(8081) · search-service(8082) · childprofile-service(8084) · recommend-service(8086) · payment-service(8087) · settlement-service(8088)와 같이 띄운다
server:
  port: 8083

kidly:
  gateway:
    app-uri: http://localhost:8080
    # 회원 · 인증 · 판매자는 kidly-app에 없다. member-service(8081)를 띄워야 회원 API가 된다
    member-uri: ${KIDLY_MEMBER_URI:http://localhost:8081}
    # 상품 목록은 kidly-app에 없다(#791). search-service(8082)를 띄워야 상품 목록 API가 된다
    search-uri: ${KIDLY_SEARCH_URI:http://localhost:8082}
    # 자녀 프로필은 kidly-app에 없다. childprofile-service(8084)를 띄워야 자녀 API가 된다
    childprofile-uri: ${KIDLY_CHILDPROFILE_URI:http://localhost:8084}
    # 추천은 kidly-app에 없다. recommend-service(8086)를 띄워야 추천 API가 된다
    recommend-uri: ${KIDLY_RECOMMEND_URI:http://localhost:8086}
    # 정산은 kidly-app에 없다. settlement-service(8088)를 띄워야 정산 API가 된다
    settlement-uri: ${KIDLY_SETTLEMENT_URI:http://localhost:8088}
    # 결제는 kidly-app에 없다(#525). payment-service(8087)를 띄워야 결제 API가 된다
    payment-uri: ${KIDLY_PAYMENT_URI:http://localhost:8087}

cors:
  allowed-origins: http://localhost:5173

# 로컬 전용 키(kidly-app과 같은 키). 상대 경로라서 프로젝트 루트에서 실행해야 한다 (bootRun은 기본으로 루트)
jwt:
  public-key: file:config/jwt/local-public.pem

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  file:
    path: ${LOG_PATH:./logs}
  # 콘솔 JSON 한 줄이 Docker 줄 한도(16KB)를 넘으면 나뉘어 Loki 에서 JSON 으로 못 읽는다. 예외마다 프레임 수만 줄인다
  # max-length 는 쓰지 않는다: 앞에서부터 잘라 마지막 Caused by(기동 실패 원인)가 사라진다. kidly-app application-prod.yml 과 같다
  structured:
    json:
      stacktrace:
        max-throwable-depth: 30

kidly:
  gateway:
    app-uri: ${KIDLY_APP_URI}
    member-uri: ${KIDLY_MEMBER_URI}
    search-uri: ${KIDLY_SEARCH_URI}
    childprofile-uri: ${KIDLY_CHILDPROFILE_URI}
    recommend-uri: ${KIDLY_RECOMMEND_URI}
    settlement-uri: ${KIDLY_SETTLEMENT_URI}
    payment-uri: ${KIDLY_PAYMENT_URI}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  public-key: ${JWT_PUBLIC_KEY_LOCATION}
