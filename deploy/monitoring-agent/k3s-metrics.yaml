# Alloy 가 이 서버 k3s 의 kubelet cAdvisor(https://127.0.0.1:10250/metrics/cadvisor)에서 Pod 컨테이너 CPU · 메모리를 읽는 계정(#1142)
# 노드 지표 읽기(nodes/metrics get)만 허용한다. deploy.sh 가 Alloy 를 띄우기 전에 적용하고, Alloy 는 아래 Secret 의 토큰을 k3s API 로 읽는다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kidly-metrics-reader
  namespace: kube-system
---
# 오래 쓰는 토큰. 쿠버네티스가 채운다(배포마다 새로 만들지 않아 Alloy 가 다시 뜰 때도 같은 값을 읽는다)
apiVersion: v1
kind: Secret
metadata:
  name: kidly-metrics-reader-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: kidly-metrics-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kidly-metrics-reader
rules:
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kidly-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kidly-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kidly-metrics-reader
    namespace: kube-system
