# t3.large(앱 서버)의 수집기. 워크플로(.github/workflows/monitoring-deploy.yml)가 /opt/app/monitoring 으로 올리고 deploy.sh 가 -p monitoring 으로 띄운다
# Prometheus · Loki · Grafana 는 t3.medium k3s(deploy/monitoring)에 있고, Alloy 가 거기로 보낸다
# 옛 스택과 같은 폴더 · 프로젝트 이름이라 --remove-orphans 가 옛 prometheus · loki · grafana 컨테이너를 지운다(옛 볼륨은 남는다)
# .env 는 워크플로가 매번 만든다. MONITORING_HOST(medium 사설 IP) 하나뿐이고 비밀은 없다

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 앱 컨테이너 로그를 docker 에서 읽어 Loki 로, 앱 · 호스트 · 컨테이너 메트릭을 Prometheus 로 보낸다. 앱의 로그 설정은 바꾸지 않는다
  alloy:
    image: grafana/alloy:v1.10.1
    # 앱(127.0.0.1:8080 · 8081)을 그대로 부른다. Alloy UI 는 127.0.0.1 에만 열어 외부에는 열리지 않는다
    network_mode: host
    # 내장 cAdvisor 가 cgroup · 디스크 장치를 읽으려면 필요하다 (docker.sock 을 이미 가진 터라 권한이 더 넓어지는 건 아니다)
    privileged: true
    env_file: .env
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # 앱 배포(deploy/deploy.sh)가 쓰는 수집 대상 파일. 모니터링 배포는 이 폴더를 지우지 않는다
      - ./targets:/etc/alloy/targets:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      # 호스트 · 컨테이너 메트릭. /sys 는 cAdvisor 가 cgroup 을 읽는 자리라 컨테이너의 /sys 를 호스트 것으로 덮는다
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    logging: *logging

volumes:
  alloy-data:
