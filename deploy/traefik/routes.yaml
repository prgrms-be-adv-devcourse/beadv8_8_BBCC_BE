apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-trace-headers
  namespace: edge
spec:
  headers:
    # OTel Java Agent가 Netty에서 먼저 읽으므로 Gateway 필터로는 늦다(#1349).
    customRequestHeaders:
      traceparent: ""
      tracestate: ""
      baggage: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: edge
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# 서비스는 JSON 본문 크기를 제한하지 않고, 이미지는 S3 presigned URL 로 바로 올라가 API 를 지나지 않는다.
# v3.7 Buffering 은 응답도 모아서 보내므로(disableResponseBuffer 없음) SSE 라우트에는 걸지 않는다
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limit-request-body
  namespace: edge
spec:
  buffering:
    maxRequestBodyBytes: 10485760
---
# 앱 서버(노드 하나)를 과부하에서 지키려고 api 호스트로 동시에 처리 중인 요청 수를 묶어 막는다. 넘으면 Traefik이 429를 낸다.
# 요청마다 비용이 달라 초당 요청 수 대신 동시 처리 수로 막는다. 연결을 오래 붙잡는 SSE 라우트에는 걸지 않는다.
# 측정 전 시작값: 11-12 피크(134 req/s, 평균 0.11초)에 동시 약 15건에서 CPU 100%였으나 5xx는 거의 없었다. 그 몇 배로 두고 조정한다
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limit-in-flight
  namespace: edge
spec:
  inFlightReq:
    amount: 50
    sourceCriterion:
      requestHost: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-redirect
  namespace: edge
spec:
  entryPoints: [web]
  routes:
    # entrypoint 전체가 아니라 이 라우터에만 리다이렉트를 건다. ACME HTTP-01 challenge 경로가 https 로 밀려나지 않게 한다
    - match: Host(`api.__DOMAIN__`) || Host(`grafana.__DOMAIN__`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: noop@internal
          kind: TraefikService
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: edge
spec:
  entryPoints: [websecure]
  routes:
    # SSE: 알림 수(…/stream, #1302) · AI 추천 스트림(Accept: text/event-stream, #1155) · 관리자 MCP. 규칙이 길어 아래 라우트보다 먼저 맞는다
    - match: Host(`api.__DOMAIN__`) && (HeaderRegexp(`Accept`, `text/event-stream`) || PathRegexp(`/stream$`))
      kind: Rule
      middlewares:
        - name: strip-trace-headers
      services:
        - name: gateway
          namespace: kidly-dev
          port: http
    # 응답이 오래 걸리는 API(Gateway 라우트 chatbot-long · payment-toss · settlement-run, 최대 40~55초 이상)는 동시 처리 상한에서 뺀다.
    # 몇 건만 몰려도 자리를 오래 차지해 짧은 요청까지 429를 받기 때문이다. 챗봇은 Gateway 회원별 한도가 따로 막는다.
    # priority 는 SSE 라우트(규칙 길이 80자 이상)보다 낮고 아래 기본 라우트(Host 하나)보다 높게 둔다
    - match: Host(`api.__DOMAIN__`) && (Path(`/api/v1/chatbot/messages`) || PathRegexp(`^/api/v1/admin/chatbot/documents(/[^/]+)?$`) || Path(`/api/v1/wallets/me/charges/confirm`) || PathRegexp(`^/api/v1/wallets/me/charges/[^/]+/cancel$`) || PathRegexp(`^/api/v1/admin/wallets/charges/[^/]+/fail$`) || Path(`/api/v1/admin/settlements/run`))
      kind: Rule
      priority: 50
      middlewares:
        - name: strip-trace-headers
        - name: limit-request-body
      services:
        - name: gateway
          namespace: kidly-dev
          port: http
    - match: Host(`api.__DOMAIN__`)
      kind: Rule
      middlewares:
        - name: strip-trace-headers
        - name: limit-in-flight
        - name: limit-request-body
      services:
        - name: gateway
          namespace: kidly-dev
          port: http
  tls:
    certResolver: zerossl
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: edge
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`grafana.__DOMAIN__`)
      kind: Rule
      middlewares:
        - name: strip-trace-headers
      services:
        - name: grafana
          port: 80
  tls:
    certResolver: zerossl
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: edge
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: grafana
  namespace: edge
  labels:
    kubernetes.io/service-name: grafana
addressType: IPv4
endpoints:
  - addresses: [__MONITORING_HOST__]
    conditions:
      ready: true
ports:
  - name: http
    port: 80
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: edge
spec:
  minVersion: VersionTLS12
  sniStrict: true
