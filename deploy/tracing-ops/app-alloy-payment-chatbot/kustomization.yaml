apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kidly-dev
resources:
  - ../app-alloy-search
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tracing-alloy
      spec:
        template:
          spec:
            containers:
              - name: alloy
                env:
                  - name: TRACING_ALLOWED_SERVICES
                    value: '^(kidly-(gateway|order|search|payment|chatbot))$'
  - target:
      kind: NetworkPolicy
      name: tracing-alloy
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          podSelector:
            matchLabels:
              kidly/tracing: enabled
            matchExpressions:
              - key: app
                operator: In
                values: [payment, chatbot]
