# 단일 프로세스 · 파일 저장. 로그는 14일 보관
auth_enabled: false

server:
  # Service(NodePort 31100)로 다른 Pod · t3.large Alloy 가 보낸다
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  replication_factor: 1
  # 쿼리 프런트엔드 · 링이 알리는 주소. 없으면 네트워크 카드 IP 를 알려 127.0.0.1 에만 연 gRPC 로 못 붙어 조회가 멈춘다
  instance_addr: 127.0.0.1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
