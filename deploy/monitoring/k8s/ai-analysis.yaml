# Grafana "새 분석 실행" 버튼(kidly-ai-notes)이 부르는 두 경로만 노드의 처리기(ai-notes/grafana_analysis_api.py)로 보낸다
# 처리기는 Pod 가 아니라 노드 프로세스다(deploy 유저, ai-notes/analysis-api.sh). Prometheus · Loki · 상태 DB 를 기존 수동 실행과 같이 쓴다
# 엔드포인트(노드 사설 IP)는 analysis-api.sh 가 띄울 때마다 EndpointSlice 로 맞춘다. 권한은 처리기가 Grafana 세션(기본 조직 Admin)으로 검사한다
apiVersion: v1
kind: Service
metadata:
  name: kidly-ai-analysis
spec:
  ports:
    - name: http
      port: 8786
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kidly-ai-analysis
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: >-
        Host(`grafana.kidly.kro.kr`) &&
        ((Method(`POST`) && Path(`/kidly-ai-analysis/run`)) || (Method(`GET`) && Path(`/kidly-ai-analysis/status`)))
      services:
        - name: kidly-ai-analysis
          port: 8786
