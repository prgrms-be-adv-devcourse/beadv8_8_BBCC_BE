rule_files:
- rules.yml
evaluation_interval: 1m
tests:
- name: settlement gauges cross thresholds and ignore other jobs
  interval: 1m
  input_series:
  - series: settlement_run_overdue{job="kidly-settlement",env="dev"}
    values: 0 1 0
  - series: settlement_run_overdue{job="other",env="prod"}
    values: 1+0x3
  - series: settlement_payout_oldest_unpaid_age_seconds{job="kidly-settlement",env="dev"}
    values: 7200 7201 0
  - series: settlement_payout_oldest_unpaid_age_seconds{job="other",env="prod"}
    values: 9000+0x3
  alert_rule_test:
  - eval_time: 0m
    alertname: kidly-settlement-run-overdue
    exp_alerts: []
  - eval_time: 1m
    alertname: kidly-settlement-run-overdue
    exp_alerts:
    - exp_labels:
        env: dev
  - eval_time: 0m
    alertname: kidly-settlement-payout-unpaid
    exp_alerts: []
  - eval_time: 1m
    alertname: kidly-settlement-payout-unpaid
    exp_alerts:
    - exp_labels:
        env: dev
  - eval_time: 2m
    alertname: kidly-settlement-payout-unpaid
    exp_alerts: []
- name: payout failure increase clears after ten minutes and ignores other jobs
  interval: 1m
  input_series:
  - series: settlement_payout_failed_total{job="kidly-settlement",env="dev"}
    values: 0+0x5 1+0x20
  - series: settlement_payout_failed_total{job="other",env="prod"}
    values: 0+1x25
  alert_rule_test:
  - eval_time: 5m
    alertname: kidly-settlement-payout-failed
    exp_alerts: []
  - eval_time: 7m
    alertname: kidly-settlement-payout-failed
    exp_alerts:
    - exp_labels:
        env: dev
  - eval_time: 18m
    alertname: kidly-settlement-payout-failed
    exp_alerts: []
