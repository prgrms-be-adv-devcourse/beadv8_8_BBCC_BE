---
rule_files:
- rules.yml
evaluation_interval: 1m
tests:
- name: broker outage is per registered environment
  interval: 1m
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 1+0x25
  - series: up{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 0+0x25
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x25
  - series: kidly_kafka_exporter_expected{env="prod"}
    values: 0+0x25
  alert_rule_test:
  - eval_time: 2m
    alertname: kidly-kafka-unavailable
    exp_alerts: []
  - eval_time: 3m
    alertname: kidly-kafka-unavailable
    exp_alerts:
    - exp_labels:
        env: dev
- name: growth requires history and persistence
  interval: 1m
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 1+0x25
  - series: up{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x25
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x25
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.search",topic="kidly.product.events",partition="0"}
    values: 1+1x25
  alert_rule_test:
  - eval_time: 5m
    alertname: kidly-kafka-lag-growing
    exp_alerts: []
  - eval_time: 16m
    alertname: kidly-kafka-lag-growing
    exp_alerts:
    - exp_labels:
        env: dev
        consumergroup: kidly.search
        topic: kidly.product.events
- name: unknown partition offset is not healthy zero or known backlog
  interval: 1m
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 1+0x25
  - series: up{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x25
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x25
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.search",topic="kidly.product.events",partition="0"}
    values: 1+1x25
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.search",topic="kidly.product.events",partition="1"}
    values: "-1+0x25"
  alert_rule_test:
  - eval_time: 20m
    alertname: kidly-kafka-lag-growing
    exp_alerts: []
- name: confirmed empty partition does not hide growth elsewhere
  interval: 1m
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 1+0x25
  - series: up{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x25
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x25
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.search",topic="kidly.product.events",instance="127.0.0.1:9308",partition="0"}
    values: 1+1x25
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.search",topic="kidly.product.events",instance="127.0.0.1:9308",partition="1"}
    values: "-1+0x25"
  - series: kafka_topic_partition_current_offset{job="kidly-kafka",env="dev",instance="127.0.0.1:9308",topic="kidly.product.events",partition="1"}
    values: 0+0x25
  alert_rule_test:
  - eval_time: 20m
    alertname: kidly-kafka-lag-growing
    exp_alerts:
    - exp_labels:
        env: dev
        consumergroup: kidly.search
        topic: kidly.product.events
- name: intentional stop suppresses broker and lag calls
  interval: 1m
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 0+0x25
  - series: up{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 0+0x25
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x25
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.search",topic="kidly.product.events",partition="0"}
    values: 1+1x25
  alert_rule_test:
  - eval_time: 20m
    alertname: kidly-kafka-unavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: kidly-kafka-lag-growing
    exp_alerts: []
- name: reachable exporter with no broker still alerts
  interval: 1m
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 1+0x10
  - series: up{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x10
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 3m
    alertname: kidly-kafka-unavailable
    exp_alerts:
    - exp_labels:
        env: dev
- name: old successful scrape cannot hide lost observations
  interval: 1m
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 1+0x10
  - series: up{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: '1 _ _ _ _ _ _'
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="127.0.0.1:9308"}
    values: 1+0x10
  alert_rule_test:
  - eval_time: 4m
    alertname: kidly-kafka-unavailable
    exp_alerts:
    - exp_labels:
        env: dev
- name: member service DLT arrival alerts per topic and clears after quiet window
  interval: 1m
  input_series:
  - series: kafka_topic_partition_current_offset{job="kidly-kafka",env="dev",topic="kidly.member.events.member.dlt",partition="0"}
    values: 0+0x5 2+0x20
  - series: kafka_topic_partition_current_offset{job="kidly-kafka",env="dev",topic="kidly.auth.events.childprofile.dlt",partition="0"}
    values: 0+0x25
  alert_rule_test:
  - eval_time: 5m
    alertname: kidly-member-dlt-arrived
    exp_alerts: []
  - eval_time: 7m
    alertname: kidly-member-dlt-arrived
    exp_alerts:
    - exp_labels:
        env: dev
        topic: kidly.member.events.member.dlt
  - eval_time: 18m
    alertname: kidly-member-dlt-arrived
    exp_alerts: []
- name: other domains and gateway DLT arrivals do not alert member service
  interval: 1m
  input_series:
  - series: kafka_topic_partition_current_offset{job="kidly-kafka",env="dev",topic="kidly.order.events.payment.dlt",partition="0"}
    values: 0+1x25
  - series: kafka_topic_partition_current_offset{job="kidly-kafka",env="dev",topic="kidly.member.events.gateway.dlt",partition="0"}
    values: 0+1x25
  - series: kafka_topic_partition_current_offset{job="kidly-kafka",env="dev",topic="kidly.member.events",partition="0"}
    values: 0+1x25
  alert_rule_test:
  - eval_time: 10m
    alertname: kidly-member-dlt-arrived
    exp_alerts: []
- name: stalled partition is detected even when another partition advances
  interval: 30s
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 1+0x40
  - series: up{job="kidly-kafka",env="dev",instance="exporter"}
    values: 1+0x40
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="exporter"}
    values: 1+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.search",topic="kidly.product.events",partition="0"}
    values: 3+0x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.search",topic="kidly.product.events",partition="0"}
    values: 10+0x32 11+1x7
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.search",topic="kidly.product.events",partition="1"}
    values: 3+0x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.search",topic="kidly.product.events",partition="1"}
    values: 10+1x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="idle",topic="orders",partition="0"}
    values: 0+0x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="idle",topic="orders",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="missing-offset",topic="orders",partition="0"}
    values: 3+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="reset",topic="orders",partition="0"}
    values: 3+0x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="reset",topic="orders",partition="0"}
    values: 10+0x19 1+0x20
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="unknown-lag",topic="orders",partition="0"}
    values: "-1+0x40"
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="unknown-lag",topic="orders",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="unknown-offset",topic="orders",partition="0"}
    values: 3+0x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="unknown-offset",topic="orders",partition="0"}
    values: "-1+0x40"
  - series: kidly_kafka_exporter_expected{env="disabled"}
    values: 0+0x40
  - series: up{job="kidly-kafka",env="disabled",instance="exporter"}
    values: 1+0x40
  - series: kafka_brokers{job="kidly-kafka",env="disabled",instance="exporter"}
    values: 1+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="disabled",instance="exporter",consumergroup="kidly.search",topic="kidly.product.events",partition="0"}
    values: 3+0x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="disabled",instance="exporter",consumergroup="kidly.search",topic="kidly.product.events",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.order",topic="kidly.product.events",partition="0"}
    values: 3+1x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.order",topic="kidly.product.events",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.search",topic="kidly.seller.events",partition="0"}
    values: 3+1x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.search",topic="kidly.seller.events",partition="0"}
    values: 10+0x40
  alert_rule_test:
  - eval_time: 10m
    alertname: kidly-kafka-consumer-stalled
    exp_alerts: []
  - eval_time: 16m
    alertname: kidly-kafka-consumer-stalled
    exp_alerts:
    - exp_labels:
        env: dev
        consumergroup: kidly.search
        topic: kidly.product.events
  - eval_time: 17m
    alertname: kidly-kafka-consumer-stalled
    exp_alerts: []
  - eval_time: 16m
    alertname: kidly-kafka-lag-growing
    exp_alerts: []
- name: selected payment settlement and notification flows alert
  interval: 30s
  input_series:
  - series: kidly_kafka_exporter_expected{env="dev"}
    values: 1+0x40
  - series: up{job="kidly-kafka",env="dev",instance="exporter"}
    values: 1+0x40
  - series: kafka_brokers{job="kidly-kafka",env="dev",instance="exporter"}
    values: 1+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.payment",topic="kidly.order.events",partition="0"}
    values: 3+1x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.payment",topic="kidly.order.events",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.notification",topic="kidly.order.events",partition="0"}
    values: 3+1x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.notification",topic="kidly.order.events",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.settlement",topic="kidly.payment.events",partition="0"}
    values: 3+1x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.settlement",topic="kidly.payment.events",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.notification",topic="kidly.payment.events",partition="0"}
    values: 3+1x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.notification",topic="kidly.payment.events",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.order",topic="kidly.payment.events",partition="0"}
    values: 3+1x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.order",topic="kidly.payment.events",partition="0"}
    values: 10+0x40
  - series: kafka_consumergroup_lag{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.payment",topic="kidly.payment.events",partition="0"}
    values: 3+1x40
  - series: kafka_consumergroup_current_offset{job="kidly-kafka",env="dev",instance="exporter",consumergroup="kidly.payment",topic="kidly.payment.events",partition="0"}
    values: 10+0x40
  alert_rule_test:
  - eval_time: 16m
    alertname: kidly-kafka-lag-growing
    exp_alerts:
    - exp_labels:
        env: dev
        consumergroup: kidly.payment
        topic: kidly.order.events
    - exp_labels:
        env: dev
        consumergroup: kidly.notification
        topic: kidly.order.events
    - exp_labels:
        env: dev
        consumergroup: kidly.settlement
        topic: kidly.payment.events
    - exp_labels:
        env: dev
        consumergroup: kidly.order
        topic: kidly.payment.events
    - exp_labels:
        env: dev
        consumergroup: kidly.notification
        topic: kidly.payment.events
  - eval_time: 16m
    alertname: kidly-kafka-consumer-stalled
    exp_alerts:
    - exp_labels:
        env: dev
        consumergroup: kidly.payment
        topic: kidly.order.events
    - exp_labels:
        env: dev
        consumergroup: kidly.notification
        topic: kidly.order.events
    - exp_labels:
        env: dev
        consumergroup: kidly.settlement
        topic: kidly.payment.events
    - exp_labels:
        env: dev
        consumergroup: kidly.order
        topic: kidly.payment.events
    - exp_labels:
        env: dev
        consumergroup: kidly.notification
        topic: kidly.payment.events
