---
apiVersion: 1
groups:
- orgId: 1
  name: kidly-kafka
  folder: Kidly
  interval: 1m
  rules:
  - uid: kidly-kafka-unavailable
    title: Kafka 관측 불가
    condition: B
    for: 3m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max by(env) (kidly_kafka_exporter_expected == 1) unless on(env) max
          by(env) ((up{job="kidly-kafka"} == 1) and on(env,instance) (time() - timestamp(up{job="kidly-kafka"})
          < 60) and on(env,instance) (kafka_brokers{job="kidly-kafka"} >= 1))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} · Kafka 지표 수집을 3분간 확인하지 못했습니다."
      description: "Grafana에서 환경 운영 상태를 확인한 뒤 Kafka exporter의 수집 상태와 브로커 연결을 확인하세요."
      recovery_summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} · Kafka · Kafka 수집 조건이 다시 충족됐는지 대시보드에서 확인하세요."
      dashboard_url: "https://grafana.kidly.kro.kr/d/kidly-kafka?var-env={{ $labels.env }}"
    isPaused: false
  - uid: kidly-kafka-lag-growing
    title: Kafka 미처리 증가
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ((sum by(env,consumergroup,topic) (kafka_consumergroup_lag{job="kidly-kafka"} unless on(env,instance,topic,partition) (kafka_topic_partition_current_offset{job="kidly-kafka"} == 0
            and (time() - timestamp(kafka_topic_partition_current_offset{job="kidly-kafka"}) < 60)))
          and on(env,consumergroup,topic) (min by(env,consumergroup,topic) (kafka_consumergroup_lag{job="kidly-kafka"} unless on(env,instance,topic,partition) (kafka_topic_partition_current_offset{job="kidly-kafka"} == 0
            and (time() - timestamp(kafka_topic_partition_current_offset{job="kidly-kafka"}) < 60)))
          >= 0)) > 0) and on(env,consumergroup,topic) (deriv((sum by(env,consumergroup,topic)
          (kafka_consumergroup_lag{job="kidly-kafka"} unless on(env,instance,topic,partition) (kafka_topic_partition_current_offset{job="kidly-kafka"} == 0
            and (time() - timestamp(kafka_topic_partition_current_offset{job="kidly-kafka"}) < 60))) and on(env,consumergroup,topic)
          (min by(env,consumergroup,topic) (kafka_consumergroup_lag{job="kidly-kafka"} unless on(env,instance,topic,partition) (kafka_topic_partition_current_offset{job="kidly-kafka"} == 0
            and (time() - timestamp(kafka_topic_partition_current_offset{job="kidly-kafka"}) < 60)))
          >= 0))[10m:30s]) > 0) and on(env,consumergroup,topic) (min_over_time((sum
          by(env,consumergroup,topic) (kafka_consumergroup_lag{job="kidly-kafka"} unless on(env,instance,topic,partition) (kafka_topic_partition_current_offset{job="kidly-kafka"} == 0
            and (time() - timestamp(kafka_topic_partition_current_offset{job="kidly-kafka"}) < 60)))
          and on(env,consumergroup,topic) (min by(env,consumergroup,topic) (kafka_consumergroup_lag{job="kidly-kafka"} unless on(env,instance,topic,partition) (kafka_topic_partition_current_offset{job="kidly-kafka"} == 0
            and (time() - timestamp(kafka_topic_partition_current_offset{job="kidly-kafka"}) < 60)))
          >= 0))[10m:30s]) > 0) and on(env) max by(env) (kidly_kafka_exporter_expected
          == 1) and on(env) max by(env) ((up{job="kidly-kafka"} == 1) and on(env,instance)
          (time() - timestamp(up{job="kidly-kafka"}) < 60) and on(env,instance) (kafka_brokers{job="kidly-kafka"}
          >= 1)) and on(env,consumergroup,topic) (count_over_time((sum by(env,consumergroup,topic)
          (kafka_consumergroup_lag{job="kidly-kafka"} unless on(env,instance,topic,partition) (kafka_topic_partition_current_offset{job="kidly-kafka"} == 0
            and (time() - timestamp(kafka_topic_partition_current_offset{job="kidly-kafka"}) < 60))) and on(env,consumergroup,topic)
          (min by(env,consumergroup,topic) (kafka_consumergroup_lag{job="kidly-kafka"} unless on(env,instance,topic,partition) (kafka_topic_partition_current_offset{job="kidly-kafka"} == 0
            and (time() - timestamp(kafka_topic_partition_current_offset{job="kidly-kafka"}) < 60)))
          >= 0))[10m:30s]) >= 20)
          and on(env,consumergroup,topic) (
            kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.search",topic="kidly.product.events"}
            or kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup=~"kidly[.](payment|notification)",topic="kidly.order.events"}
            or kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.settlement",topic="kidly.payment.events"}
          )
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} · {{ $labels.consumergroup }} · {{ $labels.topic }} · 미처리 이벤트 증가"
      description: "최근 10분간 미처리가 남았고 증가 추세가 5분 지속됐습니다. 해당 그룹의 소비자 로그와 파티션별 lag 추이를 확인하세요."
      recovery_summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} · {{ $labels.consumergroup }} · {{ $labels.topic }} · 증가 조건이 해제됐습니다. 파티션별 lag가 줄어드는지 확인하세요."
      dashboard_url: "https://grafana.kidly.kro.kr/d/kidly-kafka?var-env={{ $labels.env }}"
    isPaused: false
  # Kafka exporter 수집 주기 30초. 10분 창에서 최대 2개 누락을 허용한다.
  - uid: kidly-kafka-consumer-stalled
    title: Kafka 소비 진행 정지
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: >-
          max by(env,consumergroup,topic) (
            (kafka_consumergroup_lag{job="kidly-kafka"} > 0)
            and (time() - timestamp(kafka_consumergroup_lag{job="kidly-kafka"}) < 60)
            and (min_over_time(kafka_consumergroup_lag{job="kidly-kafka"}[10m]) > 0)
            and (count_over_time(kafka_consumergroup_lag{job="kidly-kafka"}[10m]) >= 18)
            and on(env,instance,consumergroup,topic,partition)
            (
              (kafka_consumergroup_current_offset{job="kidly-kafka"} >= 0)
              and (time() - timestamp(kafka_consumergroup_current_offset{job="kidly-kafka"}) < 60)
              and (min_over_time(kafka_consumergroup_current_offset{job="kidly-kafka"}[10m]) >= 0)
              and (changes(kafka_consumergroup_current_offset{job="kidly-kafka"}[10m]) == 0)
              and (count_over_time(kafka_consumergroup_current_offset{job="kidly-kafka"}[10m]) >= 18)
            )
            and on(env,instance) (
              (up{job="kidly-kafka"} == 1)
              and (time() - timestamp(up{job="kidly-kafka"}) < 60)
              and on(env,instance) (kafka_brokers{job="kidly-kafka"} >= 1)
            )
            and on(env) max by(env) (kidly_kafka_exporter_expected == 1)
          )
          and on(env,consumergroup,topic) (
            kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.search",topic="kidly.product.events"}
            or kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup=~"kidly[.](payment|notification)",topic="kidly.order.events"}
            or kafka_consumergroup_lag{job="kidly-kafka",env="dev",consumergroup="kidly.settlement",topic="kidly.payment.events"}
          )
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} · {{ $labels.consumergroup }} · {{ $labels.topic }} · 소비 오프셋 정지"
      description: "미처리 이벤트가 남은 파티션에서 10분 관측 창 동안 커밋 오프셋 변화가 없었고, 조건이 5분 지속됐습니다. 소비자 로그에서 처리 오류와 리밸런스를 확인하세요."
      recovery_summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} · {{ $labels.consumergroup }} · {{ $labels.topic }} · 정지 조건이 해제됐습니다. 오프셋이 전진하고 lag가 줄어드는지 확인하세요."
      dashboard_url: "https://grafana.kidly.kro.kr/d/kidly-kafka?var-env={{ $labels.env }}"
    isPaused: false
  - uid: kidly-member-dlt-arrived
    title: 회원 서비스 처리 실패 메시지 도착
    condition: B
    for: 0m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum by(env,topic) (increase(kafka_topic_partition_current_offset{job="kidly-kafka",topic=~"kidly\\.[a-z]+\\.events\\.(auth|member|seller|childprofile)\\.dlt"}[10m]))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} · {{ $labels.topic }} · 처리 실패 메시지 도착"
      description: "최근 10분 안에 처리 실패 토픽에 새 메시지가 기록됐습니다. 관리자 화면의 처리 실패 메시지에서 원인을 확인하세요."
      recovery_summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} · {{ $labels.topic }} · 최근 10분간 새 실패 메시지가 관측되지 않는지 확인하세요. 기존 실패 건은 관리자 화면에서 확인할 수 있습니다."
      dashboard_url: "https://grafana.kidly.kro.kr/d/kidly-kafka?var-env={{ $labels.env }}"
    isPaused: false
