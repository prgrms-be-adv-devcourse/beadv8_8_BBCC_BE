apiVersion: 1

# slack-ops 연결점(alerting.yml)의 제목 · 본문 · 색. 한 그룹은 같은 규칙 · 같은 env 다 (group_by: [alertname, env])
# provisioning 파일은 $ 를 환경 변수로 바꿀 수 있어 템플릿 변수($)를 쓰지 않는다
templates:
  - orgId: 1
    name: kidly-slack
    template: |
      {{ define "kidly.slack.title" -}}
      {{ if eq .Status "firing" -}}
      {{ if eq .CommonLabels.severity "warning" }}🟠{{ else }}🔴{{ end }} {{ template "kidly.slack.name" . }}
      {{- if gt (len .Alerts.Firing) 1 }} ({{ len .Alerts.Firing }}건){{ end }}
      {{- else -}}
      🟢 해결 · {{ template "kidly.slack.name" . }}
      {{- end }}
      {{- end }}

      {{/* 규칙 조회가 실패하거나(DatasourceError) 데이터가 없으면(DatasourceNoData) alertname 대신 규칙 이름(rulename)을 쓴다 */}}
      {{ define "kidly.slack.name" -}}
      {{ if eq .CommonLabels.alertname "DatasourceError" }}{{ .CommonLabels.rulename }} · 조회 실패
      {{- else if eq .CommonLabels.alertname "DatasourceNoData" }}{{ .CommonLabels.rulename }} · 데이터 없음
      {{- else }}{{ .CommonLabels.alertname }}{{ end }}
      {{- with .CommonLabels.env }} · {{ if eq . "dev" }}운영{{ else }}{{ . }}{{ end }}{{ end }}
      {{- end }}

      {{ define "kidly.slack.text" -}}
      {{ if eq .Status "firing" -}}
      {{ range .Alerts.Firing -}}
      {{ .Annotations.summary }}
      {{ with .Annotations.description }}{{ . }}
      {{ end -}}
      {{ end -}}
      {{ with index .Alerts.Firing 0 }}<{{ .GeneratorURL }}|규칙 보기> · <{{ .SilenceURL }}|일시정지>
      {{- with .Annotations.service_url }} · <{{ . }}|서비스 상세>{{ end }}
      {{- with .Annotations.logs_url }} · <{{ . }}|로그 보기>{{ end }}
      {{- with .Annotations.dashboard_url }} · <{{ . }}|Kafka 대시보드>{{ end }}{{ end }}
      {{- template "kidly.slack.ai" . }}
      {{- else -}}
      {{ if .Alerts.Resolved -}}
      {{ if (index .Alerts.Resolved 0).Annotations.recovery_summary -}}
      {{ range .Alerts.Resolved -}}
      {{ with .Annotations.recovery_summary }}{{ . }}
      {{ end -}}
      {{ end -}}
      {{ else -}}
      정상으로 돌아왔습니다
      {{ end -}}
      {{ with index .Alerts.Resolved 0 }}<{{ .GeneratorURL }}|규칙 보기>{{ with .Annotations.service_url }} · <{{ . }}|서비스 상세>{{ end }}{{ with .Annotations.dashboard_url }} · <{{ . }}|Kafka 대시보드>{{ end }}{{ end }}
      {{ end -}}
      {{- end }}
      {{- end }}

      {{/* 규칙에 ai_prompt가 있으면 AI(kidly_grafana MCP)에 붙여 넣을 질문을 붙인다. 묶인 서비스는 모두 나열하고 시작 시각은 첫 알림 기준 UTC */}}
      {{ define "kidly.slack.ai" -}}
      {{ if (index .Alerts.Firing 0).Annotations.ai_prompt }}
      AI에게 물어보기 (kidly_grafana MCP)
      ```Kidly {{ .CommonLabels.alertname }} 알림: 대상 job:{{ range .Alerts.Firing }} {{ .Labels.job }}{{ end }}, env={{ .CommonLabels.env }}, 시작 {{ (index .Alerts.Firing 0).StartsAt.UTC.Format "2006-01-02 15:04" }} UTC. {{ (index .Alerts.Firing 0).Annotations.ai_prompt }}. query_prometheus로 시작 시각 기준 1시간 범위를 조회하고 숫자 근거와 함께 원인 후보를 정리해줘. 추측은 가설로 표시해줘.```
      {{- end }}
      {{- end }}

      {{ define "kidly.slack.color" -}}
      {{ if eq .Status "firing" -}}
      {{ if eq .CommonLabels.severity "warning" }}#d4a72c{{ else }}#cf222e{{ end }}
      {{- else -}}
      #1a7f37
      {{- end }}
      {{- end }}
