---
apiVersion: 1
groups:
- orgId: 1
  name: 수집 상태
  folder: Kidly
  interval: 1m
  rules:
  - uid: kidly-inventory-missing
    title: 운영 대상 목록 확인 필요
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: absent_over_time(kidly_monitoring_inventory_present[3m]) or (min(kidly_monitoring_inventory_initialized)
          == bool 0) or (max by(env)(kidly_environment_registered) unless on(env)
          kidly_environment_enabled)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: 운영 대상 목록 확인 필요
      description: medium Alloy와 operations/*.prom을 확인하세요. 목록 부재를 전체 정상으로 처리하지 않습니다.
  - uid: kidly-operation-stuck
    title: 환경 전환 미완료
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: "(time() - kidly_environment_changed_timestamp_seconds) and on(env)
          (kidly_environment_transition_active == 1)"
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 600
    labels:
      severity: warning
    annotations:
      summary: 환경 전환 미완료
      description: Actions 실행 결과와 컨테이너 상태를 확인하고 운영 중지/재개를 다시 실행하세요. 전환 상태가 10분을 넘겼습니다.
  - uid: kidly-agent-missing
    title: 앱 수집기 연결 끊김
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ((1 - max(last_over_time(up{job="kidly-alloy",collector="app"}[3m])))
          or absent_over_time(up{job="kidly-alloy",collector="app"}[3m])) and on()
          (max(kidly_environment_enabled) == 1)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: 앱 수집기 연결 끊김
      description: 앱 서버의 Alloy와 서버 간 연결을 확인하세요. 개별 서비스보다 수집기부터 복구하세요.
  - uid: kidly-write-backlog
    title: 지표 전송 적체
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (max by(collector) (time() - prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job="kidly-alloy"})
          > 120) and on(collector) (sum by(collector) (prometheus_remote_storage_samples_pending{job="kidly-alloy"})
          > 0)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 120
    labels:
      severity: warning
    annotations:
      summary: 지표 전송 적체
      description: 2분 이상 지난 지표가 5분째 밀리고 있습니다. Prometheus 수신 상태·연결과 Alloy WAL을 확인하세요.
  - uid: kidly-log-loss
    title: 로그 전송 유실
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum by(collector) (increase(loki_write_dropped_entries_total{job="kidly-alloy"}[5m]))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: 로그 전송 유실
      description: 재시도 후 로그가 유실됐습니다. Loki 응답·저장 여유와 Alloy 전송 상태를 확인하세요.
  - uid: kidly-log-retries
    title: 로그 전송 재시도 지속
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum by(collector) (increase(loki_write_batch_retries_total{job="kidly-alloy"}[5m]))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
    labels:
      severity: warning
    annotations:
      summary: 로그 전송 재시도 지속
      description: 단발 재시도가 아닌 지속적인 실패입니다. Loki 연결과 수신 상태를 확인하세요.
  - uid: kidly-store-failures
    title: 모니터링 저장 실패
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum by(store) (increase({job="kidly-monitoring-store",__name__=~"prometheus_tsdb_(wal_writes_failed_total|wal_truncations_failed_total|compactions_failed_total|head_truncations_failed_total)|loki_ingester_chunks_flush_failures_total"}[5m]))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: 모니터링 저장 실패
      description: Prometheus WAL/압축 또는 Loki flush 실패가 발생했습니다. 저장 공간·파일시스템과 해당 저장소
        상태를 확인하세요.
