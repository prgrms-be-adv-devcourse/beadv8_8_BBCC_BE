---
# 검색 서비스 장애 알림(#1026). 대응 절차는 deploy/search/README.md "장애 대응"
# 라벨에는 env · topic만 둔다(검색어 · 상품 ID를 넣지 않는다)
apiVersion: 1
# 파일에서 규칙을 빼도 Grafana는 DB(PVC)에 저장한 규칙을 지우지 않는다. 지운 규칙은 여기 uid를 남겨 지운다
deleteRules:
- orgId: 1
  uid: kidly-search-products-without-embedding  # 의미 검색 벡터 없는 상품(#1333)
groups:
- orgId: 1
  name: kidly-search
  folder: Kidly
  interval: 1m
  rules:
  # 색인 실패 메시지가 DLT로 갔다. 검색이 DLT를 다시 읽어 자동으로 반영하므로, 반영되는지는 아래 "DLT 미처리"가 본다
  - uid: kidly-search-dlt-arrived
    title: 검색 색인 실패 메시지 도착
    condition: B
    for: 0m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum by(env,topic) (increase(kafka_topic_partition_current_offset{job="kidly-kafka",topic=~"kidly\\.(product|seller)\\.events\\.search\\.dlt"}[10m]))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} {{ $labels.topic }}에 검색 색인 실패 메시지가 들어왔습니다"
      description: 대개 Elasticsearch가 멈췄거나 느린 것입니다. 검색 서비스가 DLT를 다시 읽어 Elasticsearch가 돌아오면 저절로
        반영합니다. 로그의 "처리하지 못한 이벤트를 DLT로 보냅니다"에서 예외 종류를 보세요. 최근 10분 동안 새 메시지가 없으면 해제됩니다.
    isPaused: false
  # DLT를 30분 넘게 다 읽지 못했다. Elasticsearch가 아직 안 되거나, 다시 해도 안 되는 메시지가 앞을 막고 있다
  - uid: kidly-search-dlt-not-drained
    title: 검색 색인 실패 메시지 미반영
    condition: B
    for: 30m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum by(env,topic) (kafka_consumergroup_lag{job="kidly-kafka",consumergroup="kidly.search",topic=~"kidly\\.(product|seller)\\.events\\.search\\.dlt"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} {{ $labels.topic }}를 30분 넘게 다 반영하지 못했습니다"
      description: Elasticsearch 상태를 먼저 보세요. Elasticsearch가 정상인데 계속 남으면 로그에서 DLT 재시도 실패 원인을 찾습니다.
        절차는 deploy/search/README.md "장애 대응 > DLT가 줄지 않음"입니다. 오프셋을 임의로 옮기지 마세요.
    isPaused: false
  # 임베딩 API가 연속으로 실패해 10분 넘게 부르지 않고 있다(그동안 검색은 키워드로만 찾고 새 상품은 벡터 없이 저장된다)
  - uid: kidly-search-embedding-circuit-open
    title: 의미 검색 임베딩 API 차단
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max by(env) (kidly_search_embedding_circuit_open{job="kidly-search"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    labels:
      severity: warning
    annotations:
      summary: "{{ if eq $labels.env \"dev\" }}운영{{ else }}{{ $labels.env }}{{ end }} 임베딩 API가 10분 넘게 실패해 의미 검색을 쓰지 못합니다"
      description: 검색은 키워드로만 됩니다. OpenAI 키 만료 · 한도 초과 · 장애를 확인하세요. 절차는 deploy/search/README.md
        "장애 대응 > OpenAI 키 만료 · 한도 초과"입니다. 복구 뒤에는 벡터 없는 상품을 다시 채웁니다.
    isPaused: false
