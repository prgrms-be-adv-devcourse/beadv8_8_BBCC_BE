apiVersion: 1

# Slack #4팀-운영이슈. 웹훅은 Secret monitoring-secrets 의 SLACK_OPS_WEBHOOK_URL (Grafana 환경 변수)
contactPoints:
  - orgId: 1
    name: slack-ops
    receivers:
      - uid: slack-ops
        type: slack
        settings:
          url: ${SLACK_OPS_WEBHOOK_URL}
          # 메시지 형식은 templates.yml
          title: '{{ template "kidly.slack.title" . }}'
          text: '{{ template "kidly.slack.text" . }}'
          color: '{{ template "kidly.slack.color" . }}'

# 같은 알림 · 같은 환경은 묶어서 보내고, 계속 울리면 4시간마다 다시 보낸다
policies:
  - orgId: 1
    receiver: slack-ops
    group_by: [alertname, env]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

# 규칙의 annotations 는 환경 변수로 바뀌지 않는다. 템플릿은 $labels · $values 를 그대로 쓴다 ($$ 는 템플릿 오류)
# logs_url: 그 env 의 최근 15분 로그를 여는 Explore 주소. Slack 본문에 "로그 보기" 로 붙는다(templates.yml)
# Explore 패널 JSON(datasources.yml 의 traceId 링크와 같은 형식)에 env 를 넣고 urlquery 로 인코딩한다
groups:
  - orgId: 1
    name: kidly
    folder: Kidly
    interval: 1m
    rules:
      # t3.large Alloy 가 앱 · Gateway · 자녀 프로필 서비스 · 추천 서비스 · 회원 서비스를 5분 넘게 못 읽으면(up=0). 검색·정산 서비스도 포함한다. Prometheus 가 죽어 조회가 실패하면 execErrState(Error → DatasourceError 알림)로 알린다
      # 데이터가 없다는 건 등록된 수집 대상이 없다는 뜻(앱 배포가 targets 파일을 쓰기 전)이라 알리지 않는다. 메트릭이 아예 안 오는 것은 "수집 끊김"이 본다
      - uid: kidly-app-down
        title: 앱 다운
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: >-
                (up{job=~"kidly|kidly-search|kidly-gateway|kidly-childprofile|kidly-recommend|kidly-member|kidly-payment|kidly-product|kidly-settlement"}) and on (env, job) (label_replace(max by (env, app_job) (kidly_app_expected == 1), "job", "$1", "app_job", "(.+)"))
