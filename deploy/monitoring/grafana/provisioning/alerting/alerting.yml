apiVersion: 1

# Slack #4팀-운영이슈. 웹훅은 Secret monitoring-secrets 의 SLACK_OPS_WEBHOOK_URL (Grafana 환경 변수)
contactPoints:
  - orgId: 1
    name: slack-ops
    receivers:
      - uid: slack-ops
        type: slack
        settings:
          url: ${SLACK_OPS_WEBHOOK_URL}
          # 메시지 형식은 templates.yml
          title: '{{ template "kidly.slack.title" . }}'
          text: '{{ template "kidly.slack.text" . }}'
          color: '{{ template "kidly.slack.color" . }}'

# 같은 알림 · 같은 환경은 묶어서 보내고, 계속 울리면 4시간마다 다시 보낸다
policies:
  - orgId: 1
    receiver: slack-ops
    group_by: [alertname, env]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

# 규칙의 annotations 는 환경 변수로 바뀌지 않는다. 템플릿은 $labels · $values 를 그대로 쓴다 ($$ 는 템플릿 오류)
# logs_url: 그 env 의 최근 15분 로그를 여는 Explore 주소. Slack 본문에 "로그 보기" 로 붙는다(templates.yml)
# Explore 패널 JSON(datasources.yml 의 traceId 링크와 같은 형식)에 env 를 넣고 urlquery 로 인코딩한다
groups:
  - orgId: 1
    name: kidly
    folder: Kidly
    interval: 1m
    rules:
      # t3.large Alloy 가 앱을 2분 넘게 못 읽으면(up=0). Prometheus 가 죽어 조회가 실패하면 execErrState(Error → DatasourceError 알림)로 알린다
      # 데이터가 없다는 건 등록된 수집 대상이 없다는 뜻(앱 배포가 targets 파일을 쓰기 전)이라 알리지 않는다. 메트릭이 아예 안 오는 것은 "수집 끊김"이 본다
      - uid: kidly-app-down
        title: 앱 다운
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: up{job="kidly"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        labels:
          severity: critical
        annotations:
          summary: '앱 메트릭을 2분 넘게 못 읽었습니다 (앱 다운 또는 /actuator/prometheus 없음)'

      # 최근 5분 요청 중 5xx 비율. 요청이 없으면 계산하지 않는다
      # /actuator 요청(Prometheus 수집 · docker healthcheck)은 분자 · 분모에서 뺀다
      - uid: kidly-5xx-rate
        title: 5xx 증가
        condition: B
        for: 0s
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: >-
                sum by (env) (rate(http_server_requests_seconds_count{job="kidly", status=~"5..", uri!~"/actuator.*"}[5m]))
                / sum by (env) (rate(http_server_requests_seconds_count{job="kidly", uri!~"/actuator.*"}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.05]}
        labels:
          severity: warning
        annotations:
          summary: '최근 5분 5xx 비율 {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}'
          logs_url: '{{ printf `{"t":{"datasource":"loki","queries":[{"refId":"A","datasource":{"type":"loki","uid":"loki"},"expr":"{env=\"%s\"} |= \"RequestLoggingFilter\" | json | __error__=\"\" | http_response_status_code >= 500","queryType":"range","editorMode":"code"}],"range":{"from":"now-15m","to":"now"}}}` $labels.env | urlquery | printf "https://grafana.kidly.kro.kr/explore?schemaVersion=1&orgId=1&panes=%s" }}'

      # 최근 5분 ERROR 로그. increase 는 외삽해 0.9 같은 값이 나오므로 0.5 초과(= 1건 이상)로 본다
      - uid: kidly-error-log
        title: ERROR 로그
        condition: B
        for: 0s
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: sum by (env) (increase(logback_events_total{job="kidly", level="error"}[5m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.5]}
        labels:
          severity: warning
        annotations:
          summary: '최근 5분 ERROR 로그 {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}건'
          logs_url: '{{ printf `{"t":{"datasource":"loki","queries":[{"refId":"A","datasource":{"type":"loki","uid":"loki"},"expr":"{env=\"%s\", level=\"ERROR\"}","queryType":"range","editorMode":"code"}],"range":{"from":"now-15m","to":"now"}}}` $labels.env | urlquery | printf "https://grafana.kidly.kro.kr/explore?schemaVersion=1&orgId=1&panes=%s" }}'

      # 앱 메트릭이 하나도 안 들어오면(up 시계열 자체가 없음). "앱 다운"은 up=0 만 보므로 t3.large 다운 · Alloy 중단 · 서버 간 연결 끊김을 못 잡는다
      # absent_over_time 은 시계열이 있으면 빈 결과(데이터 없음 → OK), 없으면 1 이다. env 라벨이 없어 제목은 "수집 끊김" 만 나온다
      # 수집 대상이 하나도 없을 때(어느 환경도 배포 전)도 울린다
      - uid: kidly-scrape-missing
        title: 수집 끊김
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: absent_over_time(up{job="kidly"}[3m])
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        labels:
          severity: critical
        annotations:
          summary: '앱 메트릭이 3분 넘게 하나도 들어오지 않습니다 (t3.large 다운 · Alloy 중단 · 서버 간 연결 끊김)'
