apiVersion: 1

# Slack #4팀-운영이슈. 웹훅은 Secret monitoring-secrets 의 SLACK_OPS_WEBHOOK_URL (Grafana 환경 변수)
contactPoints:
  - orgId: 1
    name: slack-ops
    receivers:
      - uid: slack-ops
        type: slack
        settings:
          url: ${SLACK_OPS_WEBHOOK_URL}
          # 메시지 형식은 templates.yml
          title: '{{ template "kidly.slack.title" . }}'
          text: '{{ template "kidly.slack.text" . }}'
          color: '{{ template "kidly.slack.color" . }}'

# 같은 알림 · 같은 환경은 묶어서 보내고, 계속 울리면 4시간마다 다시 보낸다
policies:
  - orgId: 1
    receiver: slack-ops
    group_by: [alertname, env]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

# 규칙의 annotations 는 환경 변수로 바뀌지 않는다. 템플릿은 $labels · $values 를 그대로 쓴다 ($$ 는 템플릿 오류)
# logs_url: 그 env 의 최근 15분 로그를 여는 Explore 주소. Slack 본문에 "로그 보기" 로 붙는다(templates.yml)
# Explore 패널 JSON(datasources.yml 의 traceId 링크와 같은 형식)에 env 를 넣고 urlquery 로 인코딩한다
groups:
  - orgId: 1
    name: kidly
    folder: Kidly
    interval: 1m
    rules:
      # t3.large Alloy 가 앱 · Gateway · 추천 서비스 · 회원 서비스를 5분 넘게 못 읽으면(up=0). 검색·정산 서비스도 포함한다. Prometheus 가 죽어 조회가 실패하면 execErrState(Error → DatasourceError 알림)로 알린다
      # 데이터가 없다는 건 등록된 수집 대상이 없다는 뜻(앱 배포가 targets 파일을 쓰기 전)이라 알리지 않는다. 메트릭이 아예 안 오는 것은 "수집 끊김"이 본다
      - uid: kidly-app-down
        title: 앱 다운
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: >-
                (up{job=~"kidly|kidly-search|kidly-gateway|kidly-recommend|kidly-member|kidly-payment|kidly-product|kidly-order|kidly-community|kidly-settlement|kidly-notification"}) and on (env, job) (label_replace(max by (env, app_job) (kidly_app_expected == 1), "job", "$1", "app_job", "(.+)"))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} 메트릭을 5분 넘게 못 읽었습니다 (다운 또는 /actuator/prometheus 없음)'

      # 서비스별 최근 5분 5xx 비율 > 5%이고 오류 추정 건수 >= 5인 상태가 2분 지속될 때 알린다. 초기 후보이며 dev 검증 후 조정한다
      # Gateway 는 서비스의 5xx 를 그대로 넘겨 두 번 세게 되므로 넣지 않는다
      # /actuator 요청(Prometheus 수집 · docker healthcheck)은 분자 · 분모에서 뺀다
      - uid: kidly-5xx-rate
        title: 5xx 증가
        condition: B
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: >-
                ((sum by (env, job) (increase(http_server_requests_seconds_count{job=~"kidly|kidly-search|kidly-recommend|kidly-member|kidly-payment|kidly-product|kidly-order|kidly-community|kidly-settlement", uri!~"/actuator.*", status=~"5.."}[5m])) / sum by (env, job) (increase(http_server_requests_seconds_count{job=~"kidly|kidly-search|kidly-recommend|kidly-member|kidly-payment|kidly-product|kidly-order|kidly-community|kidly-settlement", uri!~"/actuator.*"}[5m]))) and on (env, job) (sum by (env, job) (increase(http_server_requests_seconds_count{job=~"kidly|kidly-search|kidly-recommend|kidly-member|kidly-payment|kidly-product|kidly-order|kidly-community|kidly-settlement", uri!~"/actuator.*", status=~"5.."}[5m])) >= 5)) and on (env, job) (label_replace(max by (env, app_job) (kidly_app_expected == 1), "job", "$1", "app_job", "(.+)"))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.05]}
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} 최근 5분 5xx 비율 {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}'
          logs_url: '{{ printf `{"t":{"datasource":"loki","queries":[{"refId":"A","datasource":{"type":"loki","uid":"loki"},"expr":"{env=\"%s\", service_name=\"%s\"} |= \"RequestLoggingFilter\" | json | __error__=\"\" | http_response_status_code >= 500","queryType":"range","editorMode":"code"}],"range":{"from":"now-15m","to":"now"}}}` $labels.env $labels.job | urlquery | printf "https://grafana.kidly.kro.kr/explore?schemaVersion=1&orgId=1&panes=%s" }}'

      # Gateway는 입구 관점의 별도 경보다. 하위 서비스 오류도 포함하며 자체 연결 실패로 단정하지 않는다.
      - uid: kidly-gateway-5xx-rate
        title: Gateway 5xx 증가
        condition: B
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: >-
                ((sum by (env, job) (increase(http_server_requests_seconds_count{job="kidly-gateway", uri!~"/actuator.*", status=~"5.."}[5m])) / sum by (env, job) (increase(http_server_requests_seconds_count{job="kidly-gateway", uri!~"/actuator.*"}[5m]))) and on (env, job) (sum by (env, job) (increase(http_server_requests_seconds_count{job="kidly-gateway", uri!~"/actuator.*", status=~"5.."}[5m])) >= 5)) and on (env, job) (label_replace(max by (env, app_job) (kidly_app_expected == 1), "job", "$1", "app_job", "(.+)"))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.05]}
        labels:
          severity: warning
        annotations:
          description: 하위 서비스 5xx도 포함합니다. 서비스 오류 화면과 비교해 Gateway에서만 발생하는 연결 실패인지 확인하세요. 같은 요청을 서비스 오류와 합산하지 마세요.
          summary: '{{ $labels.job }} 입구 요청의 최근 5분 5xx 비율 {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}'
          logs_url: '{{ printf `{"t":{"datasource":"loki","queries":[{"refId":"A","datasource":{"type":"loki","uid":"loki"},"expr":"{env=\"%s\", service_name=\"%s\"} |= \"RequestLoggingFilter\" | json | __error__=\"\" | http_response_status_code >= 500","queryType":"range","editorMode":"code"}],"range":{"from":"now-15m","to":"now"}}}` $labels.env $labels.job | urlquery | printf "https://grafana.kidly.kro.kr/explore?schemaVersion=1&orgId=1&panes=%s" }}'

      # 서비스별 최근 5분 ERROR 추정 건수 > 4.5가 2분 지속될 때 알린다. increase 외삽 때문에 정수 건수와 다를 수 있다
      # "로그 보기" 는 그 서비스 로그만 연다. Loki service_name 은 job 과 같은 이름이다(deploy/monitoring-agent/config.alloy)
      - uid: kidly-error-log
        title: ERROR 로그
        condition: B
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: >-
                (sum by (env, job) (increase(logback_events_total{job=~"kidly|kidly-search|kidly-gateway|kidly-recommend|kidly-member|kidly-payment|kidly-product|kidly-order|kidly-community|kidly-settlement|kidly-notification", level="error"}[5m]))) and on (env, job) (label_replace(max by (env, app_job) (kidly_app_expected == 1), "job", "$1", "app_job", "(.+)"))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [4.5]}
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} 최근 5분 ERROR 로그 {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}건'
          logs_url: '{{ printf `{"t":{"datasource":"loki","queries":[{"refId":"A","datasource":{"type":"loki","uid":"loki"},"expr":"{env=\"%s\", service_name=\"%s\", level=\"ERROR\"}","queryType":"range","editorMode":"code"}],"range":{"from":"now-15m","to":"now"}}}` $labels.env $labels.job | urlquery | printf "https://grafana.kidly.kro.kr/explore?schemaVersion=1&orgId=1&panes=%s" }}'

      # 앱 메트릭이 하나도 안 들어오면(up 시계열 자체가 없음). "앱 다운"은 up=0 만 보므로 t3.large 다운 · Alloy 중단 · 서버 간 연결 끊김을 못 잡는다
      # absent_over_time 은 시계열이 있으면 빈 결과(데이터 없음 → OK), 없으면 1 이다. env 라벨이 없어 제목은 "수집 끊김" 만 나온다
      # 수집 대상이 하나도 없을 때(어느 환경도 배포 전)도 울린다
      - uid: kidly-scrape-missing
        title: 수집 끊김
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: >-
                (label_replace(max by (env, app_job) (kidly_app_expected == 1), "job", "$1", "app_job", "(.+)") unless on (env, job) max by (env, job) (present_over_time(up{job=~"kidly|kidly-.*"}[3m]))) and on () (max(last_over_time(up{job="kidly-alloy",collector="app"}[1m])) == 1)
                unless on(env) ((kidly_environment_transition_active == 1) and on(env) ((time() - kidly_environment_changed_timestamp_seconds) < 300))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} 수집 데이터가 3분 이상 없습니다'
          description: 운영 대상은 유지돼 있습니다. targets 등록과 Alloy의 해당 서비스 수집 상태를 확인하세요. 의도적 중지는 environment-operation을 사용하세요.
