apiVersion: 1

# 레포의 grafana/dashboards 를 읽는다. 화면에서 고친 내용은 저장되지 않는다
providers:
  - name: kidly
    folder: Kidly
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards

  # Generated summaries only. Existing versioned dashboards are never overwritten.
  - name: kidly-ai-summary
    folder: Kidly
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/ai-summary
