apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    jsonData:
      # 로그 상세의 traceId(구조화 메타데이터) 옆에 같은 요청의 로그를 여는 링크
      # 같은 Loki 로 가는 내부 링크(datasourceUid)는 쿼리를 expr 가 아닌 query 키로 넘겨 Explore 가 빈 쿼리로 열린다(Grafana 12.1).
      # 그래서 Explore 주소를 직접 쓴다. 쿼리: {env=~".+"} | traceId="<값>", 최근 24시간
      # provisioning 이 ${...} 를 환경 변수로 바꾸므로 $$ 로 적는다 (Grafana 에는 ${__value.raw} 로 들어간다)
      derivedFields:
        - name: traceId
          matcherType: label
          matcherRegex: traceId
          url: '/explore?schemaVersion=1&orgId=1&panes=%7B%22t%22%3A%7B%22datasource%22%3A%22loki%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22loki%22%2C%22uid%22%3A%22loki%22%7D%2C%22expr%22%3A%22%7Benv%3D~%5C%22.%2B%5C%22%7D%20%7C%20traceId%3D%5C%22$${__value.raw}%5C%22%22%2C%22queryType%22%3A%22range%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-24h%22%2C%22to%22%3A%22now%22%7D%7D%7D'
          urlDisplayLabel: 같은 요청 로그 보기
