apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
          args: ["-config.file=/etc/tempo/tempo.yml"]
          env:
            # 블록을 완성(parquet 쓰기)할 때 순간 사용량이 평소보다 약 110MiB 늘어난다(로컬 측정: 평소 약 120MiB → 230~260MiB).
            # 한도 256Mi 에서는 이때 컨테이너 OOM 으로 죽었다(11/17 4회). 한도 384Mi, Go 목표는 그 75%
            - name: GOMEMLIMIT
              value: 288MiB
          ports:
            - name: query
              containerPort: 3200
          readinessProbe:
            httpGet:
              path: /ready
              port: query
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: trace-data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: trace-data
          emptyDir:
            sizeLimit: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector:
    app: tempo
  ports:
    - name: query
      port: 3200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3200
