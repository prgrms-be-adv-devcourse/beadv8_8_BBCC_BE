# t3.large 의 nginx 와 인증서 갱신을 이 서버의 단독 k3s(namespace edge)에 띄운다(#1309). 예전에는 호스트 nginx · certbot 이었다
# deploy.sh 가 kidly.conf.template 을 ConfigMap(nginx-conf-<해시>)으로 만들고 검사한 뒤 __CONF__ 를 그 이름으로 바꿔 적용한다
# 인증서와 ZeroSSL 계정은 호스트 /etc/letsencrypt 에 그대로 둔다. 갱신은 계정이 있어 EAB 키가 필요 없다
apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
# 모든 요청이 nginx 를 지난다. 노드 request 가 꽉 차도(추천 2개 · 정산 Job 이 겹칠 때 등) 다시 뜰 수 있게, 자리가 없으면 우선순위가 낮은 Pod 를 밀어낸다
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kidly-edge
value: 1000000
globalDefault: false
description: t3.large 의 nginx(namespace edge). 자리가 없으면 다른 Pod 를 밀어내고 뜬다(#1309)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: edge
spec:
  replicas: 1
  # 호스트 포트 80 · 443 을 쓰므로 새 Pod 가 옛 Pod 와 겹쳐 뜰 수 없다. 옛 Pod 를 먼저 내린다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # 80 · 443 을 이 서버 주소로 받고, Gateway(127.0.0.1:30200) · Grafana(medium 사설 IP)에 예전 주소 그대로 붙는다
      hostNetwork: true
      priorityClassName: kidly-edge
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: nginx
          image: nginx:1.28.0
          # 호스트 nginx 가 아직 80 · 443 을 쥐고 있으면(전환 중) 놓을 때까지 기다렸다가 뜬다. 재시작을 반복하지 않아 바로 이어받는다
          # 갱신된 인증서는 6시간마다 다시 읽는다(nginx -s reload). 갱신은 만료 30일 전부터라 그 안에 반영된다
          command:
            - bash
            - -c
            - |
              while (exec 3<>/dev/tcp/127.0.0.1/443) 2> /dev/null || (exec 3<>/dev/tcp/127.0.0.1/80) 2> /dev/null; do
                echo "80 · 443 을 다른 프로세스가 쓰고 있어 기다립니다"; sleep 1
              done
              (while sleep 21600; do nginx -s reload; done) &
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          # 호스트 네트워크라 포트 검사는 전환 중 호스트 nginx 에도 붙는다. 이 Pod 의 nginx 가 떴는지로 본다
          readinessProbe:
            exec:
              command: [bash, -c, 'kill -0 "$(cat /run/nginx.pid)" && exec 3<>/dev/tcp/127.0.0.1/443']
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # 이미지의 default.conf(80 default_server)를 덮어 kidly.conf 만 남긴다
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
            - name: webroot
              mountPath: /var/www/certbot
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: __CONF__
        - name: letsencrypt
          hostPath:
            path: /etc/letsencrypt
            type: Directory
        - name: webroot
          hostPath:
            path: /var/www/certbot
            type: DirectoryOrCreate
---
# 인증서 갱신. 예전 docker certbot 과 같은 이미지 · 마운트다. 만료 30일 전부터 실제로 새로 받는다
# 확인 파일을 webroot 에 쓰면 nginx Pod 가 80 의 /.well-known/acme-challenge/ 로 내준다
apiVersion: batch/v1
kind: CronJob
metadata:
  name: certbot-renew
  namespace: edge
spec:
  # 서버가 18:00~09:00 KST 에 꺼진다. 켜져 있는 시간에 돌리고, 놓치면 켜진 뒤 23시간 안에 돈다
  schedule: "30 10 * * *"
  timeZone: Asia/Seoul
  startingDeadlineSeconds: 82800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          containers:
            - name: certbot
              image: certbot/certbot:v5.8.0
              args: [renew, --no-random-sleep-on-renew]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: letsencrypt
                  mountPath: /etc/letsencrypt
                - name: lib
                  mountPath: /var/lib/letsencrypt
                - name: webroot
                  mountPath: /var/www/certbot
          volumes:
            - name: letsencrypt
              hostPath:
                path: /etc/letsencrypt
                type: Directory
            - name: lib
              hostPath:
                path: /var/lib/letsencrypt
                type: DirectoryOrCreate
            - name: webroot
              hostPath:
                path: /var/www/certbot
                type: DirectoryOrCreate
