# 서버용. 배포 때 워크플로가 /opt/app/<env>/ 로 올린다 (env 마다 다른 것은 .env 뿐)
# deploy.sh 가 -p <env> --env-file .env --env-file image.env 로 실행한다
# Kafka 브로커(Redpanda)는 t3.medium k3s(deploy/kafka)에 환경마다 하나씩 뜬다. 서비스 · kafka-exporter 는 KAFKA_BOOTSTRAP_SERVERS(medium 사설 IP:NodePort)로 붙고,
# 이 값은 레포가 공개라 deploy 워크플로가 서버 .env 에 붙인다
# PostgreSQL 도 t3.medium k3s(deploy/postgres)에 인스턴스 하나로 뜨고 환경마다 database · 계정(kidly_<env>)을 나눠 쓴다. DB_URL 도 deploy 워크플로가 붙인다
# 앱 서비스는 profile 이 서비스마다 있어(search · gateway · member · settlement · payment · product · order · community · notification · recommend · chatbot) .env 의 COMPOSE_PROFILES 에 있는 것만 compose 로 뜬다
# .env 의 K3S_PROFILES 에 있는 서비스는 compose 가 아니라 t3.large 의 단독 k3s(deploy/k3s)에 뜬다(#1142). 그 서비스의 environment · image · mem_limit 은 k3s 에서도 그대로 쓴다
# 지금 환경은 dev 하나이고 모든 서비스가 K3S_PROFILES 다. prod 환경은 한 번도 배포하지 않아 걷어냈다(#1210)

# 컨테이너 로그가 디스크를 채우지 않도록 10MB 씩 5개까지만 남긴다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # 승인된 Kafka 관측 전용. 앱·DB 비밀값이나 Docker 소켓을 넘기지 않는다.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0@sha256:54d4296c5b8ce01232f6762e06cbc3eec25887c0b5c5940ccb9e891ac7fc51d8
    profiles: [kafka-monitoring]
    command:
      - --kafka.server=${KAFKA_BOOTSTRAP_SERVERS:?}
      - --kafka.version=4.0.0
      - --topic.workers=2
      - '--topic.filter=^kidly\.'
      - '--group.filter=^kidly\.'
    ports:
      - "127.0.0.1:${KAFKA_EXPORTER_PORT}:9308"
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.2
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 캐시용 Redis(#690). 영속성을 끄고(RDB · AOF 없음) 64MB 를 넘으면 가장 오래 안 쓴 키부터 지운다. 원본은 DB 에 둔다
  # 포트를 밖에 열지 않고 같은 namespace 의 서비스만 redis:6379 로 붙는다(k3s ClusterIP). 그래서 비밀번호 없이 protected-mode 를 끈다
  # dev 는 K3S_PROFILES 의 redis 로 k3s 에 뜬다(deploy/k3s). 쓰는 앱은 용도별 이슈에서 붙인다
  redis:
    image: redis:7.4.12-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    profiles: [redis]
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --protected-mode
      - "no"
    expose:
      - "6379"
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 검색 서비스(apps/search-service). 상품 목록 검색 API 와 상품 · 판매자 이벤트 수신(구독 그룹 kidly.search)
  # 비밀이 든 .env 를 통째로 넘기지 않고 필요한 값만 넘긴다. 토큰은 Gateway 가 검증하므로 키를 마운트하지 않는다
  # /actuator/health 가 Elasticsearch 연결을 본다. ES 는 t3.medium k3s(deploy/search), 앱 배포 전에 deploy 워크플로가 먼저 올린다
  # ELASTICSEARCH_URIS(medium 사설 IP)는 레포가 공개라 deploy 워크플로가 서버 .env 에 붙인다
  search-service:
    image: ${SEARCH_IMAGE}
    profiles: [search]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx384m
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      # 기본값은 profile search 가 꺼진 환경에서 빈 값 경고를 내지 않으려는 것이다
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:-}
      SEARCH_INDEX_PREFIX: ${SEARCH_INDEX_PREFIX:-}
      # 의미 검색 임베딩(#797). 없으면 의미 검색을 끄고 키워드로만 찾는다. deploy 워크플로가 Environment Secret 에서 붙인다
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${SEARCH_PORT:-8082}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에 열 때는 nginx 가 아니라 Gateway 라우트로(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # 실측 최대 309MiB(11-12, 컨테이너 전체). 1g 로는 배포 때 새 Pod 를 먼저 띄울 자리(maxSurge)가 노드 할당량을 넘어 Pending 이 된다(#1191)
    mem_limit: 768m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 추천 서비스(apps/recommend-service, #704). 추천 API 와 판매자 · 자녀 · 상품 · 주문 · 검색 이벤트 수신(구독 그룹 kidly.recommend). 보내는 이벤트는 없다
  # 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값과 OpenAI 키만 넘긴다. 토큰은 Gateway 가 검증하므로 키를 마운트하지 않는다
  recommend-service:
    image: ${RECOMMEND_IMAGE}
    profiles: [recommend]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx128m
      # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다. 자녀 프로필 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 비어 있으면 OpenAI 모델 빈 없이 뜬다
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # AI 답 저장소. 같은 k3s namespace 의 redis 서비스(K3S_PROFILES 의 redis)에 붙는다
      SPRING_DATA_REDIS_HOST: redis
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${RECOMMEND_PORT:-8087}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # dev 에서 켠 직후 약 375MiB 를 쓰고, 처음 쓰는 기능의 클래스를 불러올 때마다 늘어 445MiB 안팎에서 상한 448m 에 닿아 OOMKilled 됐다(#1237)
    # 힙은 90MiB 안팎이고 나머지는 Metaspace · Code cache · 스레드 스택이다. 힙이 128m 까지 차는 경우를 더해도 90MiB 쯤 남게 576m 으로 둔다
    mem_limit: 576m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 정산 서비스(apps/settlement-service, #729). 정산 API · 결제 · 주문 이벤트 수신(구독 그룹 kidly.settlement), 정산 이벤트 발행(아웃박스)
  # 비밀이 든 .env 를 통째로 넘기지 않고 필요한 값만 넘긴다. 토큰은 Gateway 가 검증하므로 키를 마운트하지 않는다
  settlement-service:
    image: ${SETTLEMENT_IMAGE}
    profiles: [settlement]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx256m
      # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다. 자녀 프로필 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 정산 영업일 판단용 공휴일 조회 키. 없으면 공휴일을 받아 저장하지 못한다
      HOLIDAY_API_SERVICE_KEY: ${HOLIDAY_API_SERVICE_KEY:-}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${SETTLEMENT_PORT:-8089}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # Spring Batch 포함. 측정 전이라 자녀 프로필 서비스 실측(최대 353MiB)을 기준으로 힙 256m · 상한 640m 으로 시작하고, 켠 뒤 재서 정한다
    mem_limit: 640m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 회원 서비스(apps/member-service). 비밀이 든 .env 대신 필요한 값만 넘긴다
  member-service:
    image: ${MEMBER_IMAGE}
    profiles: [member]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx192m
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PUBLIC_KEY_LOCATION: ${JWT_PUBLIC_KEY_LOCATION}
      JWT_PRIVATE_KEY_LOCATION: ${JWT_PRIVATE_KEY_LOCATION}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      IDENTITY_KEY_SECRET: ${IDENTITY_KEY_SECRET}
      # 판매자 탈퇴 조건 조회 주소
      KIDLY_ORDER_URI: ${KIDLY_ORDER_URI:-http://order-service:8080}
      KIDLY_SETTLEMENT_URI: ${KIDLY_SETTLEMENT_URI:-http://settlement-service:8080}
      KIDLY_ADMIN_BOOTSTRAP_EMAIL: ${KIDLY_ADMIN_BOOTSTRAP_EMAIL:-}
      KIDLY_ADMIN_BOOTSTRAP_PASSWORD: ${KIDLY_ADMIN_BOOTSTRAP_PASSWORD:-}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${MEMBER_PORT:-8090}:8080"     # 외부 비공개. 서버 안 수집용
    volumes:
      - ./jwt:/app/jwt:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # 힙 192m · 상한 512m 은 자녀 서비스 기준 추측값이다. 켠 뒤 재서 정한다
    mem_limit: 512m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 결제 서비스(apps/payment-service, #525). 결제 · 지갑 · 충전 API, 토스 웹훅, 회원 · 주문 · 정산 이벤트 수신(구독 그룹 kidly.payment), 결제 이벤트 발행(아웃박스)
  # 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값과 결제 값(토스 시크릿 키 · paymentKey 암호화 키 · Kafka 수신 스위치)만 넘긴다. 기존 충전을 취소하려면 암호화 키를 유지해야 한다
  # 토큰은 Gateway 가 검증하므로 JWT 키를 마운트하지 않는다
  payment-service:
    image: ${PAYMENT_IMAGE}
    profiles: [payment]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx192m
      # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다. 자녀 프로필 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      PAYMENT_KEY_ENCRYPTION_KEY: ${PAYMENT_KEY_ENCRYPTION_KEY:-}
      # Kafka 수신 스위치. 결제가 받는 이벤트(회원 · 주문 · 정산)는 다른 JVM 에서 오므로 둘 다 켜져 있어야 한다. 기본값은 payment.yml 과 같고, 장애 때 끄는 용도로만 .env 에 둔다
      PAYMENT_KAFKA_CONSUMER_ENABLED: ${PAYMENT_KAFKA_CONSUMER_ENABLED:-true}
      PAYMENT_KAFKA_SETTLEMENT_CONSUMER_ENABLED: ${PAYMENT_KAFKA_SETTLEMENT_CONSUMER_ENABLED:-true}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${PAYMENT_PORT:-8092}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # 힙 192m · 상한 512m 은 구성이 비슷한 자녀 프로필 서비스와 같게 둔 추측값이다. 켜기 전에 서버 메모리 여유를 보고, 켠 뒤 재서 정한다
    mem_limit: 512m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 상품 서비스(apps/product-service, #791). 상품 API(공개 · 판매자 · 관리자), 판매자 · 주문 이벤트 수신(구독 그룹 kidly.product), 상품 이벤트 아웃박스 저장
  # 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값과 상품 값(이미지 key 경로 · Kafka 수신 스위치)만 넘긴다
  # 토큰은 Gateway 가 검증하므로 JWT 키를 마운트하지 않는다
  product-service:
    image: ${PRODUCT_IMAGE}
    profiles: [product]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx192m
      # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다. 자녀 프로필 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 상품 이미지 객체 key 의 환경 경로(dev · prod). 서비스 prod 설정이 기본값 없이 요구하므로 .env 에서 받는다
      PRODUCT_IMAGE_KEY_PREFIX: ${PRODUCT_IMAGE_KEY_PREFIX}
      # Kafka 수신 스위치. 기본값은 product.yml 과 같다. false 로 두면 판매자 · 주문 이벤트 수신이 멈춰 재고 차감 · 결제 요청도 멈춘다(메시지는 Kafka 에 남고 true 로 올리면 처리된다)
      PRODUCT_KAFKA_CONSUMER_ENABLED: ${PRODUCT_KAFKA_CONSUMER_ENABLED:-true}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${PRODUCT_PORT:-8097}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # 힙 192m · 상한 512m 은 메모리 논의에서 정한 시작값이다. 켠 뒤 재서 정한다
    mem_limit: 512m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 알림 서비스(apps/notification-service). 회원 가입 이벤트 수신(구독 그룹 kidly.notification) → 환영 메일 저장 · Gmail SMTP 발송 · 실패 재발송(1분마다). 알림함 API(/api/v1/notifications/**, #852)는 Gateway 라우트로만 받는다
  # 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값과 메일 값만 넘긴다. MAIL_PASSWORD 는 파일에 없고 배포 워크플로가 Secret 에서 서버 .env 에 붙인 값을 받는다(없으면 보내지 않고 로그만 남긴다)
  notification-service:
    image: ${NOTIFICATION_IMAGE}
    profiles: [notification]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx192m
      # 힙 밖 네이티브 메모리가 커지는 것을 줄인다. 다른 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 메일 계정 · 켜기 · 보내는 주소. 기본값은 notification.yml 과 같다. .env 에서 받는다
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 웹 푸시 서비스 계정 키(Base64). 배포 워크플로가 Secret 에서 붙인다. 없으면 푸시는 보내지 않는다
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      # 메일 본문의 사이트 주소. 서비스 prod 설정이 기본값 없이 요구하므로 .env 에서 받는다
      NOTIFICATION_SITE_URL: ${NOTIFICATION_SITE_URL}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8099}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # 힙 192m · 상한 512m 은 상품 서비스와 같은 시작값이다. 켠 뒤 재서 정한다
    mem_limit: 512m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 주문 서비스(apps/order-service). 주문 · 장바구니 · 배송 · 조르기 API, 상품 · 판매자 · 자녀 · 결제 이벤트 수신(구독 그룹 kidly.order), 주문 이벤트 아웃박스 릴레이
  # 주문 도메인은 이 서비스에만 있다(#826). 스케줄러 · 아웃박스 릴레이는 DB 잠금(advisory lock)으로 한 번에 한 곳에서만 돌아, 배포 중 옛 컨테이너와 겹쳐도 한 번만 돈다
  # 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값과 주문 값(스위치 · 택배 조회 인증값)만 넘긴다
  # 토큰은 Gateway 가 검증하므로 JWT 키를 마운트하지 않는다
  order-service:
    image: ${ORDER_IMAGE}
    profiles: [order]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx256m
      # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다. 다른 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Kafka 수신 스위치. 기본값은 order.yml 과 같고, 장애 때 끄는 용도로만 .env 에 둔다. 끄면 수신이 멈추고 메시지는 Kafka 에 남아 true 로 올리면 처리된다
      ORDER_KAFKA_CONSUMER_ENABLED: ${ORDER_KAFKA_CONSUMER_ENABLED:-true}
      # 결제 마감. 기본값은 order.yml 과 같다(PT10M). .env.dev 에는 두지 않고, 시연 때만 잠깐 서버 .env 에 넣는다(#1041)
      ORDER_PAYMENT_TIMEOUT: ${ORDER_PAYMENT_TIMEOUT:-PT10M}
      # 판매자 발송 전 부분 취소 · 조르기 스위치. 기본값은 order.yml 과 같다
      ORDER_PARTIAL_CANCEL_ENABLED: ${ORDER_PARTIAL_CANCEL_ENABLED:-true}
      ORDER_WISH_ENABLED: ${ORDER_WISH_ENABLED:-true}
      # 택배 조회(Delivery Tracker) 인증값. 비어 있으면 택배 조회만 꺼진다(판매자 수동 배송 완료는 그대로)
      DELIVERY_TRACKER_CLIENT_ID: ${DELIVERY_TRACKER_CLIENT_ID:-}
      DELIVERY_TRACKER_CLIENT_SECRET: ${DELIVERY_TRACKER_CLIENT_SECRET:-}
      # 주문 운영 조회 MCP 창구(#925 · #1041, 읽기 전용 · 관리자만). 기본 꺼짐, dev 만 .env.dev 에서 켠다
      ORDER_MCP_ENABLED: ${ORDER_MCP_ENABLED:-false}
      # 멈춘 주문 AI 진단 메모(#926). 기본 꺼짐, 켜도 키가 비어 있으면 꺼진다. 제공자 · 주소 · 모델 기본값은 order.yml(Groq)
      ORDER_AI_ENABLED: ${ORDER_AI_ENABLED:-false}
      ORDER_AI_PROVIDER: ${ORDER_AI_PROVIDER:-openai-compatible}
      ORDER_AI_BASE_URL: ${ORDER_AI_BASE_URL:-https://api.groq.com/openai/v1}
      ORDER_AI_MODEL: ${ORDER_AI_MODEL:-openai/gpt-oss-20b}
      # 키는 따로 두지 않고 deploy 워크플로가 서버 .env 에 붙이는 GROQ_API_KEY(팀 Groq 무료 키, Environment Secret)를 쓴다(#1041).
      # ORDER_AI_API_KEY 를 .env 에 두면 그 값이 먼저다. 하루 상한(ORDER_AI_DAILY_LIMIT, 기본 200)은 order.yml 그대로
      ORDER_AI_API_KEY: ${ORDER_AI_API_KEY:-${GROQ_API_KEY:-}}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${ORDER_PORT:-8100}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # 주문은 스케줄러 · Kafka 리스너가 많아 정산 서비스와 같은 힙 256m · 상한 640m 으로 시작한다. 켠 뒤 재서 정한다
    mem_limit: 640m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 커뮤니티 서비스(apps/community-service). 리뷰 · 찜 API, 상품 · 주문 이벤트 수신(구독 그룹 kidly.community), 커뮤니티 DLT 보관
  # 커뮤니티 도메인은 이 서비스에만 있다(#827). 같은 이벤트를 다시 받아도 결과는 1회분이다(복사본 occurredAt 비교 · 유일 제약)
  # 커뮤니티는 이벤트를 보내지 않고 스케줄러가 없다. 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값과 수신 스위치만 넘긴다
  # 토큰은 Gateway 가 검증하므로 JWT 키를 마운트하지 않는다
  community-service:
    image: ${COMMUNITY_IMAGE}
    profiles: [community]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx192m
      # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다. 다른 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Kafka 수신 스위치. 기본값은 community.yml 과 같고, 장애 때 끄는 용도로만 .env 에 둔다. 끄면 수신이 멈추고 메시지는 Kafka 에 남아 true 로 올리면 처리된다
      COMMUNITY_KAFKA_CONSUMER_ENABLED: ${COMMUNITY_KAFKA_CONSUMER_ENABLED:-true}
      # 리뷰 검사 AI 키(#1002). 비어 있으면 AI 를 빼고 금칙어만 쓴다
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # 운영 조회 MCP 창구(#1005). 기본 꺼짐
      COMMUNITY_MCP_ENABLED: ${COMMUNITY_MCP_ENABLED:-false}
      # 쓰이지 않는 리뷰 사진 정리(#1036). 기본 꺼짐, 서버 역할의 S3 삭제 · 목록 권한을 확인한 뒤 켠다
      COMMUNITY_REVIEW_IMAGE_CLEANUP_ENABLED: ${COMMUNITY_REVIEW_IMAGE_CLEANUP_ENABLED:-false}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${COMMUNITY_PORT:-8102}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # 힙 192m · 상한 512m 은 상품 · 결제 서비스와 같은 시작값이다. 켠 뒤 재서 정한다
    mem_limit: 512m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # 챗봇 서비스(apps/chatbot-service, #1191). 회원 챗봇 API 와 답변 근거 문서. Kafka 를 쓰지 않는다
  # 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값 · OpenAI 키 · 검색 · 주문 서비스 주소만 넘긴다. 토큰은 Gateway 가 검증하므로 JWT 키를 마운트하지 않는다
  chatbot-service:
    image: ${CHATBOT_IMAGE}
    profiles: [chatbot]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx128m
      # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다. 다른 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 문서 임베딩 · 답변(#1191). 없으면 문서 저장과 근거가 있는 질문의 답변이 503이다. deploy 워크플로가 Environment Secret 에서 붙인다
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 상품 검색 도구(#1191)가 부르는 검색 서비스. 검색 서비스가 꺼져 있으면 상품 질문에 상품을 찾지 못했다고 답한다
      KIDLY_SEARCH_URI: ${KIDLY_SEARCH_URI:-http://search-service:8080}
      # 내 주문 조회 도구(#1191)가 부르는 주문 서비스. 주문 서비스가 꺼져 있으면 주문 질문에 주문을 확인하지 못했다고 답한다
      KIDLY_ORDER_URI: ${KIDLY_ORDER_URI:-http://order-service:8080}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${CHATBOT_PORT:-8104}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 여러 서비스가 함께 떠 CPU 경합으로 3분 가까이 걸린다. 유예 동안의 실패는 세지 않는다(최대 약 5분 기다림)
      start_period: 180s
    # 기능이 없는 뼈대라 지금 서비스 중 가장 작은 추천 서비스의 시작값(힙 128m · 상한 448m)으로 둔다. 켠 뒤 재서 정한다
    mem_limit: 448m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

  # Gateway(apps/gateway, #608). nginx 뒤에서 토큰 검증 · 무효화 확인 · CORS 를 하고 app 으로 넘긴다. 상품 목록은 KIDLY_SEARCH_URI 로 넘긴다(#526)
  # 토큰 무효화 이벤트를 받는다(구독 그룹 kidly.gateway). DB 가 없어 비밀이 든 .env 대신 필요한 값만 넘기고 공개키만 마운트한다
  gateway:
    image: ${GATEWAY_IMAGE}
    profiles: [gateway]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx256m
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      # 상품 목록(GET /api/v1/products)을 받을 곳(#526). profile search 가 꺼진 환경에서는 상품 목록이 실패한다
      KIDLY_SEARCH_URI: ${KIDLY_SEARCH_URI:-http://search-service:8080}
      # 추천(/api/v1/recommendations/**)을 받을 곳(#704). profile recommend 가 꺼진 환경에서는 추천 API 가 실패한다
      KIDLY_RECOMMEND_URI: ${KIDLY_RECOMMEND_URI:-http://recommend-service:8080}
      # 정산(/api/v1/seller/settlement* · /api/v1/admin/settlement*)을 받을 곳(#729). profile settlement 가 꺼진 환경에서는 정산 API 가 실패한다
      KIDLY_SETTLEMENT_URI: ${KIDLY_SETTLEMENT_URI:-http://settlement-service:8080}
      # 회원 · 인증 · 판매자 API 는 회원 서비스가 받는다
      KIDLY_MEMBER_URI: ${KIDLY_MEMBER_URI:-http://member-service:8080}
      # 결제(/api/v1/payments/** · /api/v1/wallets/** · /api/v1/webhooks/toss · 결제 관리자 API)를 받을 곳(#525). profile payment 가 꺼진 환경에서는 결제 API 가 실패한다
      KIDLY_PAYMENT_URI: ${KIDLY_PAYMENT_URI:-http://payment-service:8080}
      # 상품 API(공개 · 판매자 · 관리자)를 받을 곳(#791). profile product 가 꺼진 환경에서는 상품 API 가 실패한다
      KIDLY_PRODUCT_URI: ${KIDLY_PRODUCT_URI:-http://product-service:8080}
      # 주문 · 장바구니 · 배송 · 조르기 · 주문 관리자 API 를 받을 곳(#826). profile order 가 꺼진 환경에서는 주문 API 가 실패한다
      KIDLY_ORDER_URI: ${KIDLY_ORDER_URI:-http://order-service:8080}
      # 리뷰 · 찜 · 커뮤니티 관리자 API 를 받을 곳(#827). profile community 가 꺼진 환경에서는 이 API 가 실패한다
      KIDLY_COMMUNITY_URI: ${KIDLY_COMMUNITY_URI:-http://community-service:8080}
      # 알림함 API(/api/v1/notifications/**)를 받을 곳(#852). profile notification 이 꺼진 환경에서는 이 API 가 실패한다
      KIDLY_NOTIFICATION_URI: ${KIDLY_NOTIFICATION_URI:-http://notification-service:8080}
      # 챗봇 API(/api/v1/chatbot/** · /api/v1/admin/chatbot/**)를 받을 곳(#1191). profile chatbot 이 꺼진 환경에서는 이 API 가 실패한다
      KIDLY_CHATBOT_URI: ${KIDLY_CHATBOT_URI:-http://chatbot-service:8080}
      JWT_PUBLIC_KEY_LOCATION: file:/app/jwt/public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_PATH: /app/logs
    # 서비스가 k3s 에 뜨는 환경(dev)은 KIDLY_*_URI 가 이 서버의 NodePort(host.docker.internal)를 가리킨다(#1142)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8083}:8080"     # 외부 비공개. nginx 가 받아 넘긴다
    volumes:
      - ./jwt/public.pem:/app/jwt/public.pem:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 512m
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    restart: unless-stopped
    logging: *logging

