# 서버용. 배포 때 워크플로가 /opt/app/<env>/ 로 올린다 (env 마다 다른 것은 .env 뿐)
# deploy.sh 가 -p <env> --env-file .env --env-file image.env 로 실행한다
# 검색(search-service)은 profile search 라 .env 의 COMPOSE_PROFILES=search 인 환경(지금은 dev)에서만 뜬다
# Gateway(gateway)는 profile gateway 라 COMPOSE_PROFILES 에 gateway 가 있는 환경(dev · prod)에서만 뜬다
# 자녀 프로필(childprofile-service)은 profile childprofile 이라 COMPOSE_PROFILES 에 childprofile 이 있는 환경(dev · prod)에서만 뜬다. app 에는 자녀 API 가 없어 자녀 API 를 쓰는 환경은 모두 켜야 한다
# 추천(recommend-service)은 profile recommend 라 COMPOSE_PROFILES 에 recommend 가 있는 환경(dev · prod)에서만 뜬다. app 에는 추천 API 가 없어 추천 API 를 쓰는 환경은 모두 켜야 한다

# 컨테이너 로그가 디스크를 채우지 않도록 10MB 씩 5개까지만 남긴다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: ${IMAGE}
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:${APP_PORT}:8080"     # 외부 비공개. nginx 가 80/443 으로 받아 넘긴다
    volumes:
      - ./jwt:/app/jwt:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      # 결제 등이 커밋 뒤 Kafka로 보낸다. 브로커가 뜬 뒤에 앱을 띄운다
      kafka:
        condition: service_healthy
    # deploy.sh 의 up -d --wait 가 이 healthcheck 를 기다린다. Spring 기동에 20~40초 걸린다
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # 한 서버에 dev · prod 가 같이 떠도 한 컨테이너가 메모리를 다 써서 다른 환경까지 OOM 으로 죽이지 않게 서비스마다 상한을 둔다
    # 합계는 prod 3328MiB(app 1024 · postgres 512 · kafka 768 · gateway 512 · 자녀 512) + dev 4352MiB(여기에 검색 1024) = 7680MiB 로 호스트(t3.large 8GiB) 안이다. 남는 512MiB 를 OS · nginx · Alloy 가 쓴다
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:18
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${DB_PORT}:5432"     # 외부 비공개. 팀원이 SSH 터널로 IntelliJ 에서 붙는다

  # 도메인 간 이벤트를 전달한다. 환경(-p <env>)마다 따로 뜨고 같은 compose 네트워크의 app 만 kafka:9092 로 붙는다(포트 비공개)
  # KRaft 단일 브로커라 복제 계수는 1. EC2 가 멈췄다 켜져도 쌓인 메시지가 남도록 데이터는 볼륨에 둔다
  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽 자동 생성을 끈다. 켜져 있으면 없는 토픽에 보내거나 구독할 때 파티션 1개짜리 토픽이 조용히 생겨 이름 오타가 묻힌다.
      # 토픽은 보내는 쪽이 코드(NewTopic)로 선언한다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 메시지 보존 7일(기본값을 명시). 주말에 EC2가 멈춰도 남고, 이벤트의 개인정보(가입 이메일 등)도 7일 뒤 지워진다
      KAFKA_LOG_RETENTION_HOURS: 168
      # 메시지 · 책갈피를 볼륨(kafka-data)에 쓴다. 이미지 기본값은 컨테이너 안 /tmp라서, 없으면 컨테이너를 다시 만들 때 모두 사라진다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    # 포트만 본다. kafka-broker-api-versions.sh 는 부를 때마다 JVM 을 띄워 1회 CPU 약 4초를 쓴다(10초 주기면 0.33코어). 9092 리스너는 브로커 준비 직전에 열려서 포트 검사로 충분하다
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  # 검색 서비스(apps/search-service). 상품 목록 검색 API 와 상품 · 판매자 이벤트 수신(구독 그룹 kidly.search)
  # 비밀이 든 .env 를 통째로 넘기지 않고 필요한 값만 넘긴다. 토큰은 Gateway 가 검증하므로 키를 마운트하지 않는다
  # /actuator/health 가 Elasticsearch 연결을 본다. ES 는 t3.medium k3s(deploy/search), 앱 배포 전에 deploy 워크플로가 먼저 올린다
  # ELASTICSEARCH_URIS(medium 사설 IP)는 레포가 공개라 deploy 워크플로가 서버 .env 에 붙인다
  search-service:
    image: ${SEARCH_IMAGE}
    profiles: [search]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx512m
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 기본값은 profile 이 꺼진 환경(prod)에서 빈 값 경고를 내지 않으려는 것이다
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:-}
      SEARCH_INDEX_PREFIX: ${SEARCH_INDEX_PREFIX:-}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${SEARCH_PORT:-8082}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에 열 때는 nginx 가 아니라 Gateway 라우트로(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  # 자녀 프로필 서비스(apps/childprofile-service, #682). 자녀 프로필 API 와 회원 이벤트 수신(구독 그룹 kidly.childprofile), 자녀 이벤트 발행
  # 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값만 넘긴다. 토큰은 Gateway 가 검증하므로 키를 마운트하지 않는다
  childprofile-service:
    image: ${CHILDPROFILE_IMAGE}
    profiles: [childprofile]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: Asia/Seoul
      # 힙은 64MiB 안팎만 쓴다(#682 측정)
      JAVA_TOOL_OPTIONS: -Xmx192m
      # 힙 밖 네이티브 메모리(glibc malloc arena)가 동시 요청에 따라 커지는 것을 줄인다. 2 CPU 동시 부하에서 472MiB → 353MiB(#682 측정)
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${CHILDPROFILE_PORT:-8085}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    # 빈 DB 에서는 app 이 먼저 마이그레이션해야 한다. app 의 init 이 자녀 테이블도 만들어, 서비스가 먼저 만들면 app 의 init 이 실패한다(#682)
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # 2 CPU 동시 부하 뒤 353MiB(힙 64MiB 안팎, 나머지는 Metaspace · 스레드 등 힙 밖). 힙이 192m 까지 차도 추정 약 455MiB(#682 측정)
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  # 추천 서비스(apps/recommend-service, #704). 추천 API 와 판매자 · 자녀 · 상품 · 주문 이벤트 수신(구독 그룹 kidly.recommend). 보내는 이벤트는 없다
  # 비밀이 든 .env 를 통째로 넘기지 않고 DB 접속값만 넘긴다. 토큰은 Gateway 가 검증하므로 키를 마운트하지 않는다
  recommend-service:
    image: ${RECOMMEND_IMAGE}
    profiles: [recommend]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx128m
      # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다. 자녀 프로필 서비스와 같은 설정이다
      MALLOC_ARENA_MAX: "2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${RECOMMEND_PORT:-8087}:8080"     # 외부 비공개. 서버 안 수집(Alloy)용. 밖에서는 Gateway 라우트로만 닿는다(nginx 가 바로 넘기면 X-Member-* 위조 가능)
    volumes:
      - ./logs:/app/logs
    # 빈 DB 에서는 app 이 먼저 마이그레이션해야 한다. app 의 init 이 추천 테이블도 만들어, 서비스가 먼저 만들면 app 의 init 이 실패한다(#704)
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # 구성이 비슷한 자녀 프로필 서비스가 dev 에서 7일 최대 365MiB(힙 64MiB 안팎)를 썼다. 그보다 조금 넉넉하게 힙 128m · 상한 448m 으로 시작하고, 켠 뒤 재서 정한다
    mem_limit: 448m
    restart: unless-stopped
    logging: *logging

  # Gateway(apps/gateway, #608). nginx 뒤에서 토큰 검증 · 무효화 확인 · CORS 를 하고 app 으로 넘긴다. 상품 목록은 KIDLY_SEARCH_URI 로 넘긴다(#526)
  # 토큰 무효화 이벤트를 받는다(구독 그룹 kidly.gateway). DB 가 없어 비밀이 든 .env 대신 필요한 값만 넘기고 공개키만 마운트한다
  gateway:
    image: ${GATEWAY_IMAGE}
    profiles: [gateway]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Xmx256m
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 같은 compose 네트워크의 app 컨테이너 포트(8080)다. 서버 포트(APP_PORT)가 아니다
      KIDLY_APP_URI: http://app:8080
      # 상품 목록(GET /api/v1/products)을 받을 곳(#526). 검색이 켜진 환경(dev)은 .env 에 search-service 를 두고, 없으면(prod) 지금처럼 app 이 받는다
      KIDLY_SEARCH_URI: ${KIDLY_SEARCH_URI:-http://app:8080}
      # 자녀 프로필(/api/v1/children/**)을 받을 곳(#682). app 에는 자녀 API 가 없어 profile childprofile 이 꺼진 환경에서는 자녀 API 가 실패한다
      KIDLY_CHILDPROFILE_URI: ${KIDLY_CHILDPROFILE_URI:-http://childprofile-service:8080}
      # 추천(/api/v1/recommendations/**)을 받을 곳(#704). app 에는 추천 API 가 없어 profile recommend 가 꺼진 환경에서는 추천 API 가 실패한다
      KIDLY_RECOMMEND_URI: ${KIDLY_RECOMMEND_URI:-http://recommend-service:8080}
      JWT_PUBLIC_KEY_LOCATION: file:/app/jwt/public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8083}:8080"     # 외부 비공개. nginx 가 받아 넘긴다
    volumes:
      - ./jwt/public.pem:/app/jwt/public.pem:ro
      - ./logs:/app/logs
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
  kafka-data:
