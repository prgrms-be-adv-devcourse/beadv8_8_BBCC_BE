# Explicit override for the dev project. Keep outside automatic deploy packaging.
x-tracing-env: &tracing-env
  JAVA_TOOL_OPTIONS: -Xmx256m -javaagent:/opt/tracing/opentelemetry-javaagent.jar
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${TRIAL_ALLOY_TRACES_ENDPOINT:?set the private Alloy endpoint}
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_PROPAGATORS: tracecontext
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${TRIAL_SAMPLE_RATIO:-0.05}
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev
  OTEL_INSTRUMENTATION_KAFKA_ENABLED: "false"
  OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "false"
  OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "false"

x-agent-mount: &agent-mount
  type: bind
  source: ${TRIAL_AGENT_JAR:?set the verified agent jar path}
  target: /opt/tracing/opentelemetry-javaagent.jar
  read_only: true
  bind:
    create_host_path: false

services:
  gateway:
    environment:
      <<: *tracing-env
      OTEL_SERVICE_NAME: kidly-gateway
    volumes:
      - *agent-mount
  order-service:
    environment:
      <<: *tracing-env
      OTEL_SERVICE_NAME: kidly-order
    volumes:
      - *agent-mount
