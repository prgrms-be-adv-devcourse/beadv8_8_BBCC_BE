apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-trial
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo-trial
  template:
    metadata:
      labels:
        app: tempo-trial
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
          args: ["-config.file=/etc/tempo/tempo.yml"]
          ports:
            - name: query
              containerPort: 3200
            - name: otlp
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /ready
              port: query
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: trace-data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-trial-config
        - name: trace-data
          emptyDir:
            sizeLimit: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-trial
spec:
  selector:
    app: tempo-trial
  ports:
    - name: query
      port: 3200
    - name: otlp
      port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-trial
spec:
  podSelector:
    matchLabels:
      app: tempo-trial
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3200
    - from:
        - podSelector:
            matchLabels:
              app: alloy-trial
      ports:
        - protocol: TCP
          port: 4318
