# 추천 서비스(apps/recommend-service, #1028). t3.large 에 단독으로 띄운 k3s(노드 하나)에 환경마다 namespace 하나로 뜬다
# __APP_ENV__ · __IMAGE__ · __NODE_PORT__ · __SPRING_PROFILE__ · __KAFKA__ · __DB_URL__ · __DB_USERNAME__ 는 deploy.sh 가 바꾼다
# Secret recommend-secrets(DB_PASSWORD · OPENAI_API_KEY) 와 pull secret ghcr-pull 은 deploy.sh 가 배포마다 만든다
apiVersion: v1
kind: Namespace
metadata:
  name: recommend-__APP_ENV__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommend
  namespace: recommend-__APP_ENV__
spec:
  # replicas 를 두지 않는다. HPA 가 정한 수를 배포가 1로 되돌리지 않게 한다(처음 만들 때는 1)
  revisionHistoryLimit: 3
  # 새 Pod 가 준비된 뒤 옛 Pod 를 내린다. 배포 동안 잠깐 Pod 하나가 더 뜬다
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: recommend
  template:
    metadata:
      labels:
        app: recommend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # 처리 중인 요청 · Kafka 메시지를 마치고 내려간다(Spring graceful shutdown 기본 30초 + preStop 5초)
      terminationGracePeriodSeconds: 45
      containers:
        - name: recommend
          image: __IMAGE__
          # 노드에 이미지가 있으면 쓴다. HPA 가 늘린 Pod 는 노드의 이미지를 쓰므로 만료된 pull secret 이 문제 되지 않는다
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: __SPRING_PROFILE__
            - name: TZ
              value: Asia/Seoul
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx128m
            # 힙 밖 네이티브 메모리가 동시 요청에 따라 커지는 것을 줄인다(compose 때와 같다)
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: __KAFKA__
            - name: DB_URL
              value: __DB_URL__
            - name: DB_USERNAME
              value: __DB_USERNAME__
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recommend-secrets
                  key: DB_PASSWORD
            # 비어 있으면 OpenAI 모델 빈 없이 뜬다
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recommend-secrets
                  key: OPENAI_API_KEY
            - name: LOG_PATH
              value: /app/logs
          ports:
            - name: http
              containerPort: 8080
          # 쿠버네티스 위에서는 Spring Boot 가 liveness · readiness health 그룹을 켠다
          # 여러 서비스가 함께 떠 CPU 경합으로 기동이 3분 가까이 걸린 적이 있어(compose start_period 180s) 5분까지 기다린다
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          # Service 에서 빠지는 동안 들어온 요청을 받도록 잠깐 기다린 뒤 종료를 시작한다
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # cpu request 는 HPA 의 기준(70% = 140m)이다. cpu limit 은 두지 않는다(기동 때 CPU 를 많이 써 막히면 기동이 길어진다)
          # 메모리는 compose 상한 448m 을 그대로 쓴다. 자녀 프로필 서비스가 dev 7일 최대 365MiB 를 썼다
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 448Mi
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      # 파일 로그는 Pod 와 함께 사라진다. 로그는 t3.large 의 monitoring-agent Alloy 가 Pod 콘솔에서 Loki 로 모은다
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
---
# Gateway(t3.large compose)가 host.docker.internal:<NodePort> 로 붙는다. Pod 가 여럿이면 Service 가 나눠 준다
# NodePort 는 노드의 모든 주소에 열린다. 보안 그룹에서 밖으로 열지 않는다(밖에서 닿으면 X-Member-* 를 위조할 수 있다)
apiVersion: v1
kind: Service
metadata:
  name: recommend
  namespace: recommend-__APP_ENV__
spec:
  type: NodePort
  selector:
    app: recommend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: __NODE_PORT__
---
# 구독 그룹 kidly.recommend 가 받는 토픽이 모두 파티션 3 이라 4번째 Pod 부터는 이벤트를 받지 않는다. 그래서 최대 3
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommend
  namespace: recommend-__APP_ENV__
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # 줄일 때는 5분 동안 낮게 유지될 때만 한 번에 하나씩 줄인다(Kafka 리밸런스를 줄인다)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
