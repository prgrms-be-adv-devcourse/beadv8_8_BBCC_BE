# 서비스들이 쓰는 PostgreSQL. t3.large 의 서비스가 medium 사설 IP 의 NodePort 30432 로 붙는다
# 인스턴스 하나를 dev · prod 가 database · 계정(kidly_dev · kidly_prod)으로 나눠 쓴다. 계정 · database 는 deploy.sh 의 부트스트랩이 만든다
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: postgres
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: postgres
spec:
  replicas: 1
  # 데이터 폴더는 한 프로세스만 쓸 수 있어 옛 Pod 를 먼저 내린다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kidly/role: infra
      containers:
        - name: postgres
          # 추천이 벡터를 저장하려고 pgvector 확장이 든 이미지를 쓴다(compose 때와 같다)
          image: pgvector/pgvector:pg18-trixie
          # 커넥션 풀 5 × 서비스 8 × 두 환경 = 80. 관리자 · 팀원 접속 여유를 둔다
          args: ["-c", "max_connections=120"]
          env:
            # 관리자(postgres) 비밀번호. 볼륨을 처음 만들 때만 쓰인다. deploy.sh 가 처음 한 번 무작위로 만든다
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          # compose 때 실측 167MiB(연결 89개, 연결당 약 1.3MiB). 풀을 줄인 두 환경 80 연결 기준
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
# NodePort 는 노드의 모든 주소에 열린다. 보안 그룹(소스 team04-sg)으로만 막는다
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
