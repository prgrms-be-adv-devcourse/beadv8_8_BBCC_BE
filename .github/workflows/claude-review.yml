name: Claude Review

# PR을 열거나 Ready for review로 바꿀 때, 커밋을 push할 때 리뷰한다
# 연달아 push하면 앞선 리뷰를 취소하고 마지막 커밋만 리뷰한다(concurrency). 그 밖에 다시 받으려면 PR 댓글에 @claude를 쓴다 (claude.yml)
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude 코드 리뷰
    # 초안은 건너뛴다. 포크에서 온 PR은 시크릿을 받을 수 없어 건너뛴다
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 댓글은 Claude GitHub App 토큰으로 남긴다(작성자 claude[bot]). id-token으로 App 토큰을 받는다
    # App 토큰은 아래 권한에 묶이지 않으므로, 읽기 전용은 허용 도구와 --disallowedTools로 지킨다
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 리뷰
        id: claude
        # 실패해도 다음 단계에서 사용량 초과인지 보고 결과를 정한다
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰해 주세요. 기준은 루트 CLAUDE.md와, 바뀐 파일이 속한 도메인 폴더의 CLAUDE.md(있으면)예요.

            다음 순서로 중요하게 봐 주세요.
            1. 버그 · 데이터 정합성: 금액 · 재고 · 상태 전이, 동시성(락 · 유니크 키), 트랜잭션 경계, 커밋 뒤 실행되는 이벤트 리스너(@DomainEventListener)
            2. 보안: 인증 · 인가 누락, 남의 데이터 접근, 로그에 민감 정보(토큰 · 키 · paymentKey) 노출
            3. 구조 규칙: 도메인끼리 코드를 직접 참조하지 않고 shared 이벤트로만 주고받는지, 계층 의존(in → app → domain, out → app.port · domain)
            4. 테스트: 바뀐 동작에 맞는 단위 · 통합 · 기능 테스트가 있는지, 빠진 경우
            5. DB: 이미 적용된 Flyway 파일을 고쳤는지, 명명 규칙(CLAUDE.md DB 명명)
            6. API 응답 규칙(CLAUDE.md API 응답)

            지켜 주세요.
            - 코드 스타일 · 포매팅은 Checkstyle이, 빌드 · 테스트 실행은 CI가 하니 지적하거나 실행하지 마세요
            - 구체적인 문제는 해당 줄에 인라인 댓글로 남기고, 무엇이 왜 문제인지와 고치는 방법을 적어 주세요
            - 확실하지 않은 것은 단정하지 말고 질문으로 남겨 주세요
            - 마지막에 요약 댓글 하나를 남겨 주세요. 문제가 없으면 짧게 그렇다고만 적어 주세요
            - 커밋이 추가돼 다시 리뷰하는 경우면, 먼저 `gh pr view --comments`로 이전 리뷰 요약을 읽어 주세요. 이미 지적한 것은 인라인 댓글로 다시 남기지 말고, 요약에 고쳐졌는지 · 아직 남았는지만 적어 주세요
            - 모든 댓글은 한국어 해요체로 써 주세요
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*)"

      # 구독 사용량을 넘어 실패했으면 건너뛴 것으로 두고 PR에 알린다. 그 밖의 실패는 그대로 실패로 남긴다
      # 판별: 실행 기록에 사용량 거절(rate_limit_event rejected) 또는 assistant 오류 rate_limit가 있는지
      - name: 사용량 초과 확인
        if: steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          limited=$(jq '[.[] | select((.type == "rate_limit_event" and .rate_limit_info.status == "rejected") or (.type == "assistant" and .error == "rate_limit"))] | length' "$EXECUTION_FILE" 2>/dev/null || echo 0)
          if [ "$limited" = "0" ]; then
            echo "::error::Claude 리뷰가 실패했어요. 위 단계 로그를 확인해 주세요"
            exit 1
          fi
          resets=$(jq -r '[.[] | select(.type == "rate_limit_event") | .rate_limit_info.resetsAt // empty] | last // empty' "$EXECUTION_FILE")
          when=""
          if [ -n "$resets" ]; then
            [ "$resets" -gt 100000000000 ] && resets=$((resets / 1000))
            when=" $(TZ=Asia/Seoul date -d "@$resets" '+%m/%d %H:%M') 이후 다시 쓸 수 있어요."
          fi
          echo "::warning::Claude 구독 사용량을 넘어 리뷰를 건너뛰었어요.$when"
          gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "Claude 구독 사용량을 넘어 이번 리뷰는 건너뛰었어요.$when 다시 받으려면 \`@claude 리뷰해 주세요\`라고 댓글을 달아 주세요."
