name: CI

# develop · main push 에서는 따로 돌지 않고 deploy.yml 이 불러 배포 전에 돌린다 (CI 가 실패하면 배포하지 않는다)
on:
  pull_request:
    branches: [main, develop]
  workflow_call:

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다. 배포에서 부른 실행은 끝까지 돌린다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 서로 상관없는 검사는 job을 나눠 동시에 돌린다. 각 job이 따로 컴파일하지만, 가장 긴 job 시간만 기다리면 된다.
# Gradle 캐시는 기본 브랜치(develop) push 로 돈 배포 안의 CI 에서 저장되고, PR은 읽기만 한다 (setup-gradle 기본 동작)
jobs:
  # 문서만 바꾼 PR은 테스트를 돌리지 않는다. build 가 필수 검사라 워크플로 단위 paths-ignore 를 쓰면 build 가 보고되지 않아 머지할 수 없다
  # PR 의 merge 커밋과 첫 부모(현재 base)를 비교한다. 배포에서 부른 실행(workflow_call)은 deploy.yml 이 이미 경로를 걸렀으므로 늘 전체를 돈다
  # docker/** 는 건너뛰지 않는다. 검색 테스트가 docker/elasticsearch/Dockerfile 로 ES 이미지를 만든다
  changes:
    name: 변경 범위 확인
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - id: check
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 옮긴 파일은 옛 경로도 본다(코드를 docs/ 로 옮겨도 코드 변경이다). 리소스로 읽는 .md 는 코드로 본다
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qvE '^(docs|wiki)/|\.md$' <<< "$files" || grep -qE '/src/[^/]+/resources/' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=테스트 생략::문서만 바뀌어 단위 · 통합 · 기능 테스트를 건너뜁니다"
          fi

  unit:
    name: 정적 검사 · 단위 테스트
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # 이 job은 Docker를 쓰지 않아 모듈끼리 동시에 돌려도 서로 부딪히지 않는다
      - name: 컴파일
        run: ./gradlew compileJava compileTestJava --parallel

      - name: 코드 스타일 검사 (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest checkstyleTestFixtures --parallel

      - name: 모듈 경계 · 의존성 검사
        run: ./gradlew archTest --parallel

      - name: 단위 테스트
        run: ./gradlew test --parallel

      - name: 패키징
        run: ./gradlew assemble

      # 회원 서비스는 루트 빌드에 없고 자체 settings · wrapper로 따로 빌드한다
      - name: 회원 서비스 정적 검사 · 단위 테스트 · 패키징
        working-directory: apps/member-service
        run: >-
          ./gradlew
          checkstyleMain checkstyleTest checkstyleTestFixtures archTest test assemble
          --parallel

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-unit
          path: '**/build/reports/'
          retention-days: 7

  # 모듈마다 컨테이너 · 컨텍스트를 따로 띄워 한 러너에서 차례로 돌리면 오래 걸린다. 오래 걸리는 모듈은 러너를 따로 쓴다.
  # 나머지는 따로 뺀 모듈만 제외하고 돌려, 새로 생긴 모듈의 통합 테스트도 빠지지 않게 한다
  integration:
    name: 통합 테스트 (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: order
            tasks: :domains:order:integrationTest :apps:order-service:integrationTest
          - name: community
            tasks: :domains:community:integrationTest :apps:community-service:integrationTest
          - name: search-service
            tasks: :apps:search-service:integrationTest
          - name: recommend-service
            tasks: :apps:recommend-service:integrationTest
          - name: settlement-service
            tasks: :apps:settlement-service:integrationTest
          - name: member-service
            dir: apps/member-service
            tasks: integrationTest
          - name: payment-service
            tasks: :apps:payment-service:integrationTest
          - name: product-service
            tasks: :apps:product-service:integrationTest
          - name: 나머지
            tasks: integrationTest -x :domains:order:integrationTest -x :apps:order-service:integrationTest -x :domains:community:integrationTest -x :apps:community-service:integrationTest -x :apps:search-service:integrationTest -x :apps:recommend-service:integrationTest -x :apps:settlement-service:integrationTest -x :apps:payment-service:integrationTest -x :apps:product-service:integrationTest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # dir이 있는 항목(회원 서비스)은 그 폴더의 자체 wrapper로 빌드한다
      - name: 통합 테스트 (Testcontainers)
        working-directory: ${{ matrix.dir || '.' }}
        run: ./gradlew ${{ matrix.tasks }}

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-integration-${{ matrix.name }}
          path: '**/build/reports/'
          retention-days: 7

  # 통합 테스트와 같은 이유로 오래 걸리는 모듈은 러너를 따로 쓴다
  functional:
    name: 기능 테스트 (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: order
            tasks: :domains:order:functionalTest :apps:order-service:functionalTest
          - name: community
            tasks: :domains:community:functionalTest :apps:community-service:functionalTest
          - name: search-service
            tasks: :apps:search-service:functionalTest
          - name: recommend-service
            tasks: :apps:recommend-service:functionalTest
          - name: settlement-service
            tasks: :apps:settlement-service:functionalTest
          - name: member-service
            dir: apps/member-service
            tasks: functionalTest
          - name: payment-service
            tasks: :apps:payment-service:functionalTest
          - name: product-service
            tasks: :apps:product-service:functionalTest
          - name: 나머지
            tasks: functionalTest -x :domains:order:functionalTest -x :apps:order-service:functionalTest -x :domains:community:functionalTest -x :apps:community-service:functionalTest -x :apps:search-service:functionalTest -x :apps:recommend-service:functionalTest -x :apps:settlement-service:functionalTest -x :apps:payment-service:functionalTest -x :apps:product-service:functionalTest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # dir이 있는 항목(회원 서비스)은 그 폴더의 자체 wrapper로 빌드한다
      - name: 기능 테스트 (Testcontainers)
        working-directory: ${{ matrix.dir || '.' }}
        run: ./gradlew ${{ matrix.tasks }}

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-functional-${{ matrix.name }}
          path: '**/build/reports/'
          retention-days: 7

  # 브랜치 보호의 필수 검사(build). 세 job이 모두 성공해야 통과한다 (하나라도 실패 · 취소면 실패). 문서만 바뀐 PR은 세 job을 건너뛰고 통과한다
  build:
    needs: [changes, unit, integration, functional]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code == 'true' && contains(needs.*.result, 'skipped'))
        run: |
          echo "실패한 검사가 있어요: changes=${{ needs.changes.result }}, unit=${{ needs.unit.result }}, integration=${{ needs.integration.result }}, functional=${{ needs.functional.result }}"
          exit 1
