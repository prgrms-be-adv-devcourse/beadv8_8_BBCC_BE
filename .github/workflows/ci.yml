name: CI

# develop · main push 에서는 따로 돌지 않고 deploy.yml 이 불러 배포 전에 돌린다 (CI 가 실패하면 배포하지 않는다)
on:
  pull_request:
    branches: [main, develop]
  workflow_call:

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다. 배포에서 부른 실행은 끝까지 돌린다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 서로 상관없는 검사는 job을 나눠 동시에 돌린다. 각 job이 따로 컴파일하지만, 가장 긴 job(통합 테스트) 시간만 기다리면 된다.
# Gradle 캐시는 기본 브랜치(develop) push 로 돈 배포 안의 CI 에서 저장되고, PR은 읽기만 한다 (setup-gradle 기본 동작)
jobs:
  unit:
    name: 정적 검사 · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: 컴파일
        run: ./gradlew compileJava compileTestJava

      - name: 코드 스타일 검사 (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: 모듈 경계 검사 (ArchUnit)
        run: ./gradlew archTest

      - name: 단위 테스트
        run: ./gradlew test

      - name: 패키징
        run: ./gradlew assemble

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-unit
          path: build/reports/
          retention-days: 7

  integration:
    name: 통합 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: 통합 테스트 (Testcontainers)
        run: ./gradlew integrationTest

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-integration
          path: build/reports/
          retention-days: 7

  functional:
    name: 기능 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: 기능 테스트 (Testcontainers)
        run: ./gradlew functionalTest

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-functional
          path: build/reports/
          retention-days: 7

  # 브랜치 보호의 필수 검사(build). 세 job이 모두 성공해야 통과한다 (하나라도 실패 · 취소면 실패)
  build:
    needs: [unit, integration, functional]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "실패한 검사가 있어요: unit=${{ needs.unit.result }}, integration=${{ needs.integration.result }}, functional=${{ needs.functional.result }}"
          exit 1
