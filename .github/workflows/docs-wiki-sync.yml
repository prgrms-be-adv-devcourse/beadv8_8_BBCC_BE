# develop 에 docs/ 변경이 들어오면 위키를 docs/ 내용으로 다시 만든다
# 위키는 결과물이다. 위키에서 직접 고친 내용은 다음 동기화 때 덮어쓰이니 수정은 docs/ 에서 PR 로 한다
# 페이지 이름 · 링크 변환은 .github/scripts/docs-wiki-sync.py
# 위키 저장소는 웹에서 위키 페이지를 한 번 만들어야 생긴다. 없으면 checkout 단계에서 실패한다
name: Docs Wiki Sync

on:
  push:
    branches: [develop]
    paths:
      - docs/**
      - .github/scripts/docs-wiki-sync.py
      - .github/workflows/docs-wiki-sync.yml
  workflow_dispatch:

# 머지가 연달아 들어와도 차례로 반영한다
concurrency:
  group: docs-wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Build wiki pages
        run: python3 -I .github/scripts/docs-wiki-sync.py docs .wiki "${GITHUB_SHA::7}"

      - name: Push to wiki
        working-directory: .wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "위키에 바뀐 것이 없다"
            exit 0
          fi
          git commit -m "docs: ${GITHUB_SHA::7} 반영"
          git push
