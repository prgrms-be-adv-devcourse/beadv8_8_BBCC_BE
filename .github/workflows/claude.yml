name: Claude

# PR 댓글 · 리뷰에 @claude를 쓰면 다시 리뷰하거나 질문에 답한다
# 쓰기 권한이 있는 사람만 부를 수 있다 (claude-code-action 기본 동작)
# 댓글 이벤트는 기본 브랜치(develop)에 있는 워크플로로 실행되므로, develop에 머지된 뒤부터 동작한다
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: Claude 호출
    # 이슈 댓글은 PR에 단 것만 받는다
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    # 같은 PR에서 @claude를 연달아 부르면 앞선 실행이 끝난 뒤 돈다. 질문마다 답해야 하므로 취소하지 않는다
    # job에 둬서 if를 통과한 실행만 묶는다(워크플로에 두면 @claude 없는 댓글이 기다리던 실행을 밀어낸다)
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 댓글은 Claude GitHub App 토큰으로 남긴다(작성자 claude[bot]). id-token으로 App 토큰을 받는다
    # App 토큰은 아래 권한에 묶이지 않으므로, 읽기 전용은 허용 도구와 --disallowedTools로 지킨다
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 응답
        id: claude
        # 실패해도 다음 단계에서 사용량 초과인지 보고 결과를 정한다
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*)"
            --append-system-prompt "이 저장소에서는 읽기 전용으로 리뷰와 질문 답변만 해요. 코드를 고치거나 커밋 · push하지 말고, 고칠 방법은 댓글로 제안해 주세요. 기준은 루트 CLAUDE.md와 바뀐 도메인 폴더의 CLAUDE.md이고, 댓글은 한국어 해요체로 써 주세요."

      # 구독 사용량을 넘어 실패했으면 건너뛴 것으로 두고 PR에 알린다. 그 밖의 실패는 그대로 실패로 남긴다
      # 판별: 실행 기록에 사용량 거절(rate_limit_event rejected) 또는 assistant 오류 rate_limit가 있는지
      - name: 사용량 초과 확인
        if: steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          limited=$(jq '[.[] | select((.type == "rate_limit_event" and .rate_limit_info.status == "rejected") or (.type == "assistant" and .error == "rate_limit"))] | length' "$EXECUTION_FILE" 2>/dev/null || echo 0)
          if [ "$limited" = "0" ]; then
            echo "::error::Claude 응답이 실패했어요. 위 단계 로그를 확인해 주세요"
            exit 1
          fi
          resets=$(jq -r '[.[] | select(.type == "rate_limit_event") | .rate_limit_info.resetsAt // empty] | last // empty' "$EXECUTION_FILE")
          when=""
          if [ -n "$resets" ]; then
            [ "$resets" -gt 100000000000 ] && resets=$((resets / 1000))
            when=" $(TZ=Asia/Seoul date -d "@$resets" '+%m/%d %H:%M') 이후 다시 쓸 수 있어요."
          fi
          echo "::warning::Claude 구독 사용량을 넘어 응답을 건너뛰었어요.$when"
          gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "Claude 구독 사용량을 넘어 이번 응답은 건너뛰었어요.$when 다시 받으려면 \`@claude 리뷰해 주세요\`라고 댓글을 달아 주세요."
