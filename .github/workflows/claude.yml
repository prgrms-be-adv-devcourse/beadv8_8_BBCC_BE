name: Claude

# PR 댓글 · 리뷰에 @claude를 쓰면 다시 리뷰하거나 질문에 답한다
# 쓰기 권한이 있는 사람만 부를 수 있다 (claude-code-action 기본 동작)
# 댓글 이벤트는 기본 브랜치(develop)에 있는 워크플로로 실행되므로, develop에 머지된 뒤부터 동작한다
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: Claude 호출
    # 이슈 댓글은 PR에 단 것만 받는다
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 읽기 전용: 코드를 고치거나 push하지 않고 댓글만 남긴다
    # Claude GitHub App 대신 이 job의 GITHUB_TOKEN(아래 권한만 가짐)으로 댓글을 남긴다. 댓글 작성자는 github-actions[bot]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 응답
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --append-system-prompt "이 저장소에서는 읽기 전용으로 리뷰와 질문 답변만 해요. 코드를 고치거나 커밋 · push하지 말고, 고칠 방법은 댓글로 제안해 주세요. 기준은 루트 CLAUDE.md와 바뀐 도메인 폴더의 CLAUDE.md이고, 댓글은 한국어 해요체로 써 주세요."
