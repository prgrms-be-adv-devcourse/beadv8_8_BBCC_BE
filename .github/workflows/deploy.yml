# develop → dev 환경, main → prod 환경(Environment 승인 필요)으로 배포한다.
# 이미지를 GHCR에 올리고, deploy/ (compose · deploy.sh · .env.<환경> + Secret) 를 서버 /opt/app/<환경>/ 에 올린 뒤 그 deploy.sh 가 compose pull / up 을 한다.
# 패키지가 private이라 배포 때마다 GITHUB_TOKEN으로 GHCR에 로그인한다. 자격증명은 세션 임시 디렉터리에만 두고 끝나면 지운다.
# 배포 전에 CI(ci.yml)를 이미지 빌드와 동시에 돌리고, 둘 다 성공해야 서버에 올린다.
# 롤백: workflow_dispatch 로 이미 GHCR에 있는 커밋 SHA 를 넣으면 CI · 빌드 없이 그 이미지를 배포한다.
# 롤백 때도 compose · .env 는 실행한 브랜치의 현재 것이 올라간다. 설정 키가 바뀐 커밋으로 되돌릴 땐 주의한다.
# 이미지는 넷이다: 앱(<저장소>:<SHA>), 검색 서비스(<저장소>-search-service:<SHA>), Gateway(<저장소>-gateway:<SHA>), Elasticsearch(<저장소>-elasticsearch:<docker/elasticsearch 트리 해시>).
# Elasticsearch 는 앱 서버가 아니라 t3.medium k3s(deploy/search)에 뜬다. 검색이 켜진 환경이면 elasticsearch job 이 앱보다 먼저 올린다.
# 검색 서비스 이미지가 없는 커밋(검색 배포 전)으로는 검색이 켜진 환경(dev)을 SHA 롤백할 수 없다.
# 같은 이유로 Gateway 이미지가 없는 커밋(Gateway 배포 전)으로는 Gateway 가 켜진 환경(dev · prod)을 SHA 롤백할 수 없다.
# Elasticsearch 이미지는 docker/elasticsearch 가 바뀐 뒤 첫 배포 때만 빌드한다. docker/** 만 바뀐 push 는 배포를 띄우지 않으니 다음 배포에 반영된다.
# workflow_dispatch 를 develop · main 이 아닌 브랜치에서 실행하면 그 브랜치가 dev 환경에 배포된다 (기능 브랜치 확인용).
name: deploy

on:
  push:
    branches: [develop, main]
    # 앱 이미지 · 서버 설정과 상관없는 변경만 있으면 앱을 다시 띄우지 않는다 (재기동 중 잠깐 끊김)
    # 모니터링은 monitoring-deploy.yml 이, 루트 docker/ · docker-compose.yml 은 로컬 개발용이다. .md 는 .dockerignore 로 이미지에도 안 들어간다
    paths-ignore:
      - deploy/monitoring/**
      - deploy/monitoring-agent/**
      - docker/**
      - docker-compose.yml
      - docs/**
      - wiki/**
      - '**.md'
  workflow_dispatch:
    inputs:
      sha:
        description: 롤백용. 이미 GHCR에 있는 40자 전체 커밋 SHA. 비우면 현재 커밋을 새로 빌드한다
        type: string
        required: false

permissions:
  contents: read

# 같은 환경(dev · prod)으로 가는 배포는 한 번에 하나만 돈다. 진행 중인 배포는 취소하지 않고, 대기 중인 run 은 최신 것으로 대체된다
concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  # PR 때 돈 CI 는 그때의 develop 기준이라, 머지된 커밋을 다시 검사한다. 롤백이면 이미 배포됐던 커밋이라 생략한다
  ci:
    if: inputs.sha == ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    # 롤백이면 이미지가 이미 있으므로 빌드를 생략한다
    if: inputs.sha == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 앱 모듈(apps/ 아래 폴더)마다 따로 빌드한다. 하나라도 실패하면 배포하지 않는다
    strategy:
      matrix:
        app: [kidly-app, search-service, gateway]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # jar 는 Dockerfile 의 멀티스테이지 빌드가 만든다.
      # GHCR 이미지 이름은 소문자여야 하는데 github.repository 에는 대문자가 있을 수 있다
      # source 라벨로 GHCR 패키지를 이 저장소에 연결한다 (새 패키지도 GITHUB_TOKEN 으로 받을 수 있게)
      - name: 이미지 빌드 · 푸시
        env:
          APP: ${{ matrix.app }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$APP" == kidly-app ]] || IMAGE="$IMAGE-$APP"
          docker build --build-arg APP="$APP" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      # 태그가 docker/elasticsearch 의 트리 해시라 폴더가 그대로면 이미 있는 이미지를 쓴다
      - name: Elasticsearch 이미지 빌드 · 푸시 (없을 때만)
        if: matrix.app == 'search-service'
        run: |
          ES_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-elasticsearch:$(git rev-parse --short=12 HEAD:docker/elasticsearch)"
          if docker manifest inspect "$ES_IMAGE" > /dev/null 2>&1; then
            echo "이미 있음: $ES_IMAGE"
            exit 0
          fi
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$ES_IMAGE" docker/elasticsearch
          docker push "$ES_IMAGE"

  # 검색 서비스가 뜰 때 붙을 Elasticsearch 를 t3.medium k3s 에 먼저 올린다
  # 앱과 같이 CI 를 기다린다. CI 가 실패한 커밋으로 ES 만 바뀌는 부분 배포를 막는다
  elasticsearch:
    needs: [ci, build]
    # CI 와 빌드가 모두 성공했거나 롤백(둘 다 생략)인 경우만
    if: ${{ !cancelled() && (inputs.sha != '' || (needs.ci.result == 'success' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    outputs:
      search: ${{ steps.search.outputs.on }}
    env:
      SSH_HOST: ${{ vars.MONITORING_SSH_HOST }}
    steps:
      - uses: actions/checkout@v7

      # 검색이 꺼진 환경(.env.<환경> 의 COMPOSE_PROFILES 에 search 없음)이면 아무것도 하지 않는다. deploy job 도 이 값을 쓴다
      - name: 검색이 켜진 환경인지 확인
        id: search
        env:
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          profiles=$(sed -n 's/^COMPOSE_PROFILES=//p' "deploy/.env.$APP_ENV" | tail -n 1)
          if [[ ",$profiles," == *,search,* ]]; then on=true; else on=false; fi
          echo "on=$on" >> "$GITHUB_OUTPUT"
          echo "검색: $on"

      # deploy job 이 .env 에 넣는 MONITORING_PRIVATE_IP 도 여기서 봐서, 빠졌으면 어느 서버도 바꾸지 않는다
      - name: 검색 서버 변수 확인
        if: steps.search.outputs.on == 'true'
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          MONITORING_SSH_HOST: ${{ vars.MONITORING_SSH_HOST }}
          MONITORING_SSH_KNOWN_HOSTS: ${{ vars.MONITORING_SSH_KNOWN_HOSTS }}
          MONITORING_PRIVATE_IP: ${{ vars.MONITORING_PRIVATE_IP }}
        run: |
          missing=0
          [[ -n "$MONITORING_SSH_HOST" ]] || { echo "::error::Environment $APP_ENV 에 변수 MONITORING_SSH_HOST(t3.medium 의 탄력적 IP)를 등록하세요"; missing=1; }
          [[ -n "$MONITORING_SSH_KNOWN_HOSTS" ]] || { echo "::error::Environment $APP_ENV 에 변수 MONITORING_SSH_KNOWN_HOSTS(로컬에서 ssh-keyscan -H <탄력적 IP> 한 결과)를 등록하세요"; missing=1; }
          # .env 에 그대로 들어가고 틀리면 검색 서비스가 ES 에 못 붙어 기동에 실패하므로 형식까지 본다
          [[ "$MONITORING_PRIVATE_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "::error::Environment $APP_ENV 에 변수 MONITORING_PRIVATE_IP(t3.medium 의 사설 IPv4)를 등록하세요"; missing=1; }
          (( missing == 0 )) || exit 1

      - uses: docker/login-action@v3
        if: steps.search.outputs.on == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build 잡과 같은 태그. 롤백이어도 실행한 브랜치의 docker/elasticsearch 를 따른다
      # k3s 는 옛 Pod 를 먼저 내린 뒤 새 이미지를 받으므로(Recreate), 받을 수 없는 이미지면 서버를 건드리기 전에 멈춘다
      # (docker/** 만 바뀐 push 는 배포를 띄우지 않아 새 태그가 빌드되지 않았을 수 있다)
      - name: Elasticsearch 이미지 확인
        id: image
        if: steps.search.outputs.on == 'true'
        run: |
          ES_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-elasticsearch:$(git rev-parse --short=12 HEAD:docker/elasticsearch)"
          docker manifest inspect "$ES_IMAGE" > /dev/null || { echo "::error::$ES_IMAGE 가 GHCR 에 없거나 받을 수 없습니다. docker/elasticsearch 가 바뀌었다면 develop 에서 deploy 를 한 번 새로 돌려 이미지를 빌드하세요"; exit 1; }
          echo "es_image=$ES_IMAGE" >> "$GITHUB_OUTPUT"

      # deploy-notify.yml 이 이 step 이름으로 "18시 이후 서버 꺼짐" 안내를 붙인다
      - name: 서버 접속 확인 · SSH 키 준비
        if: steps.search.outputs.on == 'true'
        uses: ./.github/actions/server-ssh
        with:
          host: ${{ env.SSH_HOST }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.MONITORING_SSH_KNOWN_HOSTS }}

      # 데이터는 k3s PVC 라 그대로다
      - name: 서버에 설정 파일 올리기
        if: steps.search.outputs.on == 'true'
        run: |
          dir=/opt/app/search
          tar -C deploy/search -czf - elasticsearch.yaml deploy.sh \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 "deploy@$SSH_HOST" \
              "mkdir -p $dir && tar -xzf - --no-same-owner -C $dir"

      - name: 배포
        if: steps.search.outputs.on == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ES_IMAGE: ${{ steps.image.outputs.es_image }}
        run: |
          # 토큰은 명령줄이 아니라 stdin 으로 넘긴다. deploy.sh 가 namespace 의 pull secret 으로 만든다
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 "deploy@$SSH_HOST" \
            "GHCR_USER=$GHCR_USER ES_IMAGE=$ES_IMAGE /opt/app/search/deploy.sh"

  deploy:
    needs: [ci, build, elasticsearch]
    # CI 와 빌드가 모두 성공했거나 롤백(둘 다 생략)인 경우만 배포한다. Elasticsearch 배포가 실패하면 앱도 올리지 않는다
    if: ${{ !cancelled() && (inputs.sha != '' || (needs.ci.result == 'success' && needs.build.result == 'success')) && needs.elasticsearch.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
    steps:
      - uses: actions/checkout@v7

      # 잘못된 SHA 면 서버 파일을 바꾸기 전에 멈춘다
      - name: 배포할 커밋 확인
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha 는 40자 전체 커밋 SHA 여야 합니다: $SHA"; exit 1; }

      # deploy-notify.yml 이 이 step 이름으로 "18시 이후 서버 꺼짐" 안내를 붙인다
      - name: 서버 접속 확인 · SSH 키 준비
        uses: ./.github/actions/server-ssh
        with:
          host: ${{ env.SSH_HOST }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}   # 로컬에서 ssh-keyscan -H <host> 한 결과

      # 서버의 DB 데이터와 로그 말고는 전부 레포와 Environment Secret 에서 매번 새로 만든다. 비밀 값은 출력하지 않는다
      - name: 서버 설정 파일 만들기
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          PAYMENT_KEY_ENCRYPTION_KEY: ${{ secrets.PAYMENT_KEY_ENCRYPTION_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SEARCH_ON: ${{ needs.elasticsearch.outputs.search }}
          MONITORING_PRIVATE_IP: ${{ vars.MONITORING_PRIVATE_IP }}
        run: |
          umask 077
          out="$RUNNER_TEMP/deploy-files"
          mkdir -p "$out/jwt"
          cp -p deploy/docker-compose.yml deploy/deploy.sh "$out/"

          # 한 줄짜리 비밀. .env 뒤에 붙인다
          keys=(DB_PASSWORD KAKAO_CLIENT_SECRET TOSS_SECRET_KEY PAYMENT_KEY_ENCRYPTION_KEY)
          # 없어도 되는 비밀. 있으면 붙이고 없으면 건너뛴다 (MAIL_PASSWORD 가 없으면 메일은 보내지 않고 로그만 남긴다)
          [[ -z "$MAIL_PASSWORD" ]] || keys+=(MAIL_PASSWORD)
          # 빠지거나 작은따옴표 · 줄바꿈이 든 Secret 이 있으면 스크립트가 안내를 남기고 실패해 이 단계도 멈춘다
          secret_lines=$(.github/scripts/env-lines.sh "$APP_ENV" "${keys[@]}")

          # 여러 줄 PEM 이라 따로 검사한다
          missing=0
          for key in JWT_PRIVATE_KEY JWT_PUBLIC_KEY; do
            [[ -n "${!key}" ]] || { echo "::error::Environment $APP_ENV 에 Secret $key 가 없습니다"; missing=1; }
          done
          (( missing == 0 )) || exit 1

          {
            cat "deploy/.env.$APP_ENV"
            echo
            # 검색 서비스가 붙을 Elasticsearch(t3.medium k3s). 비밀은 아니지만 레포가 공개라 사설 IP 를 변수에서 붙인다. 형식은 elasticsearch job 이 확인했다
            if [[ "$SEARCH_ON" == true ]]; then
              echo "ELASTICSEARCH_URIS=http://$MONITORING_PRIVATE_IP:30920"
            fi
            echo "# 아래는 배포 때 GitHub Environment Secret 에서 붙인 값이다"
            printf '%s\n' "$secret_lines"
            printf "POSTGRES_PASSWORD='%s'\n" "$DB_PASSWORD"
          } > "$out/.env"

          for key in JWT_PRIVATE_KEY JWT_PUBLIC_KEY; do
            [[ "${!key}" == *BEGIN* ]] || { echo "::error::$key 가 PEM 형식이 아닙니다"; exit 1; }
          done
          printf '%s\n' "$JWT_PRIVATE_KEY" > "$out/jwt/private.pem"
          printf '%s\n' "$JWT_PUBLIC_KEY" > "$out/jwt/public.pem"

      # 파일 이름을 나열해 올린다 (. 을 통째로 올리면 /opt/app/<환경> 자체의 권한이 바뀐다)
      - name: 서버에 설정 파일 올리기
        env:
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          dir="/opt/app/$APP_ENV"
          tar -C "$RUNNER_TEMP/deploy-files" -czf - docker-compose.yml deploy.sh .env jwt \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 "deploy@$SSH_HOST" \
              "mkdir -p $dir && tar -xzf - --no-same-owner -C $dir && chmod 700 $dir/jwt && chmod 600 $dir/.env $dir/jwt/private.pem"

      - name: 배포
        id: deploy
        env:
          SHA: ${{ inputs.sha || github.sha }}
          APP_ENV: ${{ vars.APP_ENV }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # 토큰은 명령줄이 아니라 stdin 으로 넘긴다. 자격증명은 이 세션만의 임시 디렉터리에 두고 끝나면 지운다
          # (dev · prod 가 같은 서버를 쓸 때 공유 ~/.docker/config.json 을 서로 지우지 않도록)
          # 기동 실패 원인을 다음 단계에서 뽑도록 출력을 파일에도 남긴다
          set -o pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 "deploy@$SSH_HOST" "
            export DOCKER_CONFIG=\$(mktemp -d)
            trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
            docker login ghcr.io -u $GHCR_USER --password-stdin > /dev/null || exit 1
            APP_ENV=$APP_ENV IMAGE=$IMAGE:$SHA SEARCH_IMAGE=$IMAGE-search-service:$SHA \
              GATEWAY_IMAGE=$IMAGE-gateway:$SHA \
              /opt/app/$APP_ENV/deploy.sh
          " 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      # deploy-notify.yml 이 이 주석(title 앱 기동 실패)을 읽어 장애 채널로 원인을 보낸다. 실행 화면 맨 위에도 보인다
      - name: 기동 실패 원인 남기기
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          cause=$(.github/scripts/startup-error.sh "$RUNNER_TEMP/deploy.log")
          [ -n "$cause" ] || exit 0
          # 주석 메시지는 % · CR · LF 를 인코딩해야 여러 줄이 유지된다
          cause=${cause//'%'/'%25'}
          cause=${cause//$'\r'/'%0D'}
          cause=${cause//$'\n'/'%0A'}
          echo "::error title=앱 기동 실패::$cause"
