# GHCR에 쌓인 오래된 컨테이너 이미지 버전을 정리하고 최근 N개만 남긴다.
# deploy.yml 이 develop · main 에 push 할 때마다 커밋 SHA 태그 이미지를 올리므로 그대로 두면 계속 쌓이고,
# 무료 조직의 패키지 저장 한도를 넘길 수 있다.
# 태그 유무와 관계없이 최근 N개만 남기고 나머지는 오래된 것부터 지운다.
# push 한 번 = 버전 하나 (docker build · push 단일 이미지) 라는 전제로 개수를 센다.
# develop 은 하루에도 수십 번 배포되므로 개수 기준이면 main(prod) 이미지가 먼저 밀려날 수 있다.
# 기본값 50개는 develop 며칠 분량이다.
# 지운 버전은 복구할 수 없어서 그 SHA 로는 deploy.yml 롤백을 할 수 없다.
# 오래된 prod 로 되돌려야 하면 SHA 롤백 대신 git revert 후 다시 배포한다.
# 서버에서 돌고 있는 컨테이너는 로컬 이미지를 쓰므로 영향이 없다.
# 커밋마다 쌓이는 앱 · 검색 서비스(<저장소>-search-service) 패키지를 정리한다.
# Elasticsearch(<저장소>-elasticsearch)는 docker/elasticsearch 가 바뀔 때만 쌓이고, 지우면 그 태그를 다시 빌드해야 해서 두지 않는다.
# 매주 월요일 10:00 KST 에 돌고, 수동 실행 때는 남길 개수를 바꿀 수 있다.
name: ghcr-cleanup

on:
  schedule:
    - cron: '0 1 * * 1' # 월요일 01:00 UTC = 10:00 KST
  workflow_dispatch:
    inputs:
      keep:
        description: 남길 최근 버전 개수 (5 이상의 정수)
        type: string
        required: false
        default: '50'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      # 한 패키지가 실패해도 나머지는 정리한다
      fail-fast: false
      matrix:
        # 저장소 이름 뒤에 붙는 접미사. 앱은 접미사가 없다
        suffix: ['', '-search-service']
    steps:
      # schedule 로 돌면 inputs 가 비어 있으므로 기본값 50 을 쓴다.
      # GHCR 패키지 이름은 소문자 저장소 이름이다. github.repository 에는 대문자가 있을 수 있다
      - name: 입력 검증 · 패키지 이름 계산
        id: prepare
        env:
          KEEP: ${{ inputs.keep || '50' }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          if ! [[ "$KEEP" =~ ^[0-9]+$ ]] || [ "$KEEP" -lt 5 ]; then
            echo "::error::keep 은 5 이상의 정수여야 합니다: '$KEEP'"
            exit 1
          fi
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "package=${REPO,,}$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "keep=$KEEP" >> "$GITHUB_OUTPUT"

      - name: 오래된 이미지 버전 삭제
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.prepare.outputs.package }}
          package-type: container
          min-versions-to-keep: ${{ steps.prepare.outputs.keep }}
          delete-only-untagged-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}
