name: Slack Daily Summary

on:
  schedule:
    # 평일 07:37 KST (전날 22:37 UTC라 요일은 일~목). UTC 자정 직후는 예약이 몰려 몇 시간씩 늦어지기 쉬워 피한다
    # 예약 실행은 늦어지거나 빠질 수 있어 30분 간격으로 두 번 더 건다. 그날 처음 성공한 실행만 보낸다
    - cron: '37 22 * * 0-4'
    - cron: '7 23 * * 0-4'
    - cron: '37 23 * * 0-4'
  workflow_dispatch:

# 예약이 겹쳐 동시에 시작돼도 앞 실행이 끝난 뒤에 돌아, 이미 보냈는지 확인할 수 있게 한다
concurrency:
  group: slack-daily-summary

permissions:
  issues: read
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Send issue progress to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # 요약은 별도 채널로 보낸다. 그 채널의 웹훅 시크릿이 없으면 알림 채널로 보낸다
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DAILY_SUMMARY_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # {"GitHub아이디": "이름"} 형식의 Actions 변수. public 레포라 실명을 코드에 두지 않는다
          NAME_MAP: ${{ vars.SLACK_NAME_MAP }}
        run: |
          # 예약 실행은 오늘(KST) 이미 성공한 실행이 있으면 보내지 않는다. 수동 실행은 늘 보낸다
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DAY_START=$(date -u -d "$(TZ=Asia/Seoul date +%F) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
            SENT=$(gh run list -R "$REPO" --workflow slack-daily-summary.yml --status success \
              --created ">=$DAY_START" --json databaseId --jq 'length')
            if [ "$SENT" -gt 0 ]; then
              echo "오늘 요약은 이미 보냈다. 건너뛴다"
              exit 0
            fi
          fi

          # 매핑이 없거나 JSON이 잘못되면 GitHub 아이디를 그대로 쓴다
          MAP=$(printf '%s' "${NAME_MAP:-}" | jq -c 'if type == "object" then . else {} end' 2>/dev/null || true)
          [ -n "$MAP" ] || MAP='{}'

          # 월요일은 금요일 아침부터, 그 외에는 어제 아침부터 닫힌 이슈를 모은다
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
            DAYS=3; SINCE_LABEL="금요일 7시 이후"
          else
            DAYS=1; SINCE_LABEL="어제 7시 이후"
          fi
          # 예약 실행이 늦어져도 기준은 그날 07:00 KST로 고정한다. 실행 시각(UTC)은 전날이라 날짜는 KST로 센다.
          # 기준을 예약 시각보다 앞에 둬서, 실행 뒤에 닫힌 이슈도 다음 날 요약에 잡힌다
          SINCE=$(date -u -d "$(TZ=Asia/Seoul date -d "-$DAYS days" +%F) 07:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          TODAY=$(TZ=Asia/Seoul date +%m/%d)

          # PR과 '계획 안 함(not planned)'으로 닫힌 이슈는 세지 않는다
          gh api --paginate "repos/$REPO/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request | not) | select(.state_reason != "not_planned")' \
            | jq -s '.' > issues.json

          # 메시지 구성
          # - 머리: 날짜, 전체 완료율
          # - 담당자별 진행률: 2열 카드. 담당자가 여럿이면 각자에게 세고, 매핑에 있는 사람은 맡은 이슈가 없어도 0/0으로 보여 준다
          # - 처리된 이슈: 진행률처럼 담당자별 2열 카드(많이 처리한 순). 말머리([FEAT] 등)는 빼고 제목은 짧게 자른다.
          #   사람마다 3개까지만 보여 주고, 링크는 담당자 줄 끝의 '보기'에만 건다(그 사람의 처리된 이슈 검색)
          jq --argjson map "$MAP" --arg since "$SINCE" --arg sinceLabel "$SINCE_LABEL" \
            --arg today "$TODAY" --arg url "https://github.com/$REPO/issues" --argjson shown 3 '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def who: if (.assignees | length) > 0 then [.assignees[].login | ($map[.] // .)] else ["담당자 없음"] end;
            def pct($done; $total): if $total > 0 then $done * 100 / $total | round else 0 end;
            # 막대 5칸(한 칸 20%). 색은 80% 이상 초록, 50% 이상 파랑, 그 밑은 보라. 칸은 내림이라 100%일 때만 다 차고, 0%가 아니면 최소 한 칸은 칠한다
            def bar($p):
              (if $p > 0 then [($p / 20 | floor), 1] | max else 0 end) as $n
              | (if $p >= 80 then "🟩" elif $p >= 50 then "🟦" else "🟪" end) as $c
              | ($c * $n // "") + ("⬜" * (5 - $n) // "");
            def short: sub("^\\[[A-Z]+\\]\\s*"; "");
            # 2열 카드에서 줄이 넘어가지 않게 제목을 자른다
            def cut($n): if length > $n then .[:$n] + "…" else . end;
            # 기준 시각 이후 그 담당자가 처리한 이슈 검색 링크. 로그인이 비어 있으면("담당자 없음") 담당자 없는 이슈.
            # Slack 링크 <주소|글자>가 닫는 꺾쇠에서 끊기지 않게 이상(>=) 대신 범위(날짜..*)를 쓰고, 공백은 + 로 넣는다
            def closedSearch($login):
              ["is:issue", "is:closed", "reason:completed", "closed:\($since)..*",
                (if $login == "" then "no:assignee" else "assignee:\($login)" end)]
              | "\($url)?q=\(join("+"))";
            def counts($done; $total): if $total == 0 then "아직 맡은 이슈가 없어요" else "\($done)개 완료 · \($total - $done)개 남음" end;

            . as $issues
            | ($issues | length) as $total
            | ([$issues[] | select(.state == "closed")] | length) as $done
            | ([$issues[] | (.state == "closed") as $d | who[] | {who: ., done: $d}]
                | group_by(.who)
                | map({who: .[0].who, total: length, done: (map(select(.done)) | length)})
                | . as $rows
                | $rows + [$map[] | select(. as $n | $rows | all(.who != $n)) | {who: ., total: 0, done: 0}]
                | map(. + {pct: pct(.done; .total)})
                | sort_by(.who == "담당자 없음", -.total, -.pct)) as $people
            | ([$issues[] | select(.state == "closed" and .closed_at >= $since)] | sort_by(.number)) as $closed
            | {
                text: "📊 이슈 진행률 \($today) · 전체 \(pct($done; $total))% (\($done)/\($total))",
                blocks: (
                  [
                    {type: "header", text: {type: "plain_text", text: "📊 이슈 진행률 · \($today)"}},
                    {type: "section", text: {type: "mrkdwn",
                      text: "전체  \(bar(pct($done; $total)))  *\(pct($done; $total))%*\n\(counts($done; $total))   <\($url)|이슈 보기 →>"}},
                    {type: "divider"}
                  ]
                  # section 하나에 칸은 10개까지라 10명씩 나눈다
                  + [range(0; $people | length; 10) as $i
                      | {type: "section", fields: [$people[$i:$i + 10][]
                          | {type: "mrkdwn", text: "*\(.who | esc)*\n\(bar(.pct))  *\(.pct)%*\n\(counts(.done; .total))"}]}]
                  + [
                    {type: "divider"},
                    {type: "section", text: {type: "mrkdwn",
                      text: "*✅ \($sinceLabel) 처리된 이슈 \($closed | length)개*"}}
                  ]
                  + if ($closed | length) == 0 then
                      [{type: "context", elements: [{type: "mrkdwn", text: "처리된 이슈가 없어요"}]}]
                    else
                      # section 하나에 칸은 10개까지라 10명씩 나눈다
                      ($closed
                        | map(. as $i | (if (.assignees | length) > 0 then [.assignees[].login] else [""] end)[]
                            | {login: ., who: (if . == "" then "담당자 없음" else ($map[.] // .) end), issue: $i})
                        | group_by(.who)
                        | sort_by(.[0].who == "담당자 없음", -length)) as $groups
                      | [range(0; $groups | length; 10) as $g
                          | {type: "section", fields: [$groups[$g:$g + 10][]
                              | {type: "mrkdwn", text: (
                                  "*\(.[0].who | esc)*  \(length)개  <\(closedSearch(.[0].login))|보기 →>\n"
                                  + (.[:$shown] | map("#\(.issue.number)  \(.issue.title | short | cut(16) | esc)") | join("\n"))
                                  + (if length > $shown then "\n외 \(length - $shown)개" else "" end))}]}]
                    end
                )
              }' issues.json \
            | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
