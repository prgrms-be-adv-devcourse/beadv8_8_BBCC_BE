name: monitoring-deploy
on: workflow_dispatch
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: dev
    env:
      APP_HOST: ${{ vars.SSH_HOST }}
      MONITOR_HOST: ${{ vars.MONITORING_SSH_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/server-ssh
        with:
          host: ${{ vars.SSH_HOST }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
      - name: Check both existing deployment routes
        env:
          MONITOR_KNOWN_HOSTS: ${{ vars.MONITORING_SSH_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$MONITOR_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=8 "deploy@$APP_HOST" '
            set -e
            docker ps -a --filter label=com.docker.compose.project=dev --format "{{.Names}} {{.State}}" | awk "/gateway|order/ {print}"
            docker ps -a --format "{{.Names}} {{.State}}" | awk "/gateway|order/ {print}"
            test -r /opt/app/dev/docker-compose.yml
            test -r /opt/app/monitoring/config.alloy
          '
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=8 "deploy@$MONITOR_HOST" '
            set -e
            export KUBECONFIG="$HOME/.kube/config"
            kubectl -n monitoring get deploy grafana -o name
            kubectl -n monitoring auth can-i create pods/portforward
            kubectl -n monitoring auth can-i create networkpolicies
          '
