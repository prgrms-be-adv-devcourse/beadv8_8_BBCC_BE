name: monitoring-deploy
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: kafka-slack-trial-984
  cancel-in-progress: false
jobs:
  slack-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    env:
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Fire and resolve one temporary Kafka alert
        run: python3 .github/scripts/kafka-slack-trial.py
      - name: Remove temporary rule
        if: always()
        env:
          TRIAL_CLEANUP: "1"
        run: python3 .github/scripts/kafka-slack-trial.py
