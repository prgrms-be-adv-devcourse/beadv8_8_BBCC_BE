# 로컬 개발용 DB
services:
  postgres:
    image: postgres:18
    container_name: kidly-postgres
    environment:
      POSTGRES_DB: kidly
      POSTGRES_USER: kidly
      POSTGRES_PASSWORD: kidly
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
