# 로컬 개발용 DB + DB GUI(pgAdmin) + Logstash
services:
  postgres:
    image: postgres:18
    container_name: kidly-postgres
    environment:
      POSTGRES_DB: kidly
      POSTGRES_USER: kidly
      POSTGRES_PASSWORD: kidly
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  # http://localhost:5050 (로그인 없이 열린다. 서버 접속 비밀번호: kidly)
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: kidly-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kidly.dev
      PGADMIN_DEFAULT_PASSWORD: kidly
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

  # 앱 로그를 JSON으로 받아 표준 출력으로 보여 준다 (docker compose logs -f logstash)
  logstash:
    image: logstash:9.5.3
    container_name: kidly-logstash
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "5000:5000"
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro

volumes:
  postgres-data:
  pgadmin-data:
