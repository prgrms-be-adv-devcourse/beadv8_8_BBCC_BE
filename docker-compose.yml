# 로컬 개발용 DB + DB GUI(pgAdmin) + Kafka
services:
  postgres:
    image: postgres:18
    container_name: kidly-postgres
    environment:
      POSTGRES_DB: kidly
      POSTGRES_USER: kidly
      POSTGRES_PASSWORD: kidly
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  # http://localhost:5050 (로그인 없이 열린다. 서버 접속 비밀번호: kidly)
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: kidly-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kidly.dev
      PGADMIN_DEFAULT_PASSWORD: kidly
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

  # 도메인 간 이벤트를 전달한다 (localhost:9092). KRaft 단일 브로커라 복제 계수는 1
  kafka:
    image: apache/kafka:4.2.2
    container_name: kidly-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽 자동 생성을 끈다. 켜져 있으면 없는 토픽에 보내거나 구독할 때 파티션 1개짜리 토픽이 조용히 생겨 이름 오타가 묻힌다.
      # 토픽은 보내는 쪽이 코드(NewTopic)로 선언한다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 메시지 보존 7일(기본값을 명시). 주말에 EC2가 멈춰도 남고, 이벤트의 개인정보(가입 이메일 등)도 7일 뒤 지워진다
      KAFKA_LOG_RETENTION_HOURS: 168
      # 메시지 · 책갈피를 볼륨(kafka-data)에 쓴다. 이미지 기본값은 컨테이너 안 /tmp라서, 없으면 컨테이너를 다시 만들 때 모두 사라진다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # 검색 서비스(apps/search-service)의 색인 (http://localhost:9200). 한글 형태소 분석기(nori)를 넣은 이미지라 처음에 빌드한다
  # 보안은 끈다(로컬 전용). 힙은 서버와 같게 512MB로 고정한다
  elasticsearch:
    build: ./docker/elasticsearch
    container_name: kidly-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  # bootRun 으로 띄운 앱의 메트릭을 수집한다 (http://localhost:9090)
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: kidly-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # http://localhost:3000 (로그인 없이 관리자로 열린다). 대시보드는 운영과 같은 파일을 쓴다
  # 로그(Loki)와 Slack 알림은 로컬에 없다. "Kidly 로그" 대시보드는 데이터소스가 없어 비어 있다
  grafana:
    image: grafana/grafana:12.4.12
    container_name: kidly-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_LANGUAGE: ko-KR
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  pgadmin-data:
  prometheus-data:
  grafana-data:
  kafka-data:
  elasticsearch-data:
