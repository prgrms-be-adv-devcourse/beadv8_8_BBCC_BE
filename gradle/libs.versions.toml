# Boot BOM이 관리하지 않는 버전만 둔다. BOM이 관리하는 starter는 빌드 파일에서 버전 없이 쓴다
[versions]
spring-boot = "4.1.1"
dependency-management = "1.1.7"
querydsl = "7.7"
springdoc = "3.1.1"
archunit = "1.5.1"
spring-dotenv = "5.1.0"
aws-sdk = "2.55.16"
# Gateway(apps/gateway)만 쓴다. Boot 4.0.x · 4.1.x와 호환되는 release train
spring-cloud = "2025.1.4"

[libraries]
querydsl-jpa = { module = "io.github.openfeign.querydsl:querydsl-jpa", version.ref = "querydsl" }
# :jpa classifier는 catalog에 못 넣어 쓰는 곳에서 variantOf로 붙인다
querydsl-apt = { module = "io.github.openfeign.querydsl:querydsl-apt", version.ref = "querydsl" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spring-dotenv = { module = "me.paulschwarz:springboot4-dotenv", version.ref = "spring-dotenv" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# build-logic이 convention plugin에서 id로 적용할 Gradle 플러그인
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }
